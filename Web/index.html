<!doctype html>
<html lang="zh-CN" data-theme="light" data-skin="sage" data-updown="green-up">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 币安 CloudFront 对带 sslip.io 来源页的请求直接回 403（且不带跨域头），所以一律不发 Referer -->
<meta name="referrer" content="no-referrer">
<title>Hkline</title>
<link rel="icon" href="data:,">
<script>
  // 首帧前就把皮肤、深浅与涨跌色套上，避免闪一下默认色。涨跌出厂绿涨红跌；「一律绿涨」迁移（greenUpMigrated）之前存的红涨不算数
  try { var s = JSON.parse(localStorage.getItem('hkline-web-v1') || '{}'), r = document.documentElement
    if (s.theme) r.dataset.theme = s.theme; if (s.skin) r.dataset.skin = s.skin; r.dataset.updown = s.updown === 'red-up' && s.greenUpMigrated === true ? 'red-up' : 'green-up' } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header class="app-header">
    <a class="brand" href="#home" aria-label="Hkline 首页"><span class="mark" data-icon="logo:icon-24"></span>Hkline</a>
    <nav class="nav" aria-label="主导航">
      <a href="#home" data-page="home">首页</a>
      <a href="#chart" data-page="chart">图表</a>
      <a href="#sectors" data-page="sectors">板块</a>
      <a href="#review" data-page="review">复盘</a>
    </nav>
    <div class="header-spacer"></div>
    <button class="search-trigger" id="searchTrigger" aria-label="搜索品种"><span data-icon="search:icon-16"></span><span>搜索品种、代号、中文名</span><kbd>⌘</kbd><kbd>K</kbd></button>
    <div class="header-actions">
      <button class="ibtn" id="hdrAlerts" data-tip="提醒" data-tip-side="bottom" aria-label="提醒"><span data-icon="bell"></span></button>
      <button class="ibtn" id="hdrTheme" data-tip="切换深浅色" data-tip-side="bottom" aria-label="切换深浅色"><span data-icon="moon"></span></button>
      <button class="avatar out" id="hdrAvatar" data-tip="我的" data-tip-side="bottom" aria-label="我的"></button>
    </div>
  </header>

  <main id="pages" style="min-height:0;display:grid">
    <section class="page" id="page-home" aria-label="首页"></section>

    <!-- 图表：画线栏 | 图 | 深度梯子（槽位）| 侧栏 | 图标栏；图下方是底部抽屉（槽位）。网格由 layoutSlots() 按开合状态生成 -->
    <section class="page" id="page-chart" aria-label="图表">
      <div class="card chart-toolbar" id="toolbar"></div>
      <div class="card drawbar" id="drawbar" role="toolbar" aria-label="画线工具" aria-orientation="vertical"></div>
      <div class="chart-area" id="chartArea" data-layout="1"></div>
      <aside class="card slot-ladder" id="ladderSlot" aria-label="深度梯子" hidden></aside>
      <aside class="card slot-drawer" id="drawerSlot" aria-label="底部抽屉" hidden></aside>
      <aside class="card side-panel" id="sidePanel"></aside>
      <nav class="card rail" id="rail" aria-label="侧栏"></nav>
    </section>

    <section class="page" id="page-sectors" aria-label="板块">
      <div class="card sec-list" id="secList"></div>
      <div class="card sec-members" id="secMembers"></div>
      <div class="card sec-preview" id="secPreview"></div>
    </section>

    <section class="page" id="page-review" aria-label="复盘"></section>

    <section class="page" id="page-me" aria-label="我的">
      <nav class="card me-nav" id="meNav" aria-label="我的"></nav>
      <div class="card me-body scroll" id="meBody"></div>
    </section>
  </main>
</div>

<div class="tooltip" id="tooltip" role="tooltip"></div>
<div class="toast-host" id="toasts" aria-live="polite"></div>


<script type="module" src="/src/main.ts"></script>
</body>
</html>
