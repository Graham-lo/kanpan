# 新加坡主机的 TCP 调优（2026-10-02）。装法：
#   sudo cp sysctl-90-kanpan-bbr.conf /etc/sysctl.d/90-kanpan-bbr.conf
#   echo tcp_bbr | sudo tee /etc/modules-load.d/kanpan-bbr.conf
#   sudo modprobe tcp_bbr && sudo sysctl --system && sudo tc qdisc replace dev eth0 root fq
#
# 为什么：新加坡到国内 / 美国的跨境线路对单条 TCP 连接丢包压制很重——实测 23:20 单流只有
# 101 KB/s、4 路并行能到 410 KB/s（并行能涨就说明不是实例带宽上限，腾讯轻量的带宽也改不了）。
# cubic 一丢包就减半，BBR 按测得的带宽 × 时延发、不理会随机丢包。换上以后同一时刻同一条路
# 单流 712 KB/s、4 路 1.5 MB/s，提升 7 倍。fq 是 BBR 配套的调度器（pacing 靠它）。
# 缓冲上限放到 16 MB 是给 150 ms 往返留足带宽时延积；notsent_lowat 让 Caddy 的 HTTP/2 多路
# 复用不被一条大响应塞死；slow_start_after_idle=0 让长连接空一会儿再发不用重新慢启动；
# mtu_probing 是跨境路径上黑洞 MTU 的保险。
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.core.wmem_max = 16777216
net.core.rmem_max = 16777216
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
