<meta charset="utf-8">
<title>看盘 账号</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* 看盘 · 账号（登录 / 注册 / 找回密码 / 同步与数据）原型
 *
 * 令牌、机身、四版主题与 prototype/自选原型.html、prototype/护眼设置原型.html 同源，
 * 一个新色都没加；危险操作用 --down，主操作用 --amber。
 *
 * 这一页要回答的其实只有四个问题：
 *   1) 不登录的人会不会被挡住          —— 不会。账号是可选项，第一屏永远是行情。
 *   2) 登录之后本机那份东西归谁        —— 登录时当场问，不偷偷合并，也不偷偷覆盖。
 *   3) 哪些数据会离开这台手机          —— 「同步与数据」里列成一张表，逐项写清楚。
 *   4) 忘了密码怎么回来 / 怎么彻底离开 —— 找回密码与注销账号都走完整流程，不是摆设。
 *
 * 安全上有三条在原型里就定死，实现时不许改：
 *   · 注册和找回密码的响应对「邮箱存在与否」保持一致，文案不泄露账号是否注册过；
 *   · 验证码 6 位、10 分钟、最多 5 次，失败与重发都有冷却，界面上要看得见倒计时；
 *   · 改密码、重置密码默认踢掉其他设备，不给用户一个「静默被别人占着」的账号。
 */

:root {
  color-scheme: light;

  --ground: #C7CCE4;
  --app: #FFFFFF;
  --chart: #F4F6FD;
  --raised: #FFFFFF;
  --raised2: #ECEFF9;
  --line: #DCE0F0;
  --hair: #12163A0F;
  --grid: #E4E7F5;
  --ink: #12163A;
  --ink2: #565C85;
  --ink3: #8B90B2;
  --green: #0E9E78;
  --red: #DE2E57;
  --amber: #B26A00;
  --amber-soft: #B26A0016;
  --amber-line: #B26A0055;
  --veil: #FFFFFFF0;
  --scrim: #12163A4D;
  --shadow: 0 30px 70px -28px #2B315E80, 0 0 0 1px #FFFFFF60 inset;
  --bezel: linear-gradient(160deg, #F4F5FB, #C9CEE3 45%, #9EA5C8);
  --seg-on: #FFFFFF;
  --pill-ink: #FFFFFF;
  --pill-mix: var(--ink);
  --pill-amt: 92%;
  --soft-amt: 14%;

  --p1: #B26A00; --p2: #4A55D6; --p3: #0E8F73; --p4: #C43A7E; --p5: #7A5BD6; --p6: #1A7FC4;

  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;

  --dw: 393px;
  --dh: 852px;
  --dr: 44px;
  --dtop: 59px;
  --dbot: 34px;
  --fit: 1;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --ground: #07091C; --app: #0F1230; --chart: #161A3F; --raised: #1C2154; --raised2: #232858;
    --line: #2A2E6E; --hair: #FFFFFF0A; --grid: #232858;
    --ink: #EDEEF8; --ink2: #A6A9C0; --ink3: #6D719A;
    --green: #2FBF8F; --red: #F0567B;
    --amber: #FFB454; --amber-soft: #FFB4541A; --amber-line: #FFB45455;
    --veil: #0F1230EE; --scrim: #040614AA;
    --shadow: 0 40px 90px -30px #000, 0 0 0 1px #343A80 inset;
    --bezel: linear-gradient(160deg, #2B3070, #12153A 42%, #0C0F2A);
    --p1: #FFB454; --p2: #8C95FF; --p3: #4FD1B5; --p4: #F78FB3; --p5: #C8B6FF; --p6: #7FD0FF;
    --seg-on: #1C2154; --pill-ink: #0B0E26; --pill-mix: #FFFFFF; --pill-amt: 100%;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #07091C; --app: #0F1230; --chart: #161A3F; --raised: #1C2154; --raised2: #232858;
  --line: #2A2E6E; --hair: #FFFFFF0A; --grid: #232858;
  --ink: #EDEEF8; --ink2: #A6A9C0; --ink3: #6D719A;
  --green: #2FBF8F; --red: #F0567B;
  --amber: #FFB454; --amber-soft: #FFB4541A; --amber-line: #FFB45455;
  --veil: #0F1230EE; --scrim: #040614AA;
  --shadow: 0 40px 90px -30px #000, 0 0 0 1px #343A80 inset;
  --bezel: linear-gradient(160deg, #2B3070, #12153A 42%, #0C0F2A);
  --p1: #FFB454; --p2: #8C95FF; --p3: #4FD1B5; --p4: #F78FB3; --p5: #C8B6FF; --p6: #7FD0FF;
  --seg-on: #1C2154; --pill-ink: #0B0E26; --pill-mix: #FFFFFF; --pill-amt: 100%;
}

:root[data-theme="paper"] {
  color-scheme: light;
  --ground: #B7B2A0; --app: #F4F0E4; --chart: #EDE8D9; --raised: #FAF7EE; --raised2: #E5DFCD;
  --line: #D9D2BD; --hair: #3A35241A; --grid: #E3DDC9;
  --ink: #2F2C25; --ink2: #625D4D; --ink3: #736D5D;
  --green: #387A58; --red: #B74B3F;
  --amber: #96660F; --amber-soft: #96660F16; --amber-line: #96660F55;
  --veil: #F4F0E4F0; --scrim: #3A35244D;
  --shadow: 0 30px 70px -28px #6B634B80, 0 0 0 1px #FFFDF660 inset;
  --bezel: linear-gradient(160deg, #F2EFE4, #C6C0AC 45%, #9C9682);
  --p1: #96660F; --p2: #5A63A8; --p3: #3F8A63; --p4: #A85A78; --p5: #7A6BA8; --p6: #3F7FA0;
  --seg-on: #FAF7EE; --pill-ink: #FFFFFF; --pill-mix: var(--ink); --pill-amt: 92%; --soft-amt: 11%;
}

:root[data-theme="night"] {
  color-scheme: dark;
  --ground: #0D0C0A; --app: #191712; --chart: #201D17; --raised: #262219; --raised2: #2C281F;
  --line: #3A342A; --hair: #FFFFFF0A; --grid: #2C281F;
  --ink: #E0DAC9; --ink2: #A19A86; --ink3: #887F6A;
  --green: #56A883; --red: #D3766A;
  --amber: #D3A15C; --amber-soft: #D3A15C1A; --amber-line: #D3A15C55;
  --veil: #191712EE; --scrim: #0D0C0AAA;
  --shadow: 0 40px 90px -30px #000, 0 0 0 1px #4A422F inset;
  --bezel: linear-gradient(160deg, #3A3428, #201D16 42%, #14120E);
  --p1: #D3A15C; --p2: #9AA0D8; --p3: #6FC2A4; --p4: #D99BB0; --p5: #BDAEDC; --p6: #85B8D6;
  --seg-on: #262219; --pill-ink: #17150F; --pill-mix: #FFFFFF; --pill-amt: 100%; --soft-amt: 11%;
}

:root { --up: var(--green); --down: var(--red); }
:root[data-updown="red"] { --up: var(--red); --down: var(--green); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0; background: var(--ground); color: var(--ink); font-family: var(--ui); font-size: 14px;
  height: 100%; overflow-y: auto; overscroll-behavior: none; -webkit-overflow-scrolling: touch;
}

/* ============================================================ 台面 */

.stagewrap { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px 16px 22px; }
.bar { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px 14px; flex-wrap: wrap; width: 100%; max-width: 980px; }
.barset { display: flex; align-items: center; gap: 6px; }
.barlab { font: 500 10.5px/1 var(--ui); letter-spacing: .12em; color: var(--ink3); text-transform: uppercase; margin-right: 2px; }
.chip {
  border: 1px solid var(--line); background: var(--app); cursor: pointer; border-radius: 999px;
  padding: 6px 11px; color: var(--ink2); font: 500 12px/1 var(--ui);
  transition: color .15s, border-color .15s, background .15s;
}
.chip:hover { color: var(--ink); }
.chip.on { color: var(--amber); border-color: var(--amber-line); background: var(--amber-soft); }

.caption { color: var(--ink3); font-size: 12.5px; letter-spacing: .03em; text-align: center; max-width: 58ch; line-height: 1.7; margin: 0; }
.caption b { color: var(--ink2); font-weight: 600; }

.devicebox { flex: none; width: calc(var(--dw) * var(--fit)); height: calc(var(--dh) * var(--fit)); }
.device {
  width: var(--dw); height: var(--dh); transform: scale(var(--fit)); transform-origin: top left;
  border-radius: calc(var(--dr) + 11px); padding: 11px; background: var(--bezel); box-shadow: var(--shadow);
}
.screen {
  position: relative; width: 100%; height: 100%; border-radius: var(--dr); overflow: hidden;
  background: var(--app); display: flex; flex-direction: column; isolation: isolate; container-type: inline-size;
}

.statusbar {
  flex: none; position: relative; z-index: 2; height: var(--dtop);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 max(22px, calc(var(--dr) * .5)); background: var(--app); font: 600 14px/1 var(--ui); color: var(--ink);
}
.statusbar .cut { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); background: #000; border-radius: 999px; width: 124px; height: 36px; }
.statusbar .icons { display: flex; align-items: center; gap: 5px; }
.statusbar .batt { width: 24px; height: 12px; border: 1.3px solid currentColor; border-radius: 3.5px; position: relative; opacity: .9; }
.statusbar .batt::before { content: ""; position: absolute; inset: 1.7px; right: 6px; background: currentColor; border-radius: 1px; }
.statusbar .batt::after { content: ""; position: absolute; right: -3.2px; top: 3.5px; width: 1.8px; height: 5px; border-radius: 0 2px 2px 0; background: currentColor; opacity: .5; }
.statusbar .off { color: var(--ink3); font: 500 11px/1 var(--ui); }

.homebar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; height: var(--dbot); pointer-events: none; display: grid; place-items: center; }
.homebar::after { content: ""; width: 36%; max-width: 148px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .35; }

body.live { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; --dtop: env(safe-area-inset-top, 0px); --dbot: env(safe-area-inset-bottom, 0px); }
body.live .stagewrap { padding: 0; gap: 0; height: 100%; overflow: hidden; }
body.live .bar, body.live .caption { display: none; }
body.live .devicebox { width: 100%; height: 100dvh; }
body.live .device { width: 100%; height: 100%; transform: none; border-radius: 0; padding: 0; box-shadow: none; background: var(--app); }
body.live .screen { border-radius: 0; }
body.live .statusbar { height: env(safe-area-inset-top, 0px); }
body.live .statusbar .clock, body.live .statusbar .icons, body.live .statusbar .cut, body.live .statusbar .off { display: none; }
body.live .homebar { display: none; }

/* ============================================================ 顶栏 */

.top { flex: none; background: var(--app); border-bottom: 1px solid var(--line); }
.toprow { display: flex; align-items: center; gap: 2px; padding: 6px 8px 6px 6px; min-height: 44px; }
.back { display: flex; align-items: center; gap: 1px; border: 0; background: none; cursor: pointer; color: var(--ink2); font: 400 14.5px/1 var(--ui); padding: 6px 6px 6px 2px; }
.back.hide { visibility: hidden; }
.ttl { display: flex; align-items: baseline; gap: 7px; margin-left: 2px; }
.ttl h1 { margin: 0; font: 600 17px/1.2 var(--ui); letter-spacing: .01em; }
.spacer { flex: 1; }
.txtbtn { border: 0; background: none; cursor: pointer; color: var(--amber); font: 500 14px/1 var(--ui); padding: 8px 7px; border-radius: 8px; }
.txtbtn:active { background: var(--amber-soft); }
.txtbtn[disabled] { color: var(--ink3); cursor: default; }

/* ============================================================ 页面 */

.page { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--chart); padding-bottom: calc(28px + var(--dbot)); }
.pad { padding: 0 16px; }

.sect { margin: 16px 0 0; }
.sect > h2 { margin: 0 0 7px; padding: 0 16px; font: 500 11px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); }
.card { background: var(--app); border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.note { margin: 7px 0 0; padding: 0 16px; font: 400 11.5px/1.65 var(--ui); color: var(--ink3); }
.note b { color: var(--ink2); font-weight: 500; }
.note.warn b { color: var(--amber); }

/* 一行：左文右控件 / 可点击行 */
.srow { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--hair); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; font: inherit; color: inherit; }
.srow:last-child { border-bottom: 0; }
.srow.tap { cursor: pointer; }
.srow.tap:active { background: var(--raised2); }
.srow .lab { flex: 1; min-width: 0; }
.srow .lab .t { display: block; font: 500 14px/1.3 var(--ui); }
.srow .lab .d { display: block; margin-top: 3px; font: 400 11px/1.5 var(--ui); color: var(--ink3); }
.srow .val { flex: none; font: 400 13px/1.3 var(--ui); color: var(--ink3); font-variant-numeric: tabular-nums; }
.srow .val.mono { font-family: var(--mono); font-size: 12.5px; }
.srow.danger .lab .t { color: var(--down); }
.chev { flex: none; color: var(--ink3); opacity: .8; }

.sw { flex: none; width: 46px; height: 28px; border-radius: 16px; border: 0; cursor: pointer; padding: 0; background: var(--line); position: relative; transition: background .22s cubic-bezier(.32,.72,0,1); }
.sw i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 12px; background: #FFF; box-shadow: 0 1px 3px #12163A40; transition: transform .22s cubic-bezier(.32,.72,0,1); }
.sw.on { background: color-mix(in srgb, var(--up) 42%, transparent); }
.sw.on i { transform: translateX(18px); background: var(--up); }

/* ============================================================ 账号行（设置页顶部那一行） */

.acct { display: flex; align-items: center; gap: 12px; padding: 13px 16px; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; }
.acct:active { background: var(--raised2); }
.ava { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--raised2); color: var(--ink3); }
.ava.on { background: color-mix(in srgb, var(--p2) 15%, transparent); color: var(--p2); font: 600 17px/1 var(--mono); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--p2) 26%, transparent); }
.acct .who { flex: 1; min-width: 0; }
.acct .who .n { display: block; font: 600 15px/1.3 var(--ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .who .s { margin-top: 3px; font: 400 11.5px/1.45 var(--ui); color: var(--ink3); display: flex; align-items: center; gap: 5px; }
.acct .who .s .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--up); flex: none; }
.acct .who .s .dot.idle { background: var(--ink3); }
.acct .who .s .dot.warnd { background: var(--amber); }
.btn-inline { flex: none; border: 1px solid var(--amber-line); background: var(--amber-soft); color: var(--amber); border-radius: 999px; padding: 7px 14px; font: 500 13px/1 var(--ui); cursor: pointer; }

/* ============================================================ 表单 */

.form { padding: 18px 16px 4px; display: grid; gap: 13px; }
.lede { font: 400 12.5px/1.65 var(--ui); color: var(--ink3); margin: -2px 0 2px; }
.lede b { color: var(--ink2); font-weight: 500; }
.lede em { font-style: normal; color: var(--amber); }

.field { display: grid; gap: 6px; }
.field > label { font: 500 11.5px/1 var(--ui); color: var(--ink3); letter-spacing: .04em; }
.inp { display: flex; align-items: center; gap: 8px; background: var(--app); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; transition: border-color .16s, box-shadow .16s; }
.inp:focus-within { border-color: var(--amber-line); box-shadow: 0 0 0 3px var(--amber-soft); }
.inp.bad { border-color: color-mix(in srgb, var(--down) 55%, transparent); }
.inp input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); font: 400 16px/1 var(--ui); padding: 13px 0; }
.inp input::placeholder { color: var(--ink3); opacity: .75; }
.inp .eye { border: 0; background: none; cursor: pointer; color: var(--ink3); padding: 6px; display: grid; place-items: center; }
.err { font: 400 11.5px/1.5 var(--ui); color: var(--down); display: flex; align-items: flex-start; gap: 5px; }
.ok { font: 400 11.5px/1.5 var(--ui); color: var(--up); }

.btn { width: 100%; border: 0; border-radius: 13px; padding: 15px 0; cursor: pointer; font: 600 15px/1 var(--ui); background: var(--amber); color: var(--app); transition: opacity .16s; }
:root[data-theme="dark"] .btn, :root[data-theme="night"] .btn { color: #12100B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) .btn { color: #0B0E26; } }
.btn[disabled] { opacity: .38; cursor: default; }
.btn.ghost { background: var(--raised2); color: var(--ink2); font-weight: 500; }
.btn.danger { background: var(--down); color: #FFF; }
.btn.quiet { background: none; color: var(--ink2); font-weight: 500; padding: 12px 0; }

.links { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 0; }
.link { border: 0; background: none; cursor: pointer; color: var(--amber); font: 500 13px/1 var(--ui); padding: 8px 4px; border-radius: 7px; }
.link.quiet { color: var(--ink3); font-weight: 400; }
.foot { padding: 16px 16px calc(20px + var(--dbot)); font: 400 11.5px/1.7 var(--ui); color: var(--ink3); }
.foot b { color: var(--ink2); font-weight: 500; }

/* 密码规则勾选表 */
.rules { display: grid; gap: 4px; margin-top: 2px; }
.rule { display: flex; align-items: center; gap: 6px; font: 400 11.5px/1.4 var(--ui); color: var(--ink3); }
.rule.hit { color: var(--up); }
.rule i { width: 13px; height: 13px; border-radius: 50%; border: 1.3px solid currentColor; display: grid; place-items: center; flex: none; opacity: .55; }
.rule.hit i { opacity: 1; background: var(--up); border-color: var(--up); color: var(--app); }
.meter { height: 4px; border-radius: 3px; background: var(--raised2); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--down); transition: width .2s, background .2s; }

/* 勾选框 */
.check { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; padding: 2px 0; }
.check i { flex: none; width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; color: transparent; margin-top: 1px; }
.check.on i { background: var(--amber); border-color: var(--amber); color: var(--app); }
.check span { font: 400 12px/1.55 var(--ui); color: var(--ink2); }
.check span a { color: var(--amber); text-decoration: none; }

/* 验证码 6 格 */
.codebox { display: flex; gap: 8px; justify-content: space-between; }
.codebox b {
  flex: 1; height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--app);
  display: grid; place-items: center; font: 500 24px/1 var(--mono); color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.codebox b.cur { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.codebox b.bad { border-color: color-mix(in srgb, var(--down) 60%, transparent); color: var(--down); }
.codebox b.empty::after { content: ""; width: 9px; height: 2px; border-radius: 2px; background: var(--ink3); opacity: .4; }
.codewrap { position: relative; }
.codewrap input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; font-size: 16px; letter-spacing: 2em; border: 0; }
.resend { display: flex; align-items: center; justify-content: space-between; padding-top: 2px; }
.resend .cd { font: 400 12px/1 var(--mono); color: var(--ink3); font-variant-numeric: tabular-nums; }

/* 数据去向表 */
.tbl { background: var(--app); border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.trow { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--hair); }
.trow:last-child { border-bottom: 0; }
.trow .k { flex: 1; min-width: 0; font: 500 13px/1.4 var(--ui); }
.trow .k em { display: block; font: 400 10.5px/1.5 var(--ui); font-style: normal; color: var(--ink3); margin-top: 2px; }
.tag { flex: none; border-radius: 6px; padding: 3px 7px; font: 500 10.5px/1.35 var(--ui); white-space: nowrap; margin-top: 1px; }
.tag.cloud { background: color-mix(in srgb, var(--p2) 14%, transparent); color: var(--p2); }
.tag.local { background: var(--raised2); color: var(--ink2); }
.tag.never { background: color-mix(in srgb, var(--down) 12%, transparent); color: var(--down); }

/* 设备列表 */
.dev { display: flex; align-items: center; gap: 11px; padding: 12px 16px; border-bottom: 1px solid var(--hair); }
.dev:last-child { border-bottom: 0; }
.dev .ico { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--raised2); color: var(--ink2); }
.dev .m { flex: 1; min-width: 0; }

    var el = keep ? $(keep) : null
    if (el && el.selectionStart != null) pos = el.selectionStart
    render()
    if (keep && $(keep)) {

      if (pos != null && $(keep).setSelectionRange) { try { $(keep).setSelectionRange(pos, pos) } catch (e) {} }

  function forgotStart () {

    S.formErr = ''
    var mail = S.fEmail.trim()
    if (!validEmail(mail)) {
      S.route = 'signin'; S.stack = ['settings']
      S.formErr = '先把邮箱填对，再点「忘记密码」——验证码得有地方发。'
      S.fieldBad = 'email'; render(); return
    }
    S.codePurpose = 'reset'; S.codeMail = mail; S.digits = ''; S.codeTries = 3; S.resend = 60
    S.route = 'code'; S.stack = ['settings', 'signin']; S.formErr = ''; render()
  }

  function doSignin () {
    if (!S.online || S.lock > 0) return
    S.formErr = ''; S.fieldBad = ''
    if (!validEmail(S.fEmail)) { S.formErr = '这个邮箱看着不对。'; S.fieldBad = 'email'; render(); return }
    if (!S.fPw) { S.formErr = '还没填密码。'; S.fieldBad = 'pw'; render(); return }
    if (S.fPw !== RIGHT_PW) {
      S.fails++
      if (S.fails >= 5) { S.lock = 60; S.formErr = '试得太密了。等 60 秒再来，或者直接走「忘记密码」。' }
      else S.formErr = '邮箱或密码不对。（还可以试 ' + (5 - S.fails) + ' 次）'
      S.fieldBad = 'pw'; render(); return
    }
    S.email = S.fEmail.trim(); S.fails = 0; S.fPw = ''
    S.signedIn = true; S.route = 'account'; S.stack = ['settings']; render()
    if (S.hasLocalData && !S.merged) openMerge()
    else toast('登录成功')
  }

  function doSignup () {
    S.formErr = ''; S.fieldBad = ''
    if (!validEmail(S.fEmail)) { S.formErr = '这个邮箱看着不对。'; S.fieldBad = 'email'; render(); return }
    if (S.fPw.length < 8) { S.formErr = '密码至少 8 位。'; S.fieldBad = 'pw'; render(); return }
    if (WEAK.indexOf(S.fPw.toLowerCase()) >= 0) { S.formErr = '这个密码太常见了，换一个。'; S.fieldBad = 'pw'; render(); return }
    if (!S.agreed) { S.formErr = '还差勾上那一条。'; render(); return }
    S.codePurpose = 'signup'; S.codeMail = S.fEmail.trim(); S.digits = ''; S.codeTries = 3; S.resend = 60
    go('code')
  }

  function submitCode () {
    if (S.digits.length < 6) return
    if (S.digits !== RIGHT_CODE) {
      S.codeTries--
      S.codeBad = true
      S.formErr = S.codeTries > 0
        ? '验证码不对，还可以试 ' + S.codeTries + ' 次。'
        : '这封码作废了，重新发一封。'
      if (S.codeTries <= 0) { S.digits = ''; S.resend = Math.max(S.resend, 20) }
      render(); return
    }
    S.codeBad = false; S.formErr = ''
    if (S.codePurpose === 'reset') { S.fPw = ''; S.fPw2 = ''; go('newpw'); return }
    // 注册完成：邮箱当场算已验证，直接进账号
    S.email = S.codeMail; S.signedIn = true; S.fPw = ''
    S.route = 'account'; S.stack = ['settings']; render()
    if (S.hasLocalData && !S.merged) openMerge()
    else toast('注册成功')
  }

  function doResend () {
    if (S.resend > 0 || !S.online) return
    S.resend = 60; S.codeTries = 3; S.digits = ''; S.codeBad = false
    S.formErr = ''; render(); toast('又发了一封到 ' + maskEmail(S.codeMail))
  }

  function doNewpw () {
    S.formErr = ''; S.fieldBad = ''
    if (S.fPw.length < 8) { S.formErr = '新密码至少 8 位。'; S.fieldBad = 'pw'; render(); return }
    if (WEAK.indexOf(S.fPw.toLowerCase()) >= 0) { S.formErr = '这个密码太常见了，换一个。'; S.fieldBad = 'pw'; render(); return }
    if (S.fPw !== S.fPw2) { S.formErr = '两次输的不一样。'; S.fieldBad = 'pw2'; render(); return }
    S.email = S.codeMail || S.email; S.signedIn = true; S.fails = 0; S.lock = 0
    S.fPw = ''; S.fPw2 = ''
    S.route = 'account'; S.stack = ['settings']; render()
    if (S.hasLocalData && !S.merged) openMerge()
    else toast('密码改好了，其他设备都已退出')
  }

  function doChangePw () {
    S.formErr = ''; S.fieldBad = ''
    if (S.fPwOld !== RIGHT_PW) { S.formErr = '当前密码不对。'; S.fieldBad = 'old'; render(); return }
    if (S.fPw.length < 8) { S.formErr = '新密码至少 8 位。'; S.fieldBad = 'pw'; render(); return }
    if (S.fPw === S.fPwOld) { S.formErr = '新密码不能和旧的一样。'; S.fieldBad = 'pw'; render(); return }
    if (S.fPw !== S.fPw2) { S.formErr = '两次输的不一样。'; S.fieldBad = 'pw2'; render(); return }
    S.fPw = ''; S.fPw2 = ''; S.fPwOld = ''
    back(); toast(S.logoutOthers ? '密码改好了，其他设备已退出' : '密码改好了')
  }

  function doLogout () {
    S.signedIn = false; S.merged = false; S.hasLocalData = true
    S.fEmail = ''; S.fPw = ''; S.pending = 3
    S.route = 'settings'; S.stack = []; render()
    toast('退出了。这台手机上的自选和画线还在')
  }

  function doMerge () {
    S.merged = true; closeSheet()
    S.pending = S.mergeChoice === 'cloud' ? 0 : 3
    render()
    toast({ merge: '两边已合并', cloud: '用了云端那份，本机副本留着', local: '本机这份已上传，云端旧版保留 30 天' }[S.mergeChoice])
  }

  function doSync () {
    if (!S.online) { toast('还没联网'); return }
    if (S.pending === 0) { toast('本来就是最新的'); return }
    S.syncing = true; render()
    setTimeout(function () { S.syncing = false; S.pending = 0; S.lastSync = '刚刚'; render(); toast('都传完了') }, 900)
  }

  function doClose () {
    if (S.closeConfirm.trim().toLowerCase() !== S.email.toLowerCase()) return
    S.signedIn = false; S.closeConfirm = ''; S.merged = false
    S.route = 'settings'; S.stack = []; render()
    toast('已提交注销。7 天内重新登录可以撤销')
  }

  // ------------------------------------------------------------ 秒表：重发冷却与登录锁
  setInterval(function () {
    if (S.resend > 0) {
      S.resend--
      if (S.route === 'code') {
        var box = document.querySelector('.resend')
        if (box) {
          box.innerHTML = (S.resend > 0 ? '<span class="cd">' + S.resend + ' 秒后可以重发</span>' : '<button class="link" data-act="resend">重发验证码</button>') +
            '<button class="link quiet" data-act="back">换个邮箱</button>'
        }
      }
    }
    if (S.lock > 0) {
      S.lock--
      if (S.lock === 0) { S.fails = 0; S.formErr = ''; if (S.route === 'signin') render() }
      else if (S.route === 'signin') { var c = $('lockCd'); if (c) c.textContent = S.lock }
    }
  }, 1000)

  // ------------------------------------------------------------ 台面上的三排开关
  function chips (host, list, get, set) {
    list.forEach(function (o) {
      var b = document.createElement('button')
      b.className = 'chip' + (get() === o.id ? ' on' : '')
      b.textContent = o.n
      b.onclick = function () { set(o.id); paintChips() }
      host.appendChild(b)
    })
  }
  var theme = 'auto'
  function paintChips () {
    ;['themeset', 'stateset', 'netset'].forEach(function (id) {
      var h = $(id), lab = h.firstElementChild
      h.innerHTML = ''; h.appendChild(lab)
    })
    chips($('themeset'), [{ id: 'auto', n: '跟随系统' }, { id: 'light', n: '浅' }, { id: 'dark', n: '深' }, { id: 'paper', n: '护眼' }, { id: 'night', n: '夜读' }],
      function () { return theme },
      function (v) {
        theme = v
        if (v === 'auto') document.documentElement.removeAttribute('data-theme')
        else document.documentElement.setAttribute('data-theme', v)
      })
    chips($('stateset'), [{ id: 'out', n: '未登录' }, { id: 'in', n: '已登录' }],
      function () { return S.signedIn ? 'in' : 'out' },
      function (v) {
        S.signedIn = v === 'in'
        S.merged = S.signedIn
        S.route = S.signedIn ? 'account' : 'settings'
        S.stack = S.signedIn ? ['settings'] : []
        render()
      })
    chips($('netset'), [{ id: 'on', n: '在线' }, { id: 'off', n: '离线' }],
      function () { return S.online ? 'on' : 'off' },
      function (v) { S.online = v === 'on'; render() })
  }

  // ------------------------------------------------------------ 机身：窄窗口 / 真手机就脱掉外壳
  function fit () {
    var narrow = window.matchMedia('(max-width: 620px)').matches || window.matchMedia('(pointer: coarse)').matches
    document.body.classList.toggle('live', narrow)
    if (narrow) { document.documentElement.style.setProperty('--fit', 1); return }
    var avail = window.innerHeight - 150
    var f = Math.min(1, avail / 874)
    document.documentElement.style.setProperty('--fit', f.toFixed(3))
  }
  window.addEventListener('resize', fit)

  fit(); paintChips(); render()
})()
</script>
