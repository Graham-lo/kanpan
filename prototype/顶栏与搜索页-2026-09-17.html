<!doctype html>
<html lang="zh-CN" data-skin="sage" data-mode="light" data-grid="a" data-history="on" data-quick="keep" data-redup="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看盘 · 顶栏 AICoin 模式 + 搜索页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ──────────────────────────────────────────────────────────────
   皮肤令牌：一比一抄自 KanpanCore/Style/Palette.swift 的 PaletteSeed。
   图区（.canvas）不跟皮肤走，用固定的 AICoin dayCanvas / nightCanvas。
   ────────────────────────────────────────────────────────────── */
html[data-skin="sage"][data-mode="light"]{
  --ground:#C3D6CA; --app:#F3F7F4; --raised:#FFFFFF; --raised2:#E7EFE9;
  --line:#D6E3DA; --grid:#E2EBE5; --hair:rgba(20,33,27,.06);
  --ink:#14211B; --ink2:#4E6158; --ink3:#606F67; --acc:#2E7D6B; --warm:#B57C28;
  --up:#36B257; --down:#E64552; --pillInk:#FFFFFF;
}
html[data-skin="sage"][data-mode="dark"]{
  --ground:#060A08; --app:#0B120F; --raised:#131C18; --raised2:#1A241F;
  --line:#25332C; --grid:#1F2B25; --hair:rgba(255,255,255,.04);
  --ink:#E9F2EC; --ink2:#A5B8AE; --ink3:#7B8D85; --acc:#4FB69C; --warm:#E0A544;
  --up:#4FB69C; --down:#E36159; --pillInk:#060A08;
}
html[data-skin="terra"][data-mode="light"]{
  --ground:#D9C7B4; --app:#FBF6F0; --raised:#FFFFFF; --raised2:#F2E8DE;
  --line:#E7DACB; --grid:#EFE4D8; --hair:rgba(36,26,19,.06);
  --ink:#241A13; --ink2:#6E5C4D; --ink3:#756659; --acc:#B25735; --warm:#B37B25;
  --up:#36B257; --down:#E64552; --pillInk:#FFFFFF;
}
html[data-skin="terra"][data-mode="dark"]{
  --ground:#0C0805; --app:#16100C; --raised:#211812; --raised2:#2A1F17;
  --line:#37281D; --grid:#2E2117; --hair:rgba(255,255,255,.04);
  --ink:#F7EFE6; --ink2:#C2AC98; --ink3:#958576; --acc:#E2874F; --warm:#E0A544;
  --up:#3FA783; --down:#E0584A; --pillInk:#0C0805;
}
html[data-skin="classic"][data-mode="light"]{
  --ground:#F7F8FA; --app:#FFFFFF; --raised:#FFFFFF; --raised2:#F3F5F7;
  --line:#EAEAEA; --grid:#EAEAEA; --hair:rgba(20,33,27,.06);
  --ink:#14211B; --ink2:#4E6158; --ink3:#606F67; --acc:#2E7D6B; --warm:#B57C28;
  --up:#36B257; --down:#E64552; --pillInk:#FFFFFF;
}
html[data-skin="classic"][data-mode="dark"]{
  --ground:#090C14; --app:#0D111C; --raised:#202126; --raised2:#303442;
  --line:#20232E; --grid:#1C2236; --hair:rgba(255,255,255,.04);
  --ink:#E9F2EC; --ink2:#A5B8AE; --ink3:#7B8D85; --acc:#4FB69C; --warm:#E0A544;
  --up:#2F9347; --down:#CC3333; --pillInk:#090C14;
}
html[data-redup="1"]{ --up2:var(--down); --down2:var(--up); }
html[data-redup="0"]{ --up2:var(--up); --down2:var(--down); }

/* 画布固定色（Palette.dayCanvas / nightCanvas） */
html[data-mode="light"]{
  --cbg:#FFFFFF; --cgrid:#C5C5C5; --caxis:#F2F4F7; --ctext:#7A8899; --cdim:#B7BFC8; --cink:#292D33;
  --divChart:#F2F4F7; --divBar:#EAEAEA;
  --page:#ECEEF0; --ptext:#23292F; --pdim:#6A747D; --pcard:#FFFFFF; --pline:#DCE0E4; --scrim:rgba(20,33,27,.30);
}
html[data-mode="dark"]{
  --cbg:#0D111C; --cgrid:#1C2236; --caxis:#191C21; --ctext:#7A8899; --cdim:#515A66; --cink:#E6EAF2;
  --divChart:#191C21; --divBar:#20232E;
  --page:#0E1013; --ptext:#E7ECEF; --pdim:#8A949C; --pcard:#15181C; --pline:#23272C; --scrim:rgba(0,0,0,.55);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--ptext);
  font-family:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1580px;margin:0 auto;padding:26px 22px 120px}
h1{font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:.2px}
h2{font-size:14px;font-weight:600;margin:38px 0 12px;letter-spacing:.3px;
   padding-bottom:8px;border-bottom:1px solid var(--pline)}
h3{font-size:12.5px;font-weight:600;margin:0 0 8px}
.lede{color:var(--pdim);font-size:12.5px;max-width:860px;margin:0 0 16px}
a{color:inherit}

/* 控制条 */
.bar{position:sticky;top:0;z-index:40;background:var(--page);border-bottom:1px solid var(--pline);
  padding:10px 0 12px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.grp{display:flex;align-items:center;gap:6px}
.grp>i{font-style:normal;color:var(--pdim);font-size:11px;letter-spacing:.4px;margin-right:2px}
.bar button{font:inherit;font-size:11.5px;padding:5px 11px;border-radius:8px;cursor:pointer;
  border:1px solid var(--pline);background:var(--pcard);color:var(--pdim)}
.bar button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.tagq{font-size:10px;padding:2px 6px;border-radius:5px;background:var(--pcard);border:1px dashed var(--pline);color:var(--pdim)}

.duo{display:grid;grid-template-columns:393px minmax(320px,1fr);gap:40px;align-items:start}
.notes{font-size:12.3px;color:var(--pdim);line-height:1.75}
.notes b{color:var(--ptext);font-weight:600}
.notes ul{margin:6px 0 14px;padding-left:18px}
.notes li{margin:3px 0}
.notes .k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  background:var(--pcard);border:1px solid var(--pline);border-radius:5px;padding:1px 5px;color:var(--ptext)}
table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0 4px}
th,td{border-bottom:1px solid var(--pline);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--pdim);font-weight:600;font-size:11px;letter-spacing:.3px}
td.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ptext)}

/* 手机壳 */
.phone{width:393px;height:852px;border-radius:54px;position:relative;overflow:hidden;
  background:var(--app);box-shadow:0 0 0 9px #222528,0 0 0 10px #3c4045,0 26px 60px rgba(0,0,0,.34)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:33px;
  border-radius:20px;background:#0b0b0c;z-index:30;pointer-events:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;
  border-radius:3px;background:var(--ink);opacity:.26;z-index:30;pointer-events:none}
.screen{position:absolute;inset:0;border-radius:54px;overflow:hidden;background:var(--app);
  display:flex;flex-direction:column}
.statusbar{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 4px;font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:.2px}
.statusbar .rt{display:flex;gap:5px;align-items:center;opacity:.8}

/* 裁切卡（状态图廊） */
.crop{width:393px;border-radius:20px;overflow:hidden;background:var(--app);
  border:1px solid var(--pline);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.cropcap{font-size:11.5px;color:var(--pdim);margin:0 0 6px;display:flex;gap:6px;align-items:baseline}
.cropcap b{color:var(--ptext);font-weight:600;font-size:12px}
.gal{display:flex;flex-wrap:wrap;gap:26px 30px}
.gal>div{width:393px}
.tall{height:620px;position:relative}
.tall .screen{position:absolute;inset:0;border-radius:0}

/* ─────────── app 内部：顶栏 ─────────── */
.hdr{background:var(--app);padding:6px 12px 9px;flex:none}
.tbar{height:38px;display:flex;align-items:center;gap:9px}
.icb{width:30px;height:30px;border-radius:15px;border:0;background:transparent;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.icb.on{background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
.icb.back{margin-left:-7px}
.ident{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;cursor:pointer;
  min-width:0;flex:0 1 auto;max-width:252px;overflow:hidden}
.ident .bg{flex:none}
.ident .base{font-size:15.5px;font-weight:700;color:var(--ink);letter-spacing:.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.ident .quote{font-size:12px;font-weight:500;color:var(--ink3);white-space:nowrap}
.perp{font-size:9.5px;font-weight:500;color:var(--ink3);background:var(--raised2);
  border-radius:4px;padding:1px 4px;line-height:1.35;flex:none}
.sp{flex:1}

/* 价格区 */
.pblk{display:flex;align-items:flex-start;gap:10px;margin-top:7px}
.pleft{min-width:0;flex:1}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.px{font-size:22px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;
  font-family:Manrope,Inter,system-ui,sans-serif;letter-spacing:-.2px;white-space:nowrap}
.px.up{color:var(--up2)} .px.down{color:var(--down2)} .px.stale{color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:7px;
  font-size:11.5px;font-weight:600;color:var(--pillInk);font-variant-numeric:tabular-nums;
  font-family:Manrope,Inter,system-ui,sans-serif;flex:none}
.pill svg{display:block}
.pill.stale{background:var(--raised2)!important;color:var(--ink3)}
.pline{font-size:11px;color:var(--ink3);margin-top:3px;white-space:nowrap}
.pline b{font-size:11.5px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;
  font-family:Manrope,Inter,system-ui,sans-serif}
.prow2{margin-top:4px}
.pgrid{width:200px;flex:none;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;padding-top:2px;
  border:0;background:transparent;cursor:default;font:inherit;text-align:left}
.pgrid.c{width:200px;align-content:center}
.cell{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.cell i{font-style:normal;font-size:9.5px;color:var(--ink3);flex:none;white-space:nowrap}
.cell b{font-size:11.5px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;
  font-family:Manrope,Inter,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell b.up{color:var(--up2)} .cell b.down{color:var(--down2)}
.stale .cell b,.stale .pline b{color:var(--ink3)}
@keyframes flashup{0%{background:color-mix(in srgb,var(--up2) 18%,transparent)}100%{background:transparent}}
@keyframes flashdn{0%{background:color-mix(in srgb,var(--down2) 18%,transparent)}100%{background:transparent}}
.fl-up{animation:flashup .55s ease-out;border-radius:7px;margin:0 -5px;padding:0 5px}
.fl-dn{animation:flashdn .55s ease-out;border-radius:7px;margin:0 -5px;padding:0 5px}

.hair{height:1px;background:var(--divChart);flex:none}
.hairbar{height:1px;background:var(--divBar);flex:none}

/* 周期条 */
.ivbar{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--app)}
.chips{display:flex;gap:4px;flex:1;min-width:0}
.chip{flex:1;height:28px;border-radius:14px;border:0;background:var(--raised);color:var(--ink2);
  font-size:12.5px;font-family:inherit;cursor:pointer;padding:0 6px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--pillInk);font-weight:600}
.tailbtn{height:28px;border-radius:14px;border:0;background:var(--raised2);color:var(--ink2);
  font-size:12.5px;font-weight:600;font-family:inherit;padding:0 9px;cursor:pointer;flex:none;
  display:flex;align-items:center;gap:3px}

/* 画布 */
.canvas{flex:1;min-height:0;background:var(--cbg);position:relative;overflow:hidden}
.canvas svg{display:block;width:100%;height:100%}
.ax{position:absolute;inset:0;pointer-events:none;
  font-family:Manrope,sans-serif;font-size:9px;color:var(--ctext)}
.ax span{line-height:1;font-variant-numeric:tabular-nums}
.malab{position:absolute;left:8px;top:5px;font-size:9px;color:var(--ctext);font-family:Manrope,sans-serif;
  pointer-events:none;letter-spacing:.2px}
.malab b{font-weight:500;margin-right:7px}
.dbar{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--app)}
.dbar span{font-size:12px;color:var(--ink3)}

/* 底栏 */
.tabbar{height:62px;flex:none;display:flex;align-items:flex-start;padding:6px 6px 0;background:var(--app)}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;color:var(--ink3);font-size:10.5px;font-family:inherit;padding:2px 0}
.tab.on{color:var(--acc);font-weight:600}

/* ─────────── 搜索页 ─────────── */
.sbar{flex:none;display:flex;align-items:center;gap:6px;padding:7px 6px 8px 12px;background:var(--app)}
.field{flex:1;height:34px;border-radius:9px;background:var(--raised2);border:1px solid var(--line);
  display:flex;align-items:center;gap:7px;padding:0 10px;min-width:0}
.field.focus{border-color:color-mix(in srgb,var(--acc) 40%,transparent);border-width:2px;padding:0 9px}
.field input{flex:1;border:0;background:transparent;outline:none;font-family:inherit;font-size:13.5px;
  color:var(--ink);min-width:0;padding:0}
.field input::placeholder{color:var(--ink3)}
.cancel{border:0;background:transparent;color:var(--acc);font-size:14px;font-weight:500;font-family:inherit;
  padding:0 10px;cursor:pointer;flex:none}
.filters{flex:none;display:flex;align-items:center;gap:6px;padding:2px 12px 9px;background:var(--app);
  overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{height:24px;border-radius:7px;border:1px solid transparent;background:var(--raised2);color:var(--ink2);
  font-size:11.5px;font-family:inherit;padding:0 9px;cursor:pointer;white-space:nowrap;flex:none}
.fchip.on{background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);
  border-color:color-mix(in srgb,var(--acc) 34%,transparent);font-weight:600}
.fsep{width:1px;height:14px;background:var(--line);flex:none;margin:0 2px}
.scroll{flex:1;min-height:0;overflow-y:auto;background:var(--app)}
.scroll::-webkit-scrollbar{width:0}
.ghead{display:flex;align-items:baseline;gap:7px;padding:14px 16px 6px}
.ghead h4{margin:0;font-size:11px;font-weight:500;letter-spacing:1px;color:var(--ink3)}
.ghead em{font-style:normal;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;
  font-family:Manrope,Inter,sans-serif}
.ghead .more{margin-left:auto;font-size:11.5px;color:var(--acc);border:0;background:transparent;
  font-family:inherit;cursor:pointer;padding:0}
.ghead .trash{margin-left:auto;border:0;background:transparent;color:var(--ink3);cursor:pointer;padding:0 0 0 8px;
  display:flex;align-items:center}
.hchips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 10px}
.hchip{height:30px;border-radius:8px;border:0;background:var(--raised2);color:var(--ink2);
  font-size:12.5px;font-family:inherit;padding:0 13px;cursor:pointer}
.row{display:flex;align-items:center;gap:11px;padding:11px 16px;cursor:pointer;position:relative;
  background:transparent;border:0;width:100%;font-family:inherit;text-align:left}
.row+.row::before{content:"";position:absolute;left:60px;right:0;top:0;height:1px;background:var(--hair)}
.row .nm{flex:1;min-width:0}
.row .n1{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block;line-height:1.35}
.row .n1 u{text-decoration:none;color:var(--acc);font-weight:600}
.row .n1 s{text-decoration:none;color:var(--ink3);font-weight:400;font-size:12.5px;margin-left:4px}
.row .n2{font-size:11px;color:var(--ink3);margin-top:1px;display:flex;align-items:center;gap:6px;
  white-space:nowrap;overflow:hidden}
.tag{font-size:9.5px;line-height:1.5;padding:1px 5px;border-radius:4px;flex:none}
.tag.new{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.tag.pend{color:var(--ink3);background:var(--raised2)}
.row .pr{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end}
.row .p1{font-size:13.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;
  font-family:Manrope,Inter,sans-serif}
.row .p2{font-size:11px;font-variant-numeric:tabular-nums;font-family:Manrope,Inter,sans-serif;margin-top:1px}
.p2.up{color:var(--up2)} .p2.down{color:var(--down2)} .p2.nil{color:var(--ink3)}
.starbtn{width:30px;height:30px;border:0;background:transparent;display:flex;align-items:center;
  justify-content:center;cursor:pointer;flex:none;color:var(--ink3);margin-right:-8px}
.starbtn.on{color:var(--acc)}
.morerow{height:44px;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--acc);
  font-size:13px;border:0;background:transparent;width:100%;font-family:inherit;cursor:pointer}
.entry{display:flex;align-items:center;gap:10px;padding:0 16px;height:46px;width:100%;border:0;
  background:transparent;font-family:inherit;cursor:pointer;color:var(--ink);font-size:14px;text-align:left}
.entry .ch{margin-left:auto;color:var(--ink3)}
.empty{padding:26px 16px;text-align:center;color:var(--ink3);font-size:12.5px}
.empty button{margin-top:12px;border:1px solid var(--line);background:var(--raised);color:var(--acc);
  font-size:13px;font-family:inherit;border-radius:9px;padding:8px 18px;cursor:pointer}

/* 自选分类页（示意） */
.favtop{padding:10px 16px 6px;background:var(--app);flex:none;display:flex;align-items:center;gap:9px}
.favtop .t{font-family:"Noto Serif SC",serif;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:1px}
.favtop em{font-style:normal;font-size:11px;color:var(--ink3);font-family:Manrope,sans-serif}
.cats{display:flex;gap:7px;padding:4px 16px 10px;background:var(--app);flex:none;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{height:28px;border-radius:9px;border:0;background:var(--raised2);color:var(--ink2);font-size:12.5px;
  font-family:inherit;padding:0 12px;cursor:pointer;flex:none}
.cat.on{background:var(--acc);color:var(--pillInk);font-weight:600}
.favbody{flex:1;min-height:0;overflow-y:auto;position:relative}
html[data-mode="light"] .favbody{background:
  radial-gradient(120% 60% at 12% 0%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 62%),
  radial-gradient(100% 50% at 96% 22%,color-mix(in srgb,var(--warm) 9%,transparent),transparent 60%),
  var(--app)}
html[data-mode="dark"] .favbody{background:var(--app)}

/* 半屏层 / 弹窗 */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;flex-direction:column;
  justify-content:flex-end;border-radius:54px}
.sheet{background:var(--app);border-radius:18px 18px 0 0;max-height:62%;display:flex;flex-direction:column;
  overflow:hidden;box-shadow:0 -10px 34px rgba(0,0,0,.2);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:11px 16px 9px}
.sheet .sh b{font-size:15px;font-weight:600;color:var(--ink)}
.sheet .sh em{font-style:normal;font-size:12px;color:var(--ink3);font-family:Manrope,sans-serif}
.dlgwrap{position:absolute;inset:0;background:var(--scrim);z-index:24;display:flex;align-items:center;
  justify-content:center;border-radius:54px}
.dlg{width:270px;background:var(--raised);border-radius:14px;overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.28);animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}

function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255];}
function rgb2hsb(h){const[r,g,b]=hex2rgb(h);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let hh=0;
  if(d>0){if(mx===r)hh=(g-b)/d+(g<b?6:0);else if(mx===g)hh=(b-r)/d+2;else hh=(r-g)/d+4;hh/=6;}
  return{h:hh,s:mx===0?0:d/mx,b:mx};}
function hsb2css(h,s,b){const i=Math.floor(h*6),f=h*6-i,p=b*(1-s),q=b*(1-f*s),t=b*(1-(1-f)*s);

  case 3:r=p;g=q;bl=b;break;case 4:r=t;g=p;bl=b;break;default:r=b;g=p;bl=q;}
  const f2=v=>Math.round(v*255);return `rgb(${f2(r)},${f2(g)},${f2(bl)})`;}
function pull(a,b,amt){let d=b-a;if(d>0.5)d-=1;if(d<-0.5)d+=1;let v=a+d*amt;return (v+1)%1;}

function badgeTint(from,to){
  const st=getComputedStyle(document.documentElement);

  const seedAcc=st.getPropertyValue('--acc').trim();

  const a=rgb2hsb(from),b=rgb2hsb(to);
  if(Math.max(a.s,b.s)<0.12){

function grouped(v,dec){const n=Math.abs(v).toFixed(dec).split('.');
  n[0]=n[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return (v<0?'-':'')+n.join('.');}

function ivbar(){

let CANDLES=null;
function candles(){
  if(CANDLES)return CANDLES;
  let seed=20260917,rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  let p=104,out=[];
  for(let i=0;i<58;i++){const o=p,c=p*(1+(rnd()-0.47)*0.021);
    const h=Math.max(o,c)*(1+rnd()*0.008),l=Math.min(o,c)*(1-rnd()*0.008);
    out.push({o,c,h,l,v:0.3+rnd()*0.7});p=c;}
  CANDLES=out;return out;
}
function chart(){
  const cs=candles(),W=393,H=100; // viewBox 单位，用 preserveAspectRatio=none 铺满
  const hi=Math.max(...cs.map(c=>c.h)),lo=Math.min(...cs.map(c=>c.l));
  const top=6,mainH=62,volTop=72,volH=22;
  const y=v=>top+(hi-v)/(hi-lo)*mainH;
  const cw=(W-46)/cs.length, bw=cw*0.62;
  let g='';
  for(let i=1;i<5;i++)g+=`<line x1="0" y1="${top+mainH*i/5}" x2="${W-46}" y2="${top+mainH*i/5}" stroke="var(--cgrid)" stroke-width="0.3" opacity=".55" stroke-dasharray="2 2"/>`;
  let body='';
  cs.forEach((c,i)=>{const x=i*cw+cw/2,up=c.c>=c.o,col=up?'var(--up2)':'var(--down2)';
    body+=`<line x1="${x.toFixed(1)}" y1="${y(c.h).toFixed(1)}" x2="${x.toFixed(1)}" y2="${y(c.l).toFixed(1)}" stroke="${col}" stroke-width="0.5"/>`;
    const y1=y(Math.max(c.o,c.c)),y2=y(Math.min(c.o,c.c));
    body+=`<rect x="${(x-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.5,y2-y1).toFixed(1)}" fill="${col}"/>`;
    const vh=c.v*volH;
    body+=`<rect x="${(x-bw/2).toFixed(1)}" y="${(volTop+volH-vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${vh.toFixed(1)}" fill="${col}" opacity=".55"/>`;});
  // 均线
  const ma=(n,col)=>{let d='';cs.forEach((c,i)=>{if(i<n-1)return;
    let s=0;for(let k=i-n+1;k<=i;k++)s+=cs[k].c;const x=i*cw+cw/2,yy=y(s/n);
    d+=(d?'L':'M')+x.toFixed(1)+' '+yy.toFixed(1);});
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="0.6" opacity=".9"/>`;};
  let axis='';
  for(let i=0;i<=5;i++){const v=hi-(hi-lo)*i/5;
    axis+=`<span style="position:absolute;right:5px;top:calc(${(top+mainH*i/5).toFixed(2)}% - 5px)">${v.toFixed(0)}</span>`;}
  return `<div class="canvas"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <rect width="${W}" height="${H}" fill="var(--cbg)"/>${g}${ma(7,'#FFB400')}${ma(25,'#E849B9')}${body}
    <line x1="0" y1="${volTop-3}" x2="${W}" y2="${volTop-3}" stroke="var(--caxis)" stroke-width="0.6"/>
  </svg>
  <div class="malab"><b style="color:#FFB400">MA7</b><b style="color:#E849B9">MA25</b></div>
  <div class="ax">${axis}</div></div>`;
}

  return `<div class="tabbar">`+T.map(([t,ic])=>
    `<button class="tab ${t===active?'on':''}" data-a="${t==='自选'?'favs':''}">${ic}<span>${t}</span></button>`).join('')+`</div>`;

  <svg width="22" height="11" viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1"><rect x=".5" y=".5" width="19" height="11" rx="3"/><rect x="2" y="2" width="15" height="8" rx="1.6" fill="currentColor" stroke="none"/><path d="M21.4 4.2v3.6" stroke-width="2" stroke-linecap="round"/></svg>

function matches(st){
  const q=st.q.trim().toUpperCase();
  const alias={'以太':'ETH','比特':'BTC','黄金':'XAU','狗':'DOGE','英伟达':'NVDA','苹果':'AAPL','特斯拉':'TSLA'};

    </div>`:'';
  return statusbar()+`<div class="sbar">
      <div class="field ${st.focus?'focus':''}">
        <span style="color:var(--ink3);display:flex">${I.search13}</span>

/* ══════════════ 交互 ══════════════ */
document.getElementById('live').addEventListener('click',e=>{
  const stop=e.target.closest('[data-stop]');
  const t=e.target.closest('[data-a]');
  if(!t){return;}
  const a=t.dataset.a;
  if(a==='closeSheet'&&stop&&t.dataset.a!=='closeSheet')return;
  switch(a){
    case 'back': S.page='favs';break;
    case 'tomarket': S.page='market';break;
    case 'favs': S.page='favs';S.sheet=null;break;
    case 'search': S.page='search';S.sheet=null;S.focus=true;break;
    case 'cancel': S.page='market';S.q='';S.focus=false;break;
    case 'ident': if(D.quick==='keep'){S.sheet='quick';}else{S.page='search';S.focus=true;} break;
    case 'star': {const on=S.star.has(S.sym);on?S.star.delete(S.sym):S.star.add(S.sym);
      render();toast(on?'已移出自选':'已加入自选');return;}
    case 'fav': {e.stopPropagation();const k=t.dataset.k;const on=S.star.has(k);
      on?S.star.delete(k):S.star.add(k);render();toast(on?'已移出自选':'已加入自选');return;}
    case 'pick': {const k=t.dataset.k;S.sym=k;S.page='market';S.sheet=null;S.q='';
      S.flash=SYM[k].pct>=0?'up':'down';render();
      setTimeout(()=>{S.flash=null;render();},600);
      toast('已切到 '+name(SYM[k])+'/'+SYM[k].quote);return;}
    case 'hist': S.q=t.dataset.h;break;
    case 'clearAsk': S.sheet='clear';break;
    case 'clearDo': S.hist=[];S.sheet=null;break;
    case 'clearq': S.q='';break;
    case 'more': toast('展开全部结果（原型略）');return;
    case 'resetFilter': S.fMarket='all';S.fQuote='all';break;
    case 'fm': S.fMarket=t.dataset.v;break;
    case 'fq': S.fQuote=(S.fQuote===t.dataset.v)?'all':t.dataset.v;break;
    case 'cells': if(D.grid==='c')S.sheet='cells';else return;break;
    case 'cat': S.cat=t.dataset.v;break;
    case 'cell': {const k=t.dataset.v,i=S.cells.indexOf(k);
      if(i>=0){if(S.cells.length>1)S.cells.splice(i,1);}
      else if(S.cells.length<4)S.cells.push(k);break;}
    default: return;
  }
  render();
});

  if(e.target.id==='qin'){S.q=e.target.value;render();}
});
