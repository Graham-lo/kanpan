<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看盘 · 四套视觉方向</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#101114; --page2:#17181c; --pink:#E9EAEE; --pink2:#9A9CA4; --pink3:#63656D;
  --rule:rgba(255,255,255,.09);
}
body{background:var(--page);color:var(--pink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;padding:56px 32px 96px}
.wrap{max-width:1360px;margin:0 auto}
h1{font-size:30px;font-weight:600;letter-spacing:-.02em}
.lede{color:var(--pink2);margin-top:10px;max-width:760px;font-size:14.5px}
.note{color:var(--pink3);margin-top:10px;max-width:760px;font-size:12.5px}
.dir{margin-top:72px;padding-top:36px;border-top:1px solid var(--rule)}
.dh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.dh .idx{font:500 12px/1 ui-monospace,monospace;color:var(--pink3);letter-spacing:.18em;padding-top:4px}
.dh h2{font-size:24px;font-weight:600;letter-spacing:-.01em}
.dh .en{color:var(--pink3);font:400 13px/1 ui-monospace,monospace;letter-spacing:.06em}
.dh .rec{font-size:11px;color:#0b0c0e;background:#E9EAEE;border-radius:999px;padding:3px 9px;font-weight:600}
.sig{margin-top:14px;font-size:15px;color:var(--pink);max-width:720px}
.sig b{font-weight:600}
.why{margin-top:8px;font-size:13px;color:var(--pink2);max-width:760px}
.tok{display:flex;gap:28px;flex-wrap:wrap;margin:26px 0 30px;align-items:flex-start}
.sw{display:flex;gap:7px}
.sw i{width:26px;height:26px;border-radius:7px;display:block;border:1px solid rgba(255,255,255,.12)}
.tk-l{font:500 10px/1 ui-monospace,monospace;color:var(--pink3);letter-spacing:.16em;margin-bottom:9px}
.frames{display:flex;gap:28px;flex-wrap:wrap}
.fw{}
.cap{margin-top:14px;font-size:12px;color:var(--pink3);text-align:center;letter-spacing:.02em}
.device{width:411px;padding:9px;border-radius:53px;background:linear-gradient(160deg,#3a3d44,#1a1c20 40%,#26282d);box-shadow:0 40px 70px -20px rgba(0,0,0,.7)}
.phone{width:393px;height:852px;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column}

/* ============ 通用屏内结构 ============ */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink1);overflow:hidden}
.sb{height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 4px;font:600 15px/1 -apple-system;color:var(--ink1);flex:none}
.sb .dots{display:flex;gap:5px;align-items:center}
.sb .dots u{display:block;width:17px;height:11px;border:1.4px solid currentColor;border-radius:3px;opacity:.55}
.sb .dots s{display:block;width:15px;height:11px;background:currentColor;opacity:.55;-webkit-mask:linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0);clip-path:polygon(0 100%,25% 100%,25% 62%,0 62%,0 100%,33% 100%,33% 42%,58% 42%,58% 100%,66% 100%,66% 20%,91% 20%,91% 100%,100% 100%,100% 0,0 0)}
.chart{flex:1;min-height:0;position:relative}
.chart svg{display:block;width:100%;height:100%}
.hz{height:5px;width:130px;background:var(--ink1);opacity:.28;border-radius:3px;margin:0 auto}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ============ 方向 A · 墨玉 ============ */
.tA{--bg:#08090B;--surf:#0F1114;--ink1:#F3F4F6;--ink2:#8D929B;--ink3:#565B64;--rule:rgba(255,255,255,.07);--rule2:rgba(255,255,255,.12);--up:#2EBD85;--down:#F6465D;--sel:#FFFFFF}
.tA .scr{font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif}
.tA .num{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.tA .top{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none}
.tA .sym{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;letter-spacing:.01em}
.tA .sym em{font-style:normal;color:var(--ink3);font-weight:500;font-size:12px}
.tA .sym .cv{color:var(--ink3);font-size:9px;transform:translateY(1px)}
.tA .tr{display:flex;align-items:center;gap:14px}
.tA .st{font-size:10.5px;color:var(--ink3);letter-spacing:.06em}
.tA .price{padding:14px 16px 16px;flex:none}
.tA .pnow{font-size:42px;font-weight:500;letter-spacing:-.025em;line-height:1;color:var(--dn)}
.tA .pchg{font-size:15px;font-weight:500;margin-left:10px;letter-spacing:-.01em;color:var(--dn)}
.tA .psub{margin-top:14px;display:flex;gap:0;color:var(--ink3);font-size:10.5px}
.tA .psub div{flex:1}
.tA .psub b{display:block;font-weight:500;color:var(--ink2);font-size:12px;margin-top:3px;letter-spacing:-.01em}
.tA .iv{height:46px;display:flex;align-items:stretch;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);flex:none}
.tA .iv a{flex:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--ink3);position:relative;letter-spacing:.02em}
.tA .iv a.on{color:var(--sel);font-weight:600}
.tA .iv a.on:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:1.5px;background:var(--sel)}
.tA .iv .sep{width:1px;background:var(--rule);flex:none;margin:11px 4px}
.tA .iv a.draw{flex:0 0 62px;color:var(--ink2)}
.tA .tabs{height:86px;border-top:1px solid var(--rule);display:flex;padding-bottom:22px;flex:none;background:var(--bg)}
.tA .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink3);font-size:10px;letter-spacing:.04em}
.tA .tabs a.on{color:var(--sel)}

/* ============ 方向 B · 宣纸 ============ */
.tB{--bg:#F7F5F0;--surf:#FFFFFF;--ink1:#17181B;--ink2:#6C6F75;--ink3:#A3A199;--rule:#E4E0D7;--rule2:#D6D1C5;--up:#1F7A5C;--down:#C0402C;--sel:#17181B}
.tB .scr{font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif}
.tB .top{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex:none}
.tB .sym{display:flex;align-items:baseline;gap:5px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.tB .sym em{font-style:normal;color:var(--ink3);font-weight:500;font-size:12px}
.tB .sym .cv{font-size:9px;color:var(--ink3)}
.tB .tr{display:flex;align-items:center;gap:14px}
.tB .st{font-size:10px;color:var(--ink3);letter-spacing:.22em}
.tB .price{padding:20px 22px 20px;flex:none}
.tB .pnow{font-size:52px;font-weight:600;letter-spacing:-.045em;line-height:.94;color:var(--ink1)}
.tB .pchg{font-size:16px;font-weight:600;margin-top:10px;display:inline-block;letter-spacing:-.01em;color:var(--dn)}
.tB .pchg s{text-decoration:none;color:var(--ink3);font-weight:400;margin:0 8px}
.tB .psub{margin-top:18px;display:flex;border-top:1px solid var(--rule);padding-top:11px}
.tB .psub div{flex:1;border-left:1px solid var(--rule);padding-left:10px}
.tB .psub div:first-child{border-left:0;padding-left:0}
.tB .psub i{font-style:normal;display:block;font-size:9.5px;color:var(--ink3);letter-spacing:.18em}
.tB .psub b{display:block;font-weight:600;font-size:12.5px;margin-top:4px;letter-spacing:-.02em}
.tB .iv{height:48px;display:flex;align-items:center;padding:0 22px;gap:0;flex:none}
.tB .iv a{flex:1;text-align:center;font-size:13px;color:var(--ink3);position:relative;font-weight:500}
.tB .iv a.on{color:var(--ink1);font-weight:700}
.tB .iv a.on:after{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:99px;background:var(--ink1)}
.tB .iv .sep{flex:0 0 1px;height:16px;background:var(--rule);margin:0 10px}
.tB .iv a.draw{flex:0 0 46px;color:var(--ink1);font-weight:600}
.tB .chart{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tB .tabs{height:88px;display:flex;padding-bottom:24px;flex:none;background:var(--bg)}
.tB .tabs a{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:13.5px;letter-spacing:.04em;font-weight:500}
.tB .tabs a.on{color:var(--ink1);font-weight:700}

/* ============ 方向 C · 极光 ============ */
.tC{--bg:#0A0C12;--surf:rgba(255,255,255,.055);--ink1:#F4F5F8;--ink2:#9DA2B0;--ink3:#666C7D;--rule:rgba(255,255,255,.08);--up:#2EBD85;--down:#FF5D73;--sel:#7C86FF}
.tC .scr{font-family:-apple-system,"SF Pro Rounded","SF Pro Text","PingFang SC",sans-serif}
.tC .glow{position:absolute;top:-180px;left:50%;transform:translateX(-50%);width:640px;height:460px;border-radius:50%;filter:blur(70px);opacity:.42;background:radial-gradient(closest-side,var(--dn),transparent 72%);pointer-events:none}
.tC .top{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;position:relative}
.tC .sym{display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:600}
.tC .sym em{font-style:normal;color:var(--ink3);font-weight:500;font-size:12px}
.tC .sym .cv{font-size:9px;color:var(--ink3)}
.tC .tr{display:flex;align-items:center;gap:12px}
.tC .st{font-size:10.5px;color:var(--up);background:rgba(46,189,133,.14);padding:4px 9px;border-radius:99px;font-weight:600}
.tC .price{padding:12px 18px 18px;flex:none;position:relative}
.tC .pnow{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1}
.tC .pchg{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:700;padding:5px 11px;border-radius:99px;color:var(--dn);background:color-mix(in srgb,var(--dn) 16%,transparent)}
.tC .psub{margin-top:14px;display:flex;gap:8px}
.tC .psub div{flex:1;background:var(--surf);border:1px solid var(--rule);border-radius:14px;padding:9px 11px}
.tC .psub i{font-style:normal;display:block;font-size:9.5px;color:var(--ink3)}
.tC .psub b{display:block;font-weight:600;font-size:12.5px;margin-top:3px;letter-spacing:-.01em}
.tC .iv{height:52px;display:flex;align-items:center;padding:0 12px;gap:2px;flex:none;position:relative}
.tC .iv a{flex:1;text-align:center;font-size:12.5px;color:var(--ink3);padding:7px 0;border-radius:11px;font-weight:600}
.tC .iv a.on{color:#fff;background:var(--sel);box-shadow:0 6px 16px -6px var(--sel)}
.tC .iv .sep{flex:0 0 1px;height:16px;background:var(--rule);margin:0 6px}
.tC .iv a.draw{flex:0 0 54px;color:var(--ink1);background:var(--surf)}
.tC .tabs{height:94px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;flex:none;position:relative}
.tC .pill{display:flex;gap:4px;background:rgba(22,24,32,.82);border:1px solid var(--rule);border-radius:26px;padding:6px;backdrop-filter:blur(20px);box-shadow:0 14px 34px -12px rgba(0,0,0,.8)}
.tC .pill a{width:78px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink3);font-size:10px;border-radius:20px;font-weight:600}
.tC .pill a.on{color:#fff;background:rgba(124,134,255,.18)}
.tC .pill a.hero{color:#fff;background:var(--sel);box-shadow:0 8px 18px -6px var(--sel)}


/* ============ 方向 D · 夜昙（墨玉 × 极光） ============ */
.tD{--bg:#07080A;--surf:rgba(255,255,255,.05);--ink1:#F4F5F7;--ink2:#8E939C;--ink3:#575C65;--rule:rgba(255,255,255,.07);--rule2:rgba(255,255,255,.13);--up:#2EBD85;--down:#F6465D;--sel:#FFFFFF}
.tD .scr{font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif}
.tD .num{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.tD .halo{position:absolute;top:-172px;left:50%;transform:translateX(-50%);width:600px;height:400px;border-radius:50%;filter:blur(66px);opacity:.30;background:radial-gradient(closest-side,var(--dn),transparent 70%);pointer-events:none}
.tD .top{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none;position:relative}
.tD .sym{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;letter-spacing:.01em}
.tD .sym em{font-style:normal;color:var(--ink3);font-weight:500;font-size:12px}
.tD .sym .cv{color:var(--ink3);font-size:9px;transform:translateY(1px)}
.tD .tr{display:flex;align-items:center;gap:13px}
.tD .st{font-size:10.5px;color:var(--ink3);letter-spacing:.06em}
.tD .price{padding:12px 16px 14px;flex:none;position:relative}
.tD .pnow{font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1}
.tD .pchg{font-size:15px;font-weight:600;margin-left:11px;color:var(--dn);letter-spacing:-.01em}
.tD .psub{margin-top:16px;display:flex;border-top:1px solid var(--rule);padding-top:11px}
.tD .psub div{flex:1}
.tD .psub i{font-style:normal;display:block;font-size:9.5px;color:var(--ink3);letter-spacing:.12em}
.tD .psub b{display:block;font-weight:500;font-size:12px;margin-top:4px;color:var(--ink2);letter-spacing:-.01em}
.tD .iv{height:46px;display:flex;align-items:stretch;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);flex:none;position:relative}
.tD .iv a{flex:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--ink3);position:relative}
.tD .iv a.on{color:var(--sel);font-weight:600}
.tD .iv a.on:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:1.5px;background:var(--sel)}
.tD .iv .sep{width:1px;background:var(--rule);flex:none;margin:11px 4px}
.tD .iv a.draw{flex:0 0 62px;color:var(--ink2)}
.tD .tabs{height:88px;border-top:1px solid var(--rule);display:flex;align-items:flex-start;padding-top:10px;flex:none;background:var(--bg)}
.tD .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink3);font-size:10px;letter-spacing:.04em}
.tD .tabs a.on{color:var(--sel)}
.tD .tabs a.hero{color:var(--sel)}
.tD .tabs a.hero u{width:36px;height:30px;border-radius:11px;background:#fff;color:#07080A;display:flex;align-items:center;justify-content:center;text-decoration:none}
.tD .glass{background:rgba(17,19,24,.86);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--rule2)}

/* ============ 自选层 / 面板 通用 ============ */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.tB .dim{background:rgba(30,26,18,.26)}
.layer{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;overflow:hidden}
.sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden}
.srch{display:flex;align-items:center;gap:8px;font-size:14px}
.row{display:flex;align-items:center;gap:11px}
.mono{font-variant-numeric:tabular-nums}
.badge{font-size:8.5px;padding:1.5px 4px;border-radius:4px;letter-spacing:.04em}
.sw-track{width:44px;height:26px;border-radius:99px;position:relative;flex:none}
.sw-track:after{content:"";position:absolute;top:2.5px;width:21px;height:21px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw-on:after{right:2.5px}
.sw-off:after{left:2.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>看盘 · 视觉方向</h1>
  <p class="lede">图表底座、指标和它们的读数保持原样，四套方向里的 K 线画法完全一致（只随浅／深主题走）。被重新设计的是它之外的全部：顶栏、价格区、周期条、自选层、调图面板、底栏，以及字阶、色板、圆角、控件、分隔方式。</p>
  <p class="note">每套方向都是一个完整系统，不是配色换肤——排版、分隔逻辑、控件形态、强调方式都不一样。04「夜昙」是 01 与 03 的融合：墨玉的排版骨架 + 极光只保留在浮层与价格光晕上。挑一套，我再把它铺到全部页面并出实施规范。</p>
  <div id="out"></div>
</div>
<script>
/* ---------- 行情数据（三套共用同一份，保证可比） ---------- */
function rng(s){return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;}}
function series(n,seed){
  var r=rng(seed),p=0,out=[];
  for(var i=0;i<n;i++){
    var o=p,c=o-0.42+(r()-0.5)*3.1;
    var h=Math.max(o,c)+r()*1.35,l=Math.min(o,c)-r()*1.35;
    out.push({o:o,h:h,l:l,c:c,v:0.30+r()*0.85}); p=c;
  }
  var first=out[0].o,last=out[n-1].c;
  var A=77588,B=75942,k=(B-A)/(last-first);
  out.forEach(function(d){['o','h','l','c'].forEach(function(K){d[K]=A+(d[K]-first)*k;});});
  return out;
}
var S=series(62,20260916);
var P0=S[0].o,PN=S[S.length-1].c;
var HI=Math.max.apply(null,S.map(function(d){return d.h;}));
var LO=Math.min.apply(null,S.map(function(d){return d.l;}));
var CHG=(PN-P0)/P0*100;
function f2(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function ma(k){return S.map(function(_,i){if(i<k-1)return null;var s=0;for(var j=i-k+1;j<=i;j++)s+=S[j].c;return s/k;});}
var MA7=ma(7),MA30=ma(30);

/* ---------- 图表底座（冻结区，三套完全一致） ---------- */
function chart(P){
  var W=393,H=470,padR=54,x0=6,cw=(W-padR-x0)/S.length,bw=Math.max(3,cw*0.62);
  var mT=8,mH=282,vT=302,vH=62,dT=376,dH=62;
  var lo=LO-40,hi=HI+40;
  var y=function(p){return mT+(hi-p)/(hi-lo)*mH;};
  var g='';
  for(var i=0;i<=4;i++){var gy=mT+mH/4*i;g+='<line x1="0" y1="'+gy+'" x2="'+(W-padR+4)+'" y2="'+gy+'" stroke="'+P.grid+'" stroke-width=".5"/>';
    g+='<text x="'+(W-padR+8)+'" y="'+(gy+3.4)+'" fill="'+P.axis+'" font-size="9" font-family="ui-monospace,monospace">'+f2(hi-(hi-lo)/4*i).split('.')[0]+'</text>';}
  var c='';
  S.forEach(function(d,i){
    var cx=x0+cw*i+cw/2,up=d.c>=d.o,col=up?P.up:P.down;
    c+='<line x1="'+cx.toFixed(1)+'" y1="'+y(d.h).toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+y(d.l).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
    var yy=Math.min(y(d.o),y(d.c)),hh=Math.max(1,Math.abs(y(d.o)-y(d.c)));
    c+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+col+'"/>';
  });
  function poly(arr,col){var pts=arr.map(function(v,i){return v==null?null:(x0+cw*i+cw/2).toFixed(1)+','+y(v).toFixed(1);}).filter(Boolean).join(' ');
    return '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1" stroke-linejoin="round"/>';}
  var mv=Math.max.apply(null,S.map(function(d){return d.v;}));
  var v='';
  S.forEach(function(d,i){var cx=x0+cw*i+cw/2,hh=d.v/mv*(vH-8),col=d.c>=d.o?P.up:P.down;
    v+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(vT+vH-hh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+col+'" opacity=".5"/>';});
  var dif=S.map(function(_,i){return (MA7[i]==null||MA30[i]==null)?null:(MA7[i]-MA30[i]);});
  var md=Math.max.apply(null,dif.filter(function(x){return x!=null;}).map(Math.abs))||1;
