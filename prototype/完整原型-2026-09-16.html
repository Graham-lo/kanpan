<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>看盘 · 完整原型</title>
<style>

body{background:#100F0D;color:#EDEAE4;font:14px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;padding:0 0 140px}
.wrap{max-width:1760px;margin:0 auto;padding:0 30px}
.wrap>.hero{padding:52px 0 26px}
h1{font-size:34px;font-weight:700;letter-spacing:-.03em}
.lede{color:#948E84;margin-top:12px;max-width:980px;font-size:14.5px}
.lede b{color:#DAD4C9;font-weight:600}
/* 工具条 */
.bar{position:sticky;top:0;z-index:60;background:rgba(16,15,13,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.09);padding:12px 30px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:8px}
.grp>span.lb{font:600 10.5px/1 ui-monospace,monospace;letter-spacing:.2em;color:#6A6459}
.pick{display:flex;gap:5px;flex-wrap:wrap}
.pick button{font:600 12.5px/1 -apple-system,"PingFang SC";color:#B5AEA2;background:rgba(255,255,255,.07);border:1px solid transparent;border-radius:9px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:7px}
.pick button i{width:11px;height:11px;border-radius:4px;display:block}
.pick button:hover{background:rgba(255,255,255,.13)}
.pick button.on{color:#141210;background:#E8E2D6;border-color:#E8E2D6}
.tagline{color:#6A6459;font-size:12px;margin-left:auto}
/* 分节 */
.sec{margin:70px 0 0;padding-top:24px;border-top:1px solid rgba(255,255,255,.1)}
.sec h2{font-size:21px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:12px}
.sec h2 em{font-style:normal;font:700 11px/1 ui-monospace,monospace;letter-spacing:.24em;color:#6A6459}
.sec p{color:#948E84;font-size:13.5px;margin-top:8px;max-width:1040px}
.row{display:flex;gap:26px;flex-wrap:wrap;margin-top:26px;align-items:flex-start}
.unit{flex:none}
.device{padding:7px;border-radius:52px;background:linear-gradient(160deg,#514b42,#1a1815 42%,#2e2a24);box-shadow:0 34px 64px -26px rgba(0,0,0,.85)}
.device.p{width:397px}.device.p .phone{width:383px;height:830px;border-radius:45px}
.device.l .deco{height:180px}
.device.l{width:844px}.device.l .phone{width:830px;height:383px;border-radius:45px}

/* ============ 机内组件（全部走 CSS 变量，风格切换只换变量） ============ */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink1);overflow:hidden;font-family:var(--font,-apple-system,"SF Pro Text","PingFang SC",sans-serif)}
.num{font-family:var(--mono,ui-monospace,"SF Mono",Menlo,monospace);font-variant-numeric:tabular-nums}
.deco{position:absolute;left:0;right:0;top:0;height:400px;pointer-events:none;z-index:0}
.sb{height:48px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 27px 3px;font:650 15px/1 -apple-system;flex:none;position:relative;z-index:3}
.sb u{display:block;width:17px;height:10px;border:1.4px solid currentColor;border-radius:3px;opacity:.45;text-decoration:none}
.hdr{position:relative;flex:none;z-index:2}
.top{height:46px;display:flex;align-items:center;gap:11px;padding:0 var(--padx)}
.cn{display:flex;align-items:center;justify-content:center;flex:none;color:#fff;position:relative;border-radius:var(--rBadge)}
.cn:after{content:"";position:absolute;inset:0;border-radius:var(--rBadge);border:1px solid rgba(255,255,255,.3)}
.symw{flex:1;min-width:0}
.s1{font-size:15.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:5px;font-family:var(--disp,inherit)}
.s1 em{font-style:normal;color:var(--ink3);font-weight:500;font-size:11.5px}
.s2{font-size:10.5px;color:var(--ink3);letter-spacing:.06em;margin-top:2px;display:flex;align-items:center;gap:5px}
.s2.warn{color:var(--warn)}
.dotg{width:5px;height:5px;border-radius:9px;background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent);flex:none}
.dotg.w{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 24%,transparent)}
.rbtn{width:30px;height:30px;border-radius:var(--rBtn);background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.rbtn.star{color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.rbtn.plain{background:transparent;color:var(--ink3)}
.price{padding:13px var(--padx) 0;position:relative}
.prow2{display:flex;align-items:center;gap:11px}
.pnow{font-size:var(--pSize,29px);font-weight:var(--pWeight,700);letter-spacing:var(--pTrack,-.03em);line-height:1.08;font-family:var(--mono,ui-monospace,monospace);position:relative}
.pnow.stale{color:var(--ink3)}
.pflash{position:absolute;inset:-4px -7px;border-radius:9px;background:color-mix(in srgb,var(--dn2) 12%,transparent);z-index:-1}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:5px 10px 5px 8px;border-radius:var(--rPill);color:#fff;letter-spacing:-.01em}
.pill.mute{background:var(--surf2)!important;color:var(--ink3)!important;border-color:transparent!important}
.stats{display:flex;gap:8px;margin-top:14px}
.stats div{flex:1;background:var(--surf);border-radius:var(--rChip);padding:8px 10px 9px}
.stats i{font-style:normal;display:block;font-size:9px;color:var(--ink3);letter-spacing:.14em;font-weight:600}
.stats b{display:block;font-weight:650;font-size:12.5px;margin-top:4px;letter-spacing:-.015em}
.iv{display:flex;align-items:center;gap:5px;padding:14px var(--padx) 12px;flex:none;overflow:hidden;position:relative;z-index:2}
.iv a{font-size:12.5px;color:var(--ink2);padding:7px 9px;border-radius:var(--rPill);background:var(--surf);font-weight:600;flex:none;white-space:nowrap}
.iv a.on{color:var(--onInk,#fff);font-weight:700;background:var(--accBg)}
.iv a.gh{background:transparent;color:var(--ink3);padding:7px 3px}
.iv a.draw{background:var(--surf2);color:var(--ink1);display:flex;align-items:center;gap:5px;font-weight:700}
.chart{flex:1;min-height:0;position:relative}
.chart svg{display:block;width:100%;height:100%}
/* K 线底座配色（几何完全不变，只把颜色接到变量上） */
.chart .gd{stroke:var(--cGrid)}
.chart text{fill:var(--cAxis)}
.chart .up{fill:var(--cUp);stroke:var(--cUp)}
.chart .dn{fill:var(--cDn);stroke:var(--cDn)}
.chart .m1{stroke:var(--cMa1)}
.chart .m2{stroke:var(--cMa2)}
.chart .lst{stroke:var(--cDn)}
.chart .lstbox{fill:var(--cDn)}
.chart .lsttx{fill:#fff}
.tabs{height:84px;flex:none;display:flex;align-items:flex-start;padding:8px 12px 0;background:var(--bg);border-top:1px solid var(--rule);position:relative;z-index:3}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink3);font-size:10px;font-weight:650;letter-spacing:.05em}
.tabs a u{width:42px;height:27px;border-radius:var(--rChip);display:flex;align-items:center;justify-content:center;text-decoration:none}
.tabs a.on{color:var(--acc)}
.tabs a.on u{background:color-mix(in srgb,var(--acc) 15%,transparent)}
.tabs a.hero{color:var(--ink2)}
.tabs a.hero u{background:var(--accBg);color:var(--onInk,#fff)}
.dim{position:absolute;inset:0;background:var(--dim);z-index:4}
.layer{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;overflow:hidden;background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-bottom:1px solid var(--gline);border-radius:0 0 var(--rSheet) var(--rSheet);box-shadow:var(--shSheet);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid var(--gline);border-radius:var(--rSheet) var(--rSheet) 0 0;box-shadow:var(--shSheetUp);z-index:5}
.hz{height:5px;width:126px;background:var(--ink1);opacity:.2;border-radius:3px;margin:0 auto}
.grab{height:4px;width:40px;background:var(--ink1);opacity:.18;border-radius:3px;margin:0 auto}
.srch{height:42px;border-radius:var(--rChip);background:var(--surf);display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--ink3);font-size:14px}
.srch.on{color:var(--ink1);border:1.5px solid var(--acc);background:var(--card)}
.chipx{font-size:12.5px;font-weight:650;padding:7px 13px;border-radius:var(--rPill);color:var(--ink2);background:var(--surf);white-space:nowrap}
.chipx.on{color:var(--onInk,#fff);background:var(--accBg)}
.favwrap{flex:1;position:relative;margin:0 var(--favM);border-radius:var(--rCard);background:var(--favBg);overflow:hidden;box-shadow:var(--shCard)}
.frow{display:flex;align-items:center;gap:11px;padding:9px 14px;position:relative}
.vbar{position:absolute;left:0;top:9px;bottom:9px;width:2.5px;border-radius:2px}
.ttl{font-size:22px;font-weight:700;letter-spacing:-.03em;font-family:var(--disp,inherit)}
.card{background:var(--card);border-radius:var(--rCard);box-shadow:var(--shCard)}
.badge{font-size:8.5px;font-weight:700;padding:2px 5px;border-radius:5px;background:var(--surf2);color:var(--ink3);letter-spacing:.04em}
.chgtx{font-size:13px;font-weight:700;letter-spacing:-.01em}
.navbar{height:44px;display:flex;align-items:center;padding:0 var(--padx);position:relative;flex:none}
.navbar .mid{position:absolute;left:0;right:0;text-align:center;font-size:16px;font-weight:700;pointer-events:none;font-family:var(--disp,inherit)}
.back{color:var(--ink2);display:flex;align-items:center;font-size:14px;gap:1px}
/* 周期全表 */
.grid14{position:absolute;left:0;right:0;top:0;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--gline);border-radius:0 0 var(--rSheet) var(--rSheet);box-shadow:var(--shSheet);padding:13px var(--padx) 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;z-index:6}
.g14{height:50px;border-radius:var(--rChip);background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.g14 b{font-size:12.5px;font-weight:650}
.g14 i{font-style:normal;font-size:9.5px;color:var(--ink3);font-family:var(--mono,monospace)}
.g14.cur{border:1.5px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.g14 u{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:9px;background:var(--acc)}
/* 设置行 */
.srow{height:47px;display:flex;align-items:center;gap:11px;padding:0 15px;font-size:14.5px}
.srow+.srow{border-top:1px solid var(--rule)}
.srow .rt{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--ink3);font-size:13px}
.ico{width:27px;height:27px;border-radius:var(--rBadge);display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.sw{width:42px;height:25px;border-radius:99px;background:var(--surf2);position:relative;flex:none}
.sw:after{content:"";position:absolute;width:21px;height:21px;border-radius:99px;background:#fff;top:2px;left:2px;box-shadow:0 2px 5px rgba(0,0,0,.22)}
.sw.on{background:var(--accBg)}
.sw.on:after{left:19px}
.gt{font-size:10.5px;font-weight:650;color:var(--ink3);letter-spacing:.14em;padding:0 var(--padx) 7px}
.seg3{display:flex;gap:4px;background:var(--surf);border-radius:var(--rChip);padding:4px}
.seg3 span{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13.5px;padding:9px 0;border-radius:calc(var(--rChip) - 4px);color:var(--ink2);font-weight:600}
.seg3 span.on{background:var(--accBg);color:var(--onInk,#fff);font-weight:700}
.menu{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:650;color:var(--ink1);background:var(--surf);border-radius:var(--rPill);padding:6px 11px}
.btnbig{height:47px;border-radius:var(--rChip);background:var(--accBg);color:var(--onInk,#fff);display:flex;align-items:center;justify-content:center;font-size:15.5px;font-weight:700;box-shadow:0 12px 24px -14px var(--acc)}
.btnbig.off{background:var(--surf2);color:var(--ink3);box-shadow:none}
.inp{height:47px;border-radius:var(--rChip);background:var(--surf);display:flex;align-items:center;padding:0 14px;font-size:15px;color:var(--ink3)}
.inp.on{border:1.5px solid var(--acc);background:var(--card);color:var(--ink1)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:100px;height:42px;display:flex;align-items:center;gap:14px;padding:0 8px 0 16px;border-radius:99px;background:var(--toast);color:var(--toastInk);font-size:13.5px;font-weight:600;box-shadow:0 10px 26px -10px rgba(0,0,0,.45);z-index:9}
.toast b{font-weight:700;color:var(--toastAcc);padding:0 10px}
.ratebar{height:5px;border-radius:99px;display:flex;overflow:hidden;gap:2px}
.ratebar i{display:block;border-radius:99px}
.rrow{display:flex;gap:11px;padding:11px 14px;align-items:flex-start}
.rjudge{font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px}
.gbtn{width:34px;height:34px;border-radius:var(--rChip);background:var(--surf);color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:0 40px;text-align:center}
.empty .ei{width:66px;height:66px;border-radius:24px;background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--acc);margin-bottom:5px}
/* 横屏 */
.ltop{height:38px;display:flex;align-items:center;gap:10px;padding:0 18px;flex:none;position:relative;z-index:2}
.ltool{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;background:var(--surf);border-radius:var(--rCard);margin:0 10px 10px 8px}
.ltool a{width:38px;height:34px;border-radius:var(--rChip);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.ltool a.on{background:var(--accBg);color:var(--onInk,#fff)}
.lwrap{flex:1;display:flex;min-height:0}
</style><style id="stylecss"></style></head>
<body>
<div class="bar">
  <div class="grp"><span class="lb">STYLE</span><div class="pick" id="pk"></div></div>
  <div class="grp"><span class="lb">THEME</span><div class="pick" id="pt">
    <button data-t="lt" class="on">浅色</button><button data-t="dk">深色</button></div></div>
  <span class="tagline">27 屏 · 6 风格 × 深浅 · 切换即时生效 · K 线与指标画法不变</span>
</div>
<div class="wrap"><div class="hero">
<h1>看盘 · 完整原型</h1>
<p class="lede">这是<b>整个 app 的原型</b>：盘面、周期全表、横屏画线台、自选层（默认 / 搜索 / 展开 / 空）、记一笔（卡片 / 找相似 / 已记下）、复盘（列表 / 战绩 / 详情 / 空 / 未登录）、调图面板（图表 / 指标 / 偏好）、账号、登录、诊断，共 27 屏，含冷启动、断网、同步失败、搜不到、空态这些真实状态。<b>K 线与指标的画法沿用 AICoin 那一套，几何一根不动</b>，只把配色接到主题变量上。顶上可以随时换风格和深浅。</p>
</div><div id="out"></div></div>
<script>
/* ================= 行情数据 ================= */
function rng(s){return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;}}
function series(n,seed){var r=rng(seed),p=0,o=[];for(var i=0;i<n;i++){var a=p,c=a-0.42+(r()-0.5)*3.1,h=Math.max(a,c)+r()*1.35,l=Math.min(a,c)-r()*1.35;o.push({o:a,h:h,l:l,c:c,v:0.30+r()*0.85});p=c;}
 var f=o[0].o,la=o[n-1].c,A=77588,B=75942,k=(B-A)/(la-f);o.forEach(function(d){['o','h','l','c'].forEach(function(K){d[K]=A+(d[K]-f)*k;});});return o;}
var S=series(62,20260916),P0=S[0].o,PN=S[S.length-1].c;
var HI=Math.max.apply(null,S.map(function(d){return d.h;})),LO=Math.min.apply(null,S.map(function(d){return d.l;}));
var CHG=(PN-P0)/P0*100;
function f2(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function ma(k){return S.map(function(_,i){if(i<k-1)return null;var s=0;for(var j=i-k+1;j<=i;j++)s+=S[j].c;return s/k;});}
var MA7=ma(7),MA30=ma(30);
function fnum(v){return v<10?v.toFixed(4):v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function sgn(v){return (v>=0?'+':'\u2212')+Math.abs(v).toFixed(2)+'%';}

/* ========== K 线底座：几何与 AICoin 复刻版一致，颜色接到主题变量 ========== */
function chart(o){o=o||{};var W=o.w||383,H=o.h||470,bare=o.bare;
 var padR=54,x0=6,cw=(W-padR-x0)/S.length,bw=Math.max(3,cw*0.62);
 var mT=8,mH=bare?(H-16):282,vT=302,vH=62,dT=376,dH=62,lo=LO-40,hi=HI+40;
 var y=function(p){return mT+(hi-p)/(hi-lo)*mH;},g='',i;
 for(i=0;i<=4;i++){var gy=mT+mH/4*i;
  g+='<line class="gd" x1="0" y1="'+gy+'" x2="'+(W-padR+4)+'" y2="'+gy+'" stroke-width=".5"/>'
   +'<text x="'+(W-padR+8)+'" y="'+(gy+3.4)+'" font-size="9" font-family="ui-monospace,monospace">'+f2(hi-(hi-lo)/4*i).split('.')[0]+'</text>';}
 var c='';S.forEach(function(d,i){var cx=x0+cw*i+cw/2,cl=d.c>=d.o?'up':'dn';
  c+='<line class="'+cl+'" x1="'+cx.toFixed(1)+'" y1="'+y(d.h).toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+y(d.l).toFixed(1)+'" stroke-width="1"/>';
  var yy=Math.min(y(d.o),y(d.c)),hh=Math.max(1,Math.abs(y(d.o)-y(d.c)));
  c+='<rect class="'+cl+'" x="'+(cx-bw/2).toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'"/>';});
 function poly(a,cl){return '<polyline class="'+cl+'" points="'+a.map(function(v,i){return v==null?null:(x0+cw*i+cw/2).toFixed(1)+','+y(v).toFixed(1);}).filter(Boolean).join(' ')+'" fill="none" stroke-width="1" stroke-linejoin="round"/>';}
 var ly=y(PN);
 var last='<line class="lst" x1="0" y1="'+ly.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+ly.toFixed(1)+'" stroke-width=".7" stroke-dasharray="2 3" opacity=".85"/>'
  +'<rect class="lstbox" x="'+(W-padR+3)+'" y="'+(ly-8).toFixed(1)+'" width="49" height="16" rx="3"/>'
  +'<text class="lsttx" x="'+(W-padR+7)+'" y="'+(ly+3.6).toFixed(1)+'" font-size="9.5" font-family="ui-monospace,monospace">'+f2(PN)+'</text>';
 if(bare) return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+c+last+'</svg>';
 var mv=Math.max.apply(null,S.map(function(d){return d.v;})),v='';
 S.forEach(function(d,i){var cx=x0+cw*i+cw/2,hh=d.v/mv*(vH-8);
  v+='<rect class="'+(d.c>=d.o?'up':'dn')+'" x="'+(cx-bw/2).toFixed(1)+'" y="'+(vT+vH-hh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" opacity=".5"/>';});
 var dif=S.map(function(_,i){return (MA7[i]==null||MA30[i]==null)?null:(MA7[i]-MA30[i]);});
