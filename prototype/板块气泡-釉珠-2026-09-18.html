<!doctype html>
<html lang="zh-CN" data-skin="sage" data-mode="dark" data-redup="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>板块 · 釉珠</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   看盘 Hkline · 板块气泡页 ——「釉珠 · 环光」                   2026-09-18
   ──────────────────────────────────────────────────────────────────────────
   球是器物不是活物：一颗烧过的釉珠。近乎实心的深釉盘面 + 边缘积釉的暗圈 +
   被环境照亮的一圈环光（不是均匀的 CSS 发光，是随方位变亮变暗的高光带）。
   深色下环光外溢一圈紧贴球缘的辉；浅色下换成被强光打亮的实体 + 真实接触投影。
   球身只讲强弱两色，整屏的色彩丰富度来自球心那 37 枚各有配色的板块记号。
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 皮肤令牌（取自 app 的 Palette.swift） ───────────────────────────────── */
html[data-skin="sage"][data-mode="light"]{
  --ground:#C6D8CD; --app:#F3F7F4; --raised:#FFFFFF; --raised2:#E7EFE9;
  --line:#D6E3DA; --hair:#14211B14; --rule:#14211B1C;
  --ink:#14211B; --ink2:#4E6158; --ink3:#606F67; --ink4:#8E9B95;
  --acc:#2E7D6B; --accB:#55A891; --onAcc:#FFFFFF; --gold:#B37B25;
  --green:#36B257; --red:#E64552; --shadow:#14211B;
  --glass:#FFFFFFB8; --edge:#FFFFFFE6;
}
html[data-skin="sage"][data-mode="dark"]{
  --ground:#050907; --app:#0B120F; --raised:#131C18; --raised2:#1A241F;
  --line:#25332C; --hair:#FFFFFF12; --rule:#FFFFFF1C;
  --ink:#E9F2EC; --ink2:#A5B8AE; --ink3:#7B8D85; --ink4:#5C6B64;
  --acc:#4FB69C; --accB:#63CDB1; --onAcc:#06231C; --gold:#D9A64C;
  --green:#4FB69C; --red:#E36159; --shadow:#000000;
  --glass:#FFFFFF10; --edge:#FFFFFF2E;
}
html[data-skin="terra"][data-mode="light"]{
  --ground:#DCCBB8; --app:#FBF6F0; --raised:#FFFFFF; --raised2:#F2E8DE;
  --line:#E7DACB; --hair:#241A1314; --rule:#241A131C;
  --ink:#241A13; --ink2:#6E5C4D; --ink3:#756659; --ink4:#9C8B7B;
  --acc:#B25735; --accB:#E5975C; --onAcc:#FFFFFF; --gold:#B37B25;
  --green:#36B257; --red:#E64552; --shadow:#241A13;
  --glass:#FFFFFFB8; --edge:#FFFFFFE6;
}
html[data-skin="terra"][data-mode="dark"]{
  --ground:#0A0604; --app:#16100C; --raised:#211812; --raised2:#2A1F17;
  --line:#37281D; --hair:#FFFFFF12; --rule:#FFFFFF1C;
  --ink:#F7EFE6; --ink2:#C2AC98; --ink3:#958576; --ink4:#6C5E52;
  --acc:#E2874F; --accB:#F0A468; --onAcc:#2A1206; --gold:#E0A544;
  --green:#3FA783; --red:#E0584A; --shadow:#000000;
  --glass:#FFFFFF10; --edge:#FFFFFF2E;
}
html[data-skin="classic"][data-mode="light"]{
  --ground:#EDEFF2; --app:#FFFFFF; --raised:#FFFFFF; --raised2:#F5F6F8;
  --line:#E3E6EB; --hair:#0A0D1214; --rule:#0A0D121C;
  --ink:#0A0D12; --ink2:#4A5160; --ink3:#6B7382; --ink4:#98A0AD;
  --acc:#2E6BE6; --accB:#5B8CF0; --onAcc:#FFFFFF; --gold:#B57C28;
  --green:#36B257; --red:#E64552; --shadow:#0A0D12;
  --glass:#FFFFFFB8; --edge:#FFFFFFE6;
}
html[data-skin="classic"][data-mode="dark"]{
  --ground:#080C14; --app:#0E1524; --raised:#151E30; --raised2:#1C273C;
  --line:#25324A; --hair:#FFFFFF12; --rule:#FFFFFF1C;
  --ink:#E6ECF5; --ink2:#A3AFC2; --ink3:#78859A; --ink4:#586478;
  --acc:#4E86F2; --accB:#7BA6F7; --onAcc:#04101F; --gold:#E0A544;
  --green:#36B257; --red:#E64552; --shadow:#000000;
  --glass:#FFFFFF10; --edge:#FFFFFF2E;
}
html[data-redup="0"]{ --rise:var(--green); --fall:var(--red) }
html[data-redup="1"]{ --rise:var(--red);   --fall:var(--green) }

:root{
  --f-title:ui-serif,"New York","Songti SC","STSong",Georgia,serif;
  --f-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.42'/></svg>");
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ height:100%; margin:0 }
body{
  font-family:var(--f-body); color:var(--ink);
  background:#101418;
  display:flex; align-items:center; justify-content:center; gap:26px;
  -webkit-font-smoothing:antialiased;
  transition:background .45s ease;
}
body[data-solo="1"]{ background:#0b0d10 }

/* ── 手机画框 ─────────────────────────────────────────────────────────── */
#phone{
  position:relative; width:390px; height:844px; flex:0 0 auto;
  border-radius:44px; overflow:hidden;
  background:var(--app);
  box-shadow:0 34px 90px -20px #000A, 0 0 0 1px #ffffff14, 0 0 0 9px #16181c, 0 0 0 10px #2a2d33;
  transition:background .45s ease;
  isolation:isolate;
}

/* 一整块连续的材料：光斑 + 地平线 + 颗粒，上下不拼边 */
#ground{ position:absolute; inset:0; z-index:0; pointer-events:none }
#ground::before{
  content:""; position:absolute; inset:-12%;
  background:
    radial-gradient(74% 46% at 26% 8%,  color-mix(in oklab, var(--acc) 22%, transparent) 0%, transparent 66%),
    radial-gradient(66% 40% at 88% 22%, color-mix(in oklab, var(--accB) 14%, transparent) 0%, transparent 62%),
    radial-gradient(90% 52% at 50% 104%,color-mix(in oklab, var(--gold) 13%, transparent) 0%, transparent 64%),
    linear-gradient(172deg, color-mix(in oklab, var(--app) 88%, var(--ink) 12%) 0%, var(--app) 34%, color-mix(in oklab, var(--app) 82%, var(--ground) 18%) 100%);
  transition:background .45s ease;
}
html[data-mode="dark"] #ground::before{
  background:
    radial-gradient(76% 44% at 24% 6%,  color-mix(in oklab, var(--acc) 26%, transparent) 0%, transparent 64%),
    radial-gradient(64% 38% at 90% 26%, color-mix(in oklab, var(--accB) 15%, transparent) 0%, transparent 60%),
    radial-gradient(96% 54% at 50% 106%,color-mix(in oklab, var(--gold) 15%, transparent) 0%, transparent 62%),
    linear-gradient(174deg, color-mix(in oklab, var(--app) 62%, #000 38%) 0%, var(--app) 40%, color-mix(in oklab, var(--ground) 78%, var(--app) 22%) 100%);
}
/* 地平线：强弱两簇之间那道分界，只是一层极缓的明度变化，不是一条边 */
#ground::after{
  content:""; position:absolute; inset:0;
  background-image:var(--grain);
  background-size:170px 170px;
  opacity:.5; mix-blend-mode:soft-light;
}
#horizon{
  position:absolute; left:-20%; right:-20%; height:220px; z-index:0; pointer-events:none;
  background:radial-gradient(60% 50% at 50% 50%, color-mix(in oklab, var(--accB) 16%, transparent) 0%, transparent 72%);
  opacity:.75; filter:blur(4px); transition:top .5s cubic-bezier(.22,1,.36,1);
}
html[data-mode="light"] #horizon{ opacity:.5 }

/* ── 顶栏 ─────────────────────────────────────────────────────────────── */
#top{ position:absolute; left:0; right:0; top:0; z-index:6; padding:56px 20px 0 }
.trow{ display:flex; align-items:baseline; gap:12px }
.ttl{ font-family:var(--f-title); font-size:21px; font-weight:600; letter-spacing:.06em; color:var(--ink) }
.tsub{ font-size:11px; color:var(--ink4); letter-spacing:.14em; font-family:var(--f-num) }
.spacer{ flex:1 }
.mkt{ display:flex; align-items:center; gap:2px; padding:2px;
  border-radius:999px; background:color-mix(in oklab, var(--ink) 6%, transparent);
  box-shadow:inset 0 0 0 .5px var(--rule) }
html[data-mode="dark"] .mkt{ background:#ffffff0e }
.mkt button{
  appearance:none; border:0; cursor:pointer; font-family:var(--f-body);
  font-size:12px; letter-spacing:.04em; padding:5px 11px 6px; border-radius:999px;
  color:var(--ink3); background:transparent; transition:.22s ease;
}
.mkt button[aria-selected="true"]{
  color:var(--onAcc);
  background:linear-gradient(160deg, color-mix(in oklab, var(--accB) 92%, #fff 8%), var(--acc));
  box-shadow:0 1px 3px color-mix(in oklab, var(--acc) 40%, transparent), inset 0 1px 0 #ffffff40;
}
.more{
  width:28px; height:28px; border-radius:999px; border:0; cursor:pointer; margin-left:8px;
  background:color-mix(in oklab, var(--ink) 6%, transparent); color:var(--ink2);
  font-size:15px; line-height:1; display:grid; place-items:center;
  box-shadow:inset 0 0 0 .5px var(--rule);
}
html[data-mode="dark"] .more{ background:#ffffff0e }
.brow{ display:flex; align-items:center; gap:7px; margin-top:12px }
.chip{
  appearance:none; border:0; cursor:pointer; font-family:var(--f-body); white-space:nowrap; flex:0 0 auto;
  font-size:11.5px; letter-spacing:.02em; padding:4px 10px 5px; border-radius:999px;
  color:var(--ink3); background:transparent; box-shadow:inset 0 0 0 .5px var(--rule);
  transition:.2s ease;
}
.chip[aria-selected="true"]{
  color:var(--ink); background:color-mix(in oklab, var(--raised) 70%, transparent);
  box-shadow:inset 0 0 0 .5px var(--line), 0 1px 2px #0000000d;
}
html[data-mode="dark"] .chip[aria-selected="true"]{ background:#ffffff14; box-shadow:inset 0 0 0 .5px #ffffff2a }
.count{ margin-left:auto; font-size:10.5px; white-space:nowrap; color:var(--ink4); font-family:var(--f-num); letter-spacing:.06em }

/* ── 气泡场 ───────────────────────────────────────────────────────────── */
#field{ position:absolute; inset:0; z-index:3; touch-action:none }

/* ── 底部标签栏：没有自己的底，页面材料从背后穿过去 ──────────────────── */
#tabs{
  position:absolute; left:0; right:0; bottom:0; height:84px; z-index:7;
  display:flex; align-items:flex-start; justify-content:space-around;
  padding:12px 14px 0;
}
#tabs::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to top, color-mix(in oklab, var(--app) 82%, transparent) 26%, transparent 100%);
  -webkit-mask-image:linear-gradient(to top, #000 40%, transparent 100%);
}
.tab{ position:relative; width:46px; height:44px; display:grid; place-items:center; cursor:pointer; border:0; background:none }
.tab svg{
  width:27px; height:27px; display:block; opacity:.52; transition:opacity .25s ease;
  filter:drop-shadow(0 1px 2.5px rgba(0,0,0,.12));   /* 柔影，不是辉光 */
}
html[data-mode="dark"] .tab svg{ filter:drop-shadow(0 1px 2.5px rgba(0,0,0,.26)) }
.tab[aria-selected="true"] svg{ opacity:1 }

/* ── 第二层：板块品种列表（照抄自选页的行） ───────────────────────────── */
#list{
  position:absolute; inset:0; z-index:8; display:none; flex-direction:column;
  opacity:0; transition:opacity .28s ease;
}
#list.on{ display:flex }
#list.in{ opacity:1 }
.lhead{ padding:56px 20px 0; position:relative; z-index:2 }
.lh1{ display:flex; align-items:center; gap:11px }
.back{
  width:30px; height:30px; border-radius:999px; border:0; cursor:pointer; flex:0 0 auto;
  background:color-mix(in oklab, var(--ink) 6%, transparent); color:var(--ink2);
  display:grid; place-items:center; box-shadow:inset 0 0 0 .5px var(--rule);
}
html[data-mode="dark"] .back{ background:#ffffff0e }
#medal{ width:38px; height:38px; flex:0 0 auto }
.lname{ font-family:var(--f-title); font-size:19px; font-weight:600; letter-spacing:.04em }
.lmeta{ font-size:11px; color:var(--ink4); font-family:var(--f-num); letter-spacing:.06em; margin-top:2px }
.lpct{ margin-left:auto; text-align:right; font-family:var(--f-num) }
.lpct .v{ font-size:19px; font-weight:500; letter-spacing:-.01em }
.lpct .k{ font-size:10px; color:var(--ink4); letter-spacing:.1em }
.lsort{ display:flex; gap:7px; margin-top:14px; align-items:center }
.rows{ flex:1; overflow-y:auto; margin-top:10px; padding:0 20px 96px; position:relative; z-index:2; -webkit-overflow-scrolling:touch }
.row{
  display:flex; align-items:center; gap:12px; padding:11px 2px 12px; cursor:pointer;
  border-bottom:.5px solid var(--hair); position:relative;
}
.row:last-child{ border-bottom:0 }
.row .nm{ min-width:0 }
.row .n1{ font-size:14.5px; letter-spacing:.01em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.row .n2{ font-size:11px; color:var(--ink4); font-family:var(--f-num); letter-spacing:.05em; margin-top:3px }
.row .rt{ margin-left:auto; display:flex; align-items:center; gap:9px }
.row .px{ font-size:15.5px; font-family:var(--f-num); letter-spacing:-.01em; color:var(--ink); text-align:right }
.pill{
  min-width:66px; text-align:center; font-family:var(--f-num); font-size:12.5px; letter-spacing:-.01em;
  padding:4px 8px 5px; border-radius:8px; color:#fff;
}
.pill.up{ background:linear-gradient(160deg, color-mix(in oklab, var(--rise) 88%, #fff 12%), color-mix(in oklab, var(--rise) 92%, #000 8%)) }
.pill.dn{ background:linear-gradient(160deg, color-mix(in oklab, var(--fall) 88%, #fff 12%), color-mix(in oklab, var(--fall) 92%, #000 8%)) }

/* ── 第三层：行情页占位 ───────────────────────────────────────────────── */
#quote{ position:absolute; inset:0; z-index:9; display:none; flex-direction:column; opacity:0; transition:opacity .26s ease }
#quote.on{ display:flex } #quote.in{ opacity:1 }
.qhead{ padding:56px 20px 0 }
.qtop{ display:flex; align-items:center; gap:11px }
.qname{ font-size:17px; letter-spacing:.02em }
.qbadge{ font-size:10px; color:var(--ink4); font-family:var(--f-num); letter-spacing:.1em; margin-top:2px }
.qpx{ margin-left:auto; text-align:right; font-family:var(--f-num) }
.qpx .v{ font-size:22px; font-weight:500 }
.qstats{ display:flex; gap:0; margin-top:18px; padding:0 20px }
.qstat{ flex:1 } .qstat .k{ font-size:10px; color:var(--ink4); letter-spacing:.08em }
.qstat .v{ font-size:13px; font-family:var(--f-num); margin-top:3px }
#qchart{ flex:1; margin:14px 12px 96px; border-radius:16px; position:relative; overflow:hidden }

/* ── 「全部板块」整页清单 ─────────────────────────────────────────────── */
#sheet{ position:absolute; inset:0; z-index:10; display:none; flex-direction:column; opacity:0; transition:opacity .26s ease }
#sheet.on{ display:flex } #sheet.in{ opacity:1 }
.shead{ padding:56px 20px 6px; display:flex; align-items:center; gap:11px }
.sgrid{ flex:1; overflow-y:auto; padding:8px 20px 96px }
.sgroup{ font-family:var(--f-title); font-size:12.5px; letter-spacing:.14em; color:var(--ink4); margin:16px 0 6px }
.srow{ display:flex; align-items:center; gap:11px; padding:9px 2px; border-bottom:.5px solid var(--hair); cursor:pointer }
.srow canvas{ width:26px; height:26px; flex:0 0 auto }
.srow .sn{ font-size:14px } .srow .sm{ font-size:10.5px; color:var(--ink4); font-family:var(--f-num); margin-top:2px; letter-spacing:.06em }
.srow .sp{ margin-left:auto; font-family:var(--f-num); font-size:13.5px }


/* ── 上层页面共用的那块材料：和气泡场是同一张底，不是另一种纸 ────────── */
.layer{
  background-color:var(--app);
  background-image:
    var(--grain),
    radial-gradient(74% 46% at 26% 8%,  color-mix(in oklab, var(--acc) 18%, transparent) 0%, transparent 66%),
    radial-gradient(90% 52% at 50% 104%,color-mix(in oklab, var(--gold) 11%, transparent) 0%, transparent 64%),
    linear-gradient(172deg, color-mix(in oklab, var(--app) 88%, var(--ink) 12%) 0%, var(--app) 34%, color-mix(in oklab, var(--app) 84%, var(--ground) 16%) 100%);
  background-size:170px 170px, auto, auto, auto;
  background-blend-mode:soft-light, normal, normal, normal;
}
html[data-mode="dark"] .layer{
  background-image:
    var(--grain),
    radial-gradient(76% 44% at 24% 6%,  color-mix(in oklab, var(--acc) 22%, transparent) 0%, transparent 64%),
    radial-gradient(96% 54% at 50% 106%,color-mix(in oklab, var(--gold) 13%, transparent) 0%, transparent 62%),
    linear-gradient(174deg, color-mix(in oklab, var(--app) 62%, #000 38%) 0%, var(--app) 40%, color-mix(in oklab, var(--ground) 78%, var(--app) 22%) 100%);
}

/* ── 调试抽屉 ─────────────────────────────────────────────────────────── */
#handle{
  position:absolute; top:400px; right:-2px; width:13px; height:56px; z-index:12; cursor:pointer;
  border-radius:9px 0 0 9px; background:#ffffff10; box-shadow:inset 0 0 0 .5px #ffffff22;
  opacity:.35; transition:opacity .2s;
}
#handle:hover{ opacity:.8 }
#drawer{
  width:300px; flex:0 0 auto; align-self:stretch; max-height:844px; overflow-y:auto;
  background:#151a1f; color:#dfe6ea; border-radius:18px; padding:18px 18px 26px;
  box-shadow:0 20px 60px -20px #000; font-size:12px;
}
#drawer h4{ margin:0 0 4px; font-size:12px; letter-spacing:.14em; color:#8fa0aa; font-weight:500 }
#drawer .sec{ margin-top:16px; padding-top:14px; border-top:1px solid #ffffff12 }
#drawer .sec:first-of-type{ border-top:0; padding-top:0 }
.seg{ display:flex; gap:4px; margin-top:8px; flex-wrap:wrap }
.seg button{
  flex:1 1 auto; appearance:none; border:0; cursor:pointer; padding:6px 8px; border-radius:8px;
  background:#ffffff0e; color:#aab6bd; font-size:11.5px; font-family:var(--f-body); transition:.18s;
}
.seg button[aria-selected="true"]{ background:#3c8f7a; color:#fff }
.sl{ display:flex; align-items:center; gap:9px; margin-top:9px }
.sl label{ width:66px; color:#93a2ab; font-size:11px; flex:0 0 auto }
.sl input[type=range]{ flex:1; accent-color:#4FB69C; height:3px }
.sl output{ width:40px; text-align:right; color:#dfe6ea; font-family:var(--f-num); font-size:11px }
.sw{ display:flex; align-items:center; gap:8px; margin-top:10px; color:#93a2ab }
.sw input{ accent-color:#4FB69C }
#drawer .note{ margin-top:12px; color:#6e7d86; line-height:1.6; font-size:10.5px }
body[data-solo="1"] #drawer{ display:none }
</style>
</head>
<body>

<div id="phone">
  <div id="ground"></div>
  <div id="horizon"></div>

  <div id="top">
    <div class="trow">
      <div class="ttl" id="ttl">板块</div>
      <div class="spacer"></div>
      <div class="mkt" id="mkt">
        <button data-m="crypto" aria-selected="true">加密</button>
        <button data-m="us" aria-selected="false">美股</button>
      </div>
      <button class="more" id="moreBtn">···</button>
    </div>
    <div class="brow" id="brow">
      <button class="chip" data-k="median" aria-selected="true">中位数</button>
      <button class="chip" data-k="mean" aria-selected="false">均值</button>
      <button class="chip" data-k="vw" aria-selected="false">成交额加权</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <canvas id="field"></canvas>

  <div id="tabs">
    <!-- 三支釉，口径跟 app 的 TabGlyph 对齐：一律 topLeading → (0.35, 1)，一个记号里最多两支 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <linearGradient id="gA" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="var(--accB)"/><stop offset="1" stop-color="var(--acc)"/></linearGradient>
      <linearGradient id="gL" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="color-mix(in oklab, var(--acc) 48%, #fff 52%)"/>
        <stop offset="1" stop-color="color-mix(in oklab, var(--acc) 84%, #fff 16%)"/></linearGradient>
      <linearGradient id="gG" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="color-mix(in oklab, var(--gold) 66%, #fff 34%)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient>
    </defs></svg>

    <button class="tab" aria-selected="false" title="画线"><svg viewBox="0 0 24 24">
      <path d="M3.4 17.6 8.5 12.1l3.4 3 6.4-8.2" fill="none" stroke="url(#gA)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="19.1" cy="5.9" r="2.5" fill="url(#gG)"/>
    </svg></button>

/* ══════════════════════════════════════════════════════════════════════
   上色：BadgeTint 的 JS 移植
   ══════════════════════════════════════════════════════════════════════
   和 Kanpan/Main/CoinBadge.swift 里的 `BadgeTint.compute` 一比一：
   色相往皮肤主色偏 11%（黄金那段只偏 4%）、饱和度封顶、明度收进窄带、
   深色皮肤整体再压暗一档。所以每枚图标只声明自己的 from/to 原色，
   三套皮肤 × 深浅共六种环境由这段变换负责。                           */

const SECTOR_SKIN_ACCENT = {
  'sage:light': '#2E7D6B', 'sage:dark': '#4FB69C',
  'terra:light': '#B25735', 'terra:dark': '#E2874F',
  'classic:light': '#2E6BE6', 'classic:dark': '#4E86F2',
};

function _hex2hsb(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d > 0) {
    if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h /= 6;
  }
  return { h, s: mx === 0 ? 0 : d / mx, b: mx };
}

function _hsb2css(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  let r, g, b;
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    default: r = v; g = p; b = q; break;
  }
  const c = x => Math.round(Math.max(0, Math.min(1, x)) * 255);
  return `rgb(${c(r)},${c(g)},${c(b)})`;
}

const _gold = h => h > 0.07 && h < 0.20;
const _clamp = (v, lo, hi) => Math.min(Math.max(v, Math.min(lo, hi)), hi);

function _pull(h, target, k) {
  let d = target - h;
  if (d > 0.5) d -= 1; else if (d < -0.5) d += 1;
  const r = h + d * k;
  return r < 0 ? r + 1 : (r >= 1 ? r - 1 : r);
}

const _tintMemo = new Map();

/** 一对渐变端点（CSS 颜色字符串）。skin: 'sage'|'terra'|'classic'，dark: bool。 */
function sectorTint(from, to, skin, dark) {
  const key = from + to + skin + dark;
  const hit = _tintMemo.get(key);
  if (hit) return hit;

  const a = _hex2hsb(from), b = _hex2hsb(to);
  const sk = _hex2hsb(SECTOR_SKIN_ACCENT[skin + ':' + (dark ? 'dark' : 'light')] || '#2E7D6B');
  let out;
  if (Math.max(a.s, b.s) < 0.12) {
    const s = dark ? 0.15 : 0.13;
    out = [_hsb2css(sk.h, s, dark ? 0.46 : 0.74), _hsb2css(sk.h, s + 0.05, dark ? 0.30 : 0.52)];
  } else {
    const hueA = _pull(a.h, sk.h, _gold(a.h) ? 0.04 : 0.11);
    const hueB = _pull(b.h, sk.h, _gold(b.h) ? 0.04 : 0.11);
    const give = _gold(a.h) ? 0.14 : 0;
    const hi = _clamp(a.s, dark ? 0.20 : 0.24, (dark ? 0.56 : 0.52) + give);
    const lo = _clamp(b.s, dark ? 0.26 : 0.30, (dark ? 0.66 : 0.60) + give);
    const top = _clamp(a.b, dark ? 0.42 : 0.62, (dark ? 0.70 : 0.88) + (give > 0 ? 0.04 : 0));
    out = [_hsb2css(hueA, hi, top),
           _hsb2css(hueB, lo, _clamp(b.b, dark ? 0.30 : 0.46, dark ? 0.56 : 0.70))];
  }
  _tintMemo.set(key, out);
  return out;
}

/* ══════════════════════════════════════════════════════════════════════
   描边宽度：BadgeLine 的 JS 移植
   ══════════════════════════════════════════════════════════════════════
   记号自己声明的宽度只保留两成八的差，其余往 2.0 上收（落在 1.86…2.16），
   再按 pow(size/33, 0.72) 跟着尺寸走——不是线性，小号那枚才不会细到发灰。 */
function sectorLineWeight(declared, size) {
  const band = Math.min(Math.max(2.0 + (declared - 2.0) * 0.28, 1.86), 2.16);
  return band * Math.pow(size / 33, 0.72);
}

/* 记号占比的光学修正：和 BadgeLine 一个道理——小尺寸下按比例缩会显得空，
   直径小于 20 时把记号放大最多一成，把仅有的几个像素全用在剪影上。
   （Swift 移植时这一步也要带上，否则 12px 那一档会比原型糊。）          */
function sectorInset(base, d) {
  const k = Math.min(Math.max((20 - d) / 8, 0), 1);
  return Math.min(base * (1 + 0.10 * k), 0.82);
}

/* ══════════════════════════════════════════════════════════════════════
   绘制
   ══════════════════════════════════════════════════════════════════════ */

const _pathMemo = new Map();
function _path2d(d) {
  let p = _pathMemo.get(d);
  if (!p) { p = new Path2D(d); _pathMemo.set(d, p); }
  return p;
}

/**
 * 把一枚板块图标画进 (cx, cy)，直径 d。
 * 底板是圆的（CoinBadge 那块圆角方块在球面里要改成圆），
 * 记号是白色实心／描边，落在 d * inset 的方框里。
 *
 * @param {CanvasRenderingContext2D} ctx
 * @param {string} sectorId
 * @param {number} cx  @param {number} cy  @param {number} d 直径
 * @param {'sage'|'terra'|'classic'} skin
 * @param {boolean} dark
 * @param {{shadow?:boolean}} [opt]
 */
function drawSectorIcon(ctx, sectorId, cx, cy, d, skin, dark, opt) {
  const ic = SECTOR_ICONS[sectorId];
  if (!ic) return;
  const [top, bottom] = sectorTint(ic.from, ic.to, skin, dark);
  const r = d / 2;

  ctx.save();

  // 底板：左上 → 右下的渐变圆盘，底下一点点影子让它离球面浮起来。
  if (!opt || opt.shadow !== false) {
    ctx.shadowColor = dark ? 'rgba(0,0,0,.45)' : 'rgba(0,0,0,.28)';
    ctx.shadowBlur = d * 0.17;
    ctx.shadowOffsetY = d * 0.08;
  }

<script>/* ══════════════════════════════════════════════════════════════════════════
   板块气泡页 ·「釉珠 · 环光」引擎
   ── 尺寸 = |涨跌幅|（半径 ∝ √|涨跌幅|，全视图一把尺子，带最小半径地板）
   ── 位置 = 强端在上 / 弱端在下，中间是陪衬球，陪衬球和主角一模一样地画
   ── 颜色 = 球身只说「在哪一头」，数字说正负，色彩的丰富度全在板块记号上
   ══════════════════════════════════════════════════════════════════════════ */
(() => {
'use strict';

/* ── 短名：球面上放得下的那一版 ─────────────────────────────────────── */
const SHORT = {
  'l1':'公链','ai':'AI','meme':'Meme','sol-eco':'Solana','defi-blue':'DeFi 蓝筹',
  'gamefi':'链游','l2':'Layer-2','depin':'DePIN','nft-social':'NFT','stable-yield':'稳定收益',
  'btc-eco':'BTC 生态','storage-data':'存储','zk':'ZK','rwa':'RWA','oracle-bridge':'预言机',
  'payment':'支付','perp-dex':'永续 DEX','pow':'PoW','privacy':'隐私','eth-eco':'ETH 生态',
  'metaverse':'元宇宙','meme-cn':'华语 Meme','fan-token':'粉丝代币','desci':'DeSci',
  'tag-infrastructure':'基础设施','tag-alpha':'币安 Alpha','tag-defi':'DeFi 其他','misc':'其他',
  'gpu':'算力芯片','mem':'存储','equip':'设备材料','optic':'光通信','hyper':'云厂商',
  'neo':'算力租赁','server':'服务器','edge':'端侧 AI','robot':'机器人','app':'模型应用'
};
const METRIC_NAME = { median:'中位数', mean:'均值', vw:'成交额加权' };

/* ── 状态 ───────────────────────────────────────────────────────────── */
const DEF = { crypto:{N:5,M:3}, us:{N:3,M:2} };
const S = {
  market:'crypto', metric:'median',
  N:DEF.crypto.N, M:DEF.crypto.M,
  rmax:62, rmin:18, pad:5, fill:60, split:46,
  rim:62, rimL:74, glow:52, depth:70, shadow:72, icon:40,
  amp:32, spd:60, members:false,
  skin:'sage', mode:'dark', redup:0,
};
const root = document.documentElement;

/* ── 小工具 ─────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

function fmtAmt(v){
  if(v==null||!isFinite(v)) return '—';
  const a=Math.abs(v);
  if(a>=1e12) return (v/1e12).toFixed(2)+'T';
  if(a>=1e9)  return (v/1e9 ).toFixed(2)+'B';
  if(a>=1e6)  return (v/1e6 ).toFixed(2)+'M';
  if(a>=1e3)  return (v/1e3 ).toFixed(2)+'K';
  return v.toFixed(2);
}
function fmtPct(v){ return (v>=0?'+':'') + v.toFixed(2) + '%'; }
function fmtPx(p){
  if(p==null||!isFinite(p)) return '—';
  const a=Math.abs(p);
  let d = a>=1000?2 : a>=100?2 : a>=1?4 : a>=0.01?5 : 7;
  let s = p.toFixed(d);
  if(a>=1000) s = Number(s).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return s;
}

/* HEX → HSL，球身的所有派生色都从皮肤的涨跌色现算，三套皮肤自动一致 */
function hex2hsl(hex){
  hex = hex.trim().replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16)/255, g=parseInt(hex.slice(2,4),16)/255, b=parseInt(hex.slice(4,6),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2; let h=0,s=0;
  if(mx!==mn){
    const d=mx-mn; s = l>.5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx===r ? (g-b)/d + (g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4;
    h*=60;
  }
  return [h, s*100, l*100];
}
const H = (c,h,s,l,a) => `hsla(${h.toFixed(1)},${clamp(s,0,100).toFixed(1)}%,${clamp(l,0,100).toFixed(1)}%,${a==null?1:a})`;

function cssv(n){ return getComputedStyle(root).getPropertyValue(n).trim(); }

/* ── 上场名单 ───────────────────────────────────────────────────────── */
function allSectors(){ return DATA.markets[S.market].levels['细分']; }
function ranked(){
  // 兜底桶在排名和归一之前就被摘出去，它们只活在「全部板块」里
  return allSectors().filter(s => !s.fallback).slice()
    .sort((a,b) => b[S.metric] - a[S.metric]);
}
function cast(){
  const r = ranked(), n = r.length;
  const N = Math.min(S.N, Math.floor(n/2)), M = Math.min(S.M, Math.max(0, n-2*N));
  const strong = r.slice(0, N).map((s,i)=>({s, side:'strong', k:i}));
  const weak   = r.slice(n-N).map((s,i)=>({s, side:'weak', k:i}));
  const midPool = r.slice(N, n-N);
  const fill = [];
  if(M>0 && midPool.length){
    // 中间那些只为构图，按等距抽，不含任何「热度/推荐」的意思
    for(let i=0;i<M;i++){
      const idx = clamp(Math.round((i+0.5)*midPool.length/M)-1, 0, midPool.length-1);
      fill.push({ s: midPool[idx], side:'mid', k:i, rk:N+idx });
    }
  }
  return { strong, weak, fill, total:n };
}

/* ── 版面：两极锚点 + 松弛 ──────────────────────────────────────────── */
const FIELD = { x0:13, x1:377, y0:134, y1:784 };
let BUB = [];      // 当前场上的球
let maxAbs = 1;

function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return ((h>>>0)%10000)/10000; }

function layout(){
  const c = cast();
  const list = [...c.strong, ...c.fill, ...c.weak];
  maxAbs = Math.max(1e-6, ...list.map(o=>Math.abs(o.s[S.metric])));

  // 半径：面积正比 |涨跌幅|，一把尺子，最小半径兜底
  const raw = list.map(o => Math.max(S.rmin, S.rmax*Math.sqrt(Math.abs(o.s[S.metric])/maxAbs)));
  const area = raw.reduce((a,r)=>a+Math.PI*r*r, 0);
  const fieldArea = (FIELD.x1-FIELD.x0)*(FIELD.y1-FIELD.y0);
  let k = Math.sqrt(fieldArea*(S.fill/100)/area);
  // 上限原来是 1.7，美股默认档（8 颗）算出来正好 1.71，把自适应静悄悄削掉了；
  // N 再往小拖（5 颗）能要到 2.0。放到 2.2，让「铺满度」这根滑杆在整个量程里说了算。
  k = clamp(k, .55, 2.2);

  const W = FIELD.x1-FIELD.x0, Hh = FIELD.y1-FIELD.y0;
  const sep = S.split/100;               // 两簇分离
  const yStrong = FIELD.y0 + Hh*lerp(.38,.20,sep);
  const yWeak   = FIELD.y0 + Hh*lerp(.62,.82,sep);
  const yMid    = (yStrong+yWeak)/2;
  $('#horizon').style.top = (yMid-110)+'px';

  BUB = list.map((o,i) => {
    const r = raw[i]*k;
    const hv = hash(o.s.id);
    const ay = o.side==='strong' ? yStrong : o.side==='weak' ? yWeak : yMid;
    // 主角按名次左右错开，陪衬散在中带，起手位置只是种子，之后交给松弛
    const t = o.side==='mid' ? 0.08 + 0.84*(o.k+ .5)/Math.max(1,c.fill.length)
                             : (o.k%2 ? .5+ .22*(o.k+1)/c.strong.length : .5- .26*(o.k+1)/c.strong.length);
    return {
      id:o.s.id, sec:o.s, side:o.side, rank:o.k, r,
      x: FIELD.x0 + clamp(t + (hv-.5)*.16, .09, .91)*W,
      y: ay + (hv-.5)*Hh*(o.side==='mid'? .16 : .10),
      ax: FIELD.x0 + clamp(t, .1, .9)*W, ay,
      ph: hv*Math.PI*2, ph2: hash(o.s.id+'b')*Math.PI*2,
      pct: o.s[S.metric], norm: Math.abs(o.s[S.metric])/maxAbs,
      up: o.side==='strong' ? true : o.side==='weak' ? false : (o.rk < c.total/2),
    };
  });

  relax(420);
}

function relax(iters){
  const pad = S.pad;
  for(let it=0; it<iters; it++){
    const cool = 1 - it/iters*0.35;
    for(let i=0;i<BUB.length;i++){
      const a=BUB[i];
      for(let j=i+1;j<BUB.length;j++){
        const b=BUB[j];
        let dx=b.x-a.x, dy=b.y-a.y;
        let d=Math.hypot(dx,dy) || .001;
        const min=a.r+b.r+pad;
        if(d<min){
          const push=(min-d)/2*0.92*cool;
          dx/=d; dy/=d;
          a.x-=dx*push; a.y-=dy*push; b.x+=dx*push; b.y+=dy*push;
        }
      }
    }
    for(const a of BUB){
      a.y += (a.ay-a.y)*(a.side==='mid'?0.055:0.038)*cool;                       // 回到自己那一头
      a.x += (a.ax-a.x)*0.012*cool;
      a.x = clamp(a.x, FIELD.x0+a.r, FIELD.x1-a.r);
      a.y = clamp(a.y, FIELD.y0+a.r, FIELD.y1-a.r);
    }
  }
  for(const a of BUB){ a.bx=a.x; a.by=a.y; }
}

/* ── 釉珠：一颗烧过的球 ─────────────────────────────────────────────── */
function palette(){
  const dark = S.mode==='dark';
  const g = cssv('--green'), rd = cssv('--red');
  const riseHex = S.redup? rd : g, fallHex = S.redup? g : rd;
  return { rise:hex2hsl(riseHex), fall:hex2hsl(fallHex), dark };
}

function drawBubble(ctx, b, t, alpha){
  const P = palette(), dark = P.dark;
  const [h, s0] = b.up ? P.rise : P.fall;
  const s = clamp(s0*1.02, 30, 92);
  // 同样的饱和度，红在低明度下比青绿显色得多。球胎的着色按色相压一下，
  // 两头才读成同一种黑釉，而不是「黑珠 vs 酱色珠」。
  const hr = ((h%360)+360)%360;
  const warm = Math.max(0, Math.cos((hr-8)*Math.PI/180));
  const bK = 1 - 0.36*warm;
  const r = b.r, cx = b.x, cy = b.y;
  const n = b.norm;                                   // 0..1，越大越亮越厚
  const depth = S.depth/100, shadowK = S.shadow/100;
  const rimW  = r*(0.028 + S.rim/100*0.060) * (0.78+0.34*n);
  const rimL  = S.rimL/100;
  const sheen = t*0.00013*(S.spd/60||1);              // 极慢的环光游走

  ctx.save();
  ctx.globalAlpha = alpha==null?1:alpha;

  /* 1 · 接触投影：球坐在这块材料上 */
  // 浅色底上没有辉光可以借力，球全靠这道影子坐下去：更沉、更紧、并且
  // 顺着光（左上进来）往右下偏一点，方向感是立体感的一半。
  ctx.save();
  ctx.translate(cx + (dark?0:r*0.07), cy + r*(dark?0.30:0.34));
  ctx.scale(1, dark?0.34:0.30);
  const shR = r*(dark?1.12:1.04);
  const sh = ctx.createRadialGradient(0,0,r*0.15, 0,0,shR);
  const sa = (dark? 0.52 : 0.50)*shadowK*(0.7+0.3*n);
  sh.addColorStop(0, `rgba(0,0,0,${sa})`);
  sh.addColorStop(0.55, `rgba(0,0,0,${sa*(dark?0.42:0.50)})`);
  sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.beginPath(); ctx.arc(0,0,shR,0,7); ctx.fill();
  ctx.restore();

  /* 2 · 外溢辉光：只在深色皮肤里存在，半径硬封顶，紧贴球缘 */
  if(dark && S.glow>0){
    const cap = r*(1 + 0.05 + S.glow/100*0.16);
    const gl = ctx.createRadialGradient(cx,cy,r*0.94, cx,cy,cap);
    const ga = S.glow/100*0.40*(0.45+0.55*n);
    gl.addColorStop(0, H(0,h,s,58,ga));
    gl.addColorStop(0.45, H(0,h,s,54,ga*0.38));
    gl.addColorStop(1, H(0,h,s,50,0));
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(cx,cy,cap,0,7); ctx.fill();
  }

  /* 3 · 釉身 */
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.clip();
  let body;
  if(dark){
    // 近黑的深釉：光从左上进来，只把中心稍稍抬亮一点点
    body = ctx.createRadialGradient(cx-r*0.30, cy-r*0.36, r*0.05, cx, cy, r*1.04);
    body.addColorStop(0,   H(0,h,s*0.52*bK, lerp(9,17,depth)*(0.8+0.4*n), 1));
    body.addColorStop(0.52,H(0,h,s*0.46*bK, lerp(6,11,depth), 1));
    body.addColorStop(1,   H(0,h,s*0.40*bK, lerp(3.5,6,depth), 1));
  }else{
    // 浅色皮肤里同一颗珠：深釉的胎，不自发光，靠环光和落影立在浅底上
    body = ctx.createRadialGradient(cx-r*0.32, cy-r*0.38, r*0.05, cx, cy, r*1.05);
    body.addColorStop(0,   H(0,h,s*0.58*bK, lerp(19,26,depth)*(0.85+0.3*n), 1));
    body.addColorStop(0.52,H(0,h,s*0.52*bK, lerp(13,18,depth), 1));
    body.addColorStop(1,   H(0,h,s*0.46*bK, lerp(8,12,depth), 1));
  }
  ctx.fillStyle = body;
  ctx.fillRect(cx-r, cy-r, r*2, r*2);

  /* 3b · 环境反射带：上三分之一一道很宽很淡的横向反光，低对比 */
  ctx.save();
  ctx.translate(cx, cy - r*0.44);
  ctx.scale(1, 0.30);
  const env = ctx.createRadialGradient(0,0,0, 0,0,r*0.95);
  env.addColorStop(0, `rgba(255,255,255,${dark?0.085:0.095})`);
  env.addColorStop(0.6, `rgba(255,255,255,${dark?0.030:0.05})`);
  env.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = env;
  ctx.beginPath(); ctx.arc(0,0,r*0.95,0,7); ctx.fill();
  ctx.restore();

  /* 3c · 底部回弹：环境从下方补一点点冷光，球才不是贴纸 */
  ctx.save();
  ctx.translate(cx, cy + r*0.62);
  ctx.scale(1, 0.26);
  const bl = ctx.createRadialGradient(0,0,0, 0,0,r*0.7);
  bl.addColorStop(0, H(0,h,s,dark?46:52, dark?0.16:0.18));
  bl.addColorStop(1, H(0,h,s,dark?46:52, 0));
  ctx.fillStyle = bl;
  ctx.beginPath(); ctx.arc(0,0,r*0.7,0,7); ctx.fill();
  ctx.restore();

  /* 3c2 · 明暗交界：光从左上来，右下那半要沉下去。浅色档没有自发光可用，
     立体全靠这一道方向性的暗面，而不是在球面中上部点一块亮椭圆。 */
  {
    const tg = ctx.createRadialGradient(cx-r*0.46, cy-r*0.52, r*0.10, cx+r*0.30, cy+r*0.34, r*1.34);
    const ta = dark? 0.26 : 0.46;
    tg.addColorStop(0,    'rgba(0,0,0,0)');
    tg.addColorStop(0.52, `rgba(0,0,0,${ta*0.26})`);
    tg.addColorStop(1,    `rgba(0,0,0,${ta})`);
    ctx.fillStyle = tg;
    ctx.fillRect(cx-r, cy-r, r*2, r*2);
  }

  /* 3d · 积釉：靠边一圈比球心更沉，环光才有可以坐的槽 */
  const pool = ctx.createRadialGradient(cx,cy,r*(1-rimW/r*3.4), cx,cy,r);
  pool.addColorStop(0, 'rgba(0,0,0,0)');
  pool.addColorStop(1, dark? 'rgba(0,0,0,.62)' : 'rgba(0,0,0,.55)');
  ctx.fillStyle = pool;
  ctx.fillRect(cx-r, cy-r, r*2, r*2);
  ctx.restore();

  /* 4 · 环光：一条随方位变亮的高光带，左上最亮，右下有一处弱回弹 */
  const rr = r - rimW/2 - 0.4;
  const peak = -2.36 + Math.sin(t*0.00021 + b.ph)*0.10 + sheen;
  const hi = dark ? lerp(50,78,rimL)*(0.70+0.40*n) : lerp(48,68,rimL)*(0.76+0.32*n);
  const lo = dark ? lerp(7,13,rimL)*(0.55+0.55*n)  : lerp(11,18,rimL)*(0.6+0.5*n);
  const sat= dark ? clamp(s*1.05,0,95) : clamp(s*1.0,0,92);
  ctx.lineWidth = rimW;
  if(ctx.createConicGradient){
    const cg = ctx.createConicGradient(peak, cx, cy);
    cg.addColorStop(0.00, H(0,h,sat*0.9, hi));
    cg.addColorStop(0.07, H(0,h,sat,     hi*0.82));
    cg.addColorStop(0.22, H(0,h,sat,     lerp(lo,hi,0.30)));
    cg.addColorStop(0.42, H(0,h,sat,     lo));
    cg.addColorStop(0.58, H(0,h,sat,     lerp(lo,hi,0.38)));   // 右下回弹
    cg.addColorStop(0.72, H(0,h,sat,     lo*1.05));
    cg.addColorStop(0.90, H(0,h,sat,     lerp(lo,hi,0.55)));
    cg.addColorStop(1.00, H(0,h,sat*0.9, hi));
    ctx.strokeStyle = cg;
    ctx.beginPath(); ctx.arc(cx,cy,rr,0,7); ctx.stroke();
  }else{
    const seg=72;
    for(let i=0;i<seg;i++){
      const a0=peak+i/seg*Math.PI*2, a1=peak+(i+1.6)/seg*Math.PI*2;
      const u=i/seg;
      const l = u<0.07? lerp(hi,hi*0.82,u/0.07)
              : u<0.45? lerp(hi*0.82,lo,(u-0.07)/0.38)
              : u<0.58? lerp(lo,lerp(lo,hi,0.38),(u-0.45)/0.13)
              : u<0.9 ? lerp(lerp(lo,hi,0.38),lerp(lo,hi,0.55),(u-0.58)/0.32)
              : lerp(lerp(lo,hi,0.55),hi,(u-0.9)/0.1);
      ctx.strokeStyle = H(0,h,sat,l);
      ctx.beginPath(); ctx.arc(cx,cy,rr,a0,a1); ctx.stroke();
    }
  }

  /* 4b · 内缘镜面丝：釉面被点亮的那一道，只在迎光的一侧 */
  ctx.lineWidth = Math.max(0.6, rimW*0.20);
  ctx.strokeStyle = `rgba(255,255,255,${(dark?0.22:0.20)*rimL*(0.45+0.55*n)})`;
  ctx.beginPath(); ctx.arc(cx,cy,rr-rimW*0.28, peak-0.70, peak+0.62); ctx.stroke();

  /* 5 · 最外一圈暗轮廓：任何皮肤下球都有明确的边 */
  ctx.lineWidth = Math.max(0.6, r*0.012);
  ctx.strokeStyle = dark ? 'rgba(0,0,0,.55)' : 'rgba(0,0,0,.40)';
  ctx.beginPath(); ctx.arc(cx,cy,r-0.2,0,7); ctx.stroke();

  /* 6 · 板块记号 + 文字 */
  const d = r*2;
  const iconD = d*(S.icon/100);
  ctx.textAlign='center'; ctx.textBaseline='middle';

  // 文字必须整个落在釉面以内。球是圆的，越靠近上下两极可用宽度收得越快，
  // 所以不能只拿半径当阈值——量出字宽，跟那个高度上的弦长比，塞不下就不画。
  // 小球只留记号是对的，硬把标签甩到圈外看起来就是坏了。
  const safe = Math.max(0, r - rimW*1.15 - 2);
  const fits = (w, dy, hh) => Math.hypot(w*0.5 + 1, Math.abs(dy) + hh) <= safe;

  const label  = SHORT[b.id] || b.sec.name;
  const pctTxt = fmtPct(b.pct);
  const nameFont = fs => `500 ${fs}px -apple-system,"PingFang SC",sans-serif`;
  const pctFont  = fs => `600 ${fs}px -apple-system,"SF Pro Display",sans-serif`;

  // 三档降级：记号 + 名称 + 涨跌幅 → 记号 + 涨跌幅 → 只剩记号
  let showName = false, showPct = false;
  let nameFs = 0, pctFs = 0, nameDY = 0, pctDY = 0;

  if(r >= 30){
    nameFs = clamp(r*0.235, 9.5, 14.5);
    ctx.font = nameFont(nameFs);
    while(ctx.measureText(label).width > d*0.78 && nameFs > 9.5){
      nameFs -= .5; ctx.font = nameFont(nameFs);
    }
    const nw = ctx.measureText(label).width;
    const pf = clamp(r*0.245, 10, 16);
    ctx.font = pctFont(pf);
    const pw = ctx.measureText(pctTxt).width;
    const ny = r*0.20, py = ny + pf*1.12;
    if(fits(nw, ny, nameFs*0.55) && fits(pw, py, pf*0.55)){
      showName = true; showPct = true; pctFs = pf; nameDY = ny; pctDY = py;
    }
  }
  if(!showName){
    pctFs = clamp(r*0.30, 9.5, 16);
    pctDY = r*0.30;
    ctx.font = pctFont(pctFs);
    while(!fits(ctx.measureText(pctTxt).width, pctDY, pctFs*0.55) && pctFs > 9.5){
      pctFs -= .5; ctx.font = pctFont(pctFs);
    }
    showPct = fits(ctx.measureText(pctTxt).width, pctDY, pctFs*0.55);
  }

  const iconY = showName ? cy - r*0.30 : (showPct ? cy - r*0.24 : cy);
  drawSectorIcon(ctx, b.id, cx, iconY, iconD, S.skin, true, {shadow:true});

  if(showName){
    ctx.font = nameFont(nameFs);
    ctx.fillStyle = dark? 'rgba(255,255,255,.94)' : 'rgba(255,255,255,.97)';
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = .5;
    ctx.fillText(label, cx, cy + nameDY);
    ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  }
  if(showPct){
    // 数字按正负着色，和球在哪一头无关
    const pos = b.pct>=0;
    const [ph2, ps2] = pos ? P.rise : P.fall;   // palette() 已经处理过红涨绿跌
    ctx.font = pctFont(pctFs);
    ctx.fillStyle = H(0,ph2,clamp(ps2*1.1,0,95), dark?76:70);
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 3;
    ctx.fillText(pctTxt, cx, cy + pctDY);
    ctx.shadowColor='transparent'; ctx.shadowBlur=0;
    if(S.members && showName){
      const mf = clamp(r*0.17, 8, 10.5), my = pctDY + pctFs*1.05;
      ctx.font = `400 ${mf}px -apple-system,sans-serif`;
      const mw = ctx.measureText(b.sec.n+' 个').width;
      if(fits(mw, my, mf*0.55)){
        ctx.fillStyle = 'rgba(255,255,255,.62)';
        ctx.fillText(b.sec.n+' 个', cx, cy + my);
      }
    }
  }
  ctx.restore();
}

/* ── 画布主循环 ─────────────────────────────────────────────────────── */
const cv = $('#field'), ctx = cv.getContext('2d');
let DPR = Math.min(3, window.devicePixelRatio||1);
function fitCanvas(){
  cv.width = 390*DPR; cv.height = 844*DPR;
  cv.style.width='390px'; cv.style.height='844px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
fitCanvas();

let fly = null;      // {b, from:{x,y,r}, to:{x,y,r}, dir:1|-1, t0}
let fieldAlpha = 1;

function frame(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,390,844);
  // 上层页面盖住时不画气泡场，省一份电
  if(!fly && document.querySelector('#list.on,#quote.on,#sheet.on')){ requestAnimationFrame(frame); return; }
  const A = S.amp/100*7, W = (S.spd/100)*0.00055 + 0.00006;

  let flyP = 0;
  if(fly){
    flyP = clamp((t-fly.t0)/360, 0, 1);
    if(flyP>=1){
      if(fly.dir===1){ enterList(fly.b); }
      fly = null;
    }
  }

  // 画：大球先画、小球后画，小球压在大球边上更像堆在一起
  const order = BUB.slice().sort((a,b)=>b.r-a.r);
  for(const b of order){
    const breathe = 1 + Math.sin(t*W*1.7 + b.ph)*0.012*(S.amp/100);
    b.x = b.bx + Math.sin(t*W + b.ph)*A;
    b.y = b.by + Math.cos(t*W*0.83 + b.ph2)*A*0.8;
    const rr = b.r; b.r = rr*breathe;

    let alpha = fieldAlpha;
    if(fly){
      const p = ease(fly.dir===1? flyP : 1-flyP);
      if(b===fly.b){
        const sx=b.x, sy=b.y, sr=b.r;
        b.x = lerp(sx, fly.to.x, p); b.y = lerp(sy, fly.to.y, p); b.r = lerp(sr, fly.to.r, p);
        drawBubble(ctx, b, t, 1);
        b.x=sx; b.y=sy; b.r=rr;
        continue;
      }
      alpha = 1-p;
    }
    if(alpha>0.01) drawBubble(ctx, b, t, alpha);
    b.r = rr;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ── 顶栏 / 统计 ────────────────────────────────────────────────────── */
function paintHeader(){
  const all = allSectors(), r = ranked();
  const on = Math.min(S.N, Math.floor(r.length/2))*2 + Math.min(S.M, Math.max(0, r.length-2*Math.min(S.N,Math.floor(r.length/2))));
  const syms = all.reduce((a,s)=>a+s.n, 0);
  $('#count').textContent = `${on} / ${all.length} 板块 · ${syms} 品种`;
  $('#ttl').textContent = '板块';
}

function rebuild(){ layout(); paintHeader(); buildSheet(); }

/* ── 命中测试 ───────────────────────────────────────────────────────── */
cv.addEventListener('click', e => {
  if(fly) return;
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX-rect.left)*390/rect.width, y = (e.clientY-rect.top)*844/rect.height;
  let hit=null, best=1e9;
  for(const b of BUB){
    const d = Math.hypot(b.x-x, b.y-y);
    if(d<=b.r && d<best){ best=d; hit=b; }
  }
  if(hit) startFly(hit);
});

function startFly(b){
  fly = { b, to:{x:20+30+11+19, y:56+19, r:19}, dir:1, t0:performance.now() };
}

/* ── 第二层：品种列表 ───────────────────────────────────────────────── */
let curSec=null, sortKey='chg';
function enterList(b){
  curSec = b.sec;
  const dark = S.mode==='dark';
  const mc = $('#medal'), mx = mc.getContext('2d');
  mc.width=38*DPR; mc.height=38*DPR; mc.style.width='38px'; mc.style.height='38px';
  mx.setTransform(DPR,0,0,DPR,0,0); mx.clearRect(0,0,38,38);
  drawSectorIcon(mx, b.id, 19, 19, 38, S.skin, dark, {shadow:false});

  $('#lname').textContent = curSec.name;
  $('#lmeta').textContent = `${curSec.n} 个品种 · 成交额 ${fmtAmt(curSec.vol)}`;
  $('#lpctv').textContent = fmtPct(curSec[S.metric]);
  $('#lpctv').style.color = `var(--${curSec[S.metric]>=0?'rise':'fall'})`;
  $('#lpctk').textContent = METRIC_NAME[S.metric];
  paintRows();
  const L = $('#list'); L.classList.add('on'); requestAnimationFrame(()=>L.classList.add('in'));
}
function paintRows(){
  const ms = curSec.members.slice().sort((a,b)=> sortKey==='chg' ? b.chg-a.chg : b.vol-a.vol);
  $('#lcount').textContent = `${ms.length} 个`;
  $('#rows').innerHTML = ms.map((m,i)=>`
    <div class="row" data-i="${i}">
      <div class="nm">
        <div class="n1">${m.name||m.base}</div>
        <div class="n2">${m.base} · ${fmtAmt(m.vol)}</div>
      </div>
      <div class="rt">
        <div class="px">${fmtPx(m.price)}</div>
        <div class="pill ${m.chg>=0?'up':'dn'}">${fmtPct(m.chg)}</div>
      </div>
    </div>`).join('');
  [...$('#rows').children].forEach((el,i)=>{
    el.style.opacity=0; el.style.transform='translateY(7px)';
    el.style.transition=`opacity .3s ease ${Math.min(i,14)*22}ms, transform .3s cubic-bezier(.22,1,.36,1) ${Math.min(i,14)*22}ms`;
    requestAnimationFrame(()=>{ el.style.opacity=1; el.style.transform='none'; });
    el.onclick = () => openQuote(ms[i]);
  });
}
$('#lback').onclick = () => {
  const L=$('#list'); L.classList.remove('in');
  setTimeout(()=>L.classList.remove('on'), 280);
  const b = BUB.find(x=>x.sec===curSec);
  if(b) fly = { b, to:{x:20+30+11+19,y:56+19,r:19}, dir:-1, t0:performance.now() };
};
$('.lsort').addEventListener('click', e=>{
  const btn=e.target.closest('[data-s]'); if(!btn) return;
  sortKey=btn.dataset.s;
  [...$('.lsort').querySelectorAll('[data-s]')].forEach(x=>x.setAttribute('aria-selected', x===btn));
  paintRows();
});

/* ── 第三层：行情页占位 ─────────────────────────────────────────────── */
function openQuote(m){
  $('#qname').textContent = m.name||m.base;
  $('#qsym').textContent = m.sym;
  $('#qpx').textContent = fmtPx(m.price);
  $('#qpx').style.color = `var(--${m.chg>=0?'rise':'fall'})`;
  $('#qchg').textContent = fmtPct(m.chg);
  $('#qchg').style.color = `var(--${m.chg>=0?'rise':'fall'})`;
  $('#qvol').textContent = fmtAmt(m.vol);
  $('#qoi').textContent  = fmtAmt(m.vol*0.17);
  $('#qmc').textContent  = fmtAmt(m.vol*3.4);
  $('#qfr').textContent  = ((hash(m.sym)-0.5)*0.12).toFixed(4)+'%';
  const Q=$('#quote'); Q.classList.add('on'); requestAnimationFrame(()=>Q.classList.add('in'));
  requestAnimationFrame(()=>drawQuote(m));
}
$('#qback').onclick=()=>{ const Q=$('#quote'); Q.classList.remove('in'); setTimeout(()=>Q.classList.remove('on'),260); };

function drawQuote(m){
  const c=$('#qchart'), x=c.getContext('2d');
  const w=c.clientWidth, h=c.clientHeight;
  c.width=w*DPR; c.height=h*DPR; x.setTransform(DPR,0,0,DPR,0,0);
  x.clearRect(0,0,w,h);
  const dark=S.mode==='dark';
  x.fillStyle = dark? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.025)';
  roundRect(x,0,0,w,h,16); x.fill();

  // 占位 K 线：由代号派生的固定随机游走，只是给行情页留位
  let seed = Math.floor(hash(m.sym)*1e6)+7;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const n=64, out=[]; let p=m.price/(1+m.chg/100);
  for(let i=0;i<n;i++){
    const o=p, ch=(rnd()-0.5)*p*0.022 + (m.price-p)/(n-i)*1.0;
    p=Math.max(p*0.5, o+ch);
    out.push({o, c:p, h:Math.max(o,p)*(1+rnd()*0.006), l:Math.min(o,p)*(1-rnd()*0.006)});
  }
  const hi=Math.max(...out.map(k=>k.h)), lo=Math.min(...out.map(k=>k.l));
  const pt=14, pb=26, cw=(w-24)/n;
  const Y=v=>pt+(hi-v)/(hi-lo||1)*(h-pt-pb);
  x.strokeStyle = dark? 'rgba(255,255,255,.05)':'rgba(0,0,0,.05)'; x.lineWidth=1;
  for(let i=1;i<4;i++){ const yy=pt+(h-pt-pb)*i/4; x.beginPath(); x.moveTo(12,yy); x.lineTo(w-12,yy); x.stroke(); }
  const rise=cssv(S.redup?'--red':'--green'), fall=cssv(S.redup?'--green':'--red');
  out.forEach((k,i)=>{
    const cx0=12+cw*(i+.5), up=k.c>=k.o;
    x.strokeStyle=x.fillStyle= up?rise:fall; x.lineWidth=1;
    x.beginPath(); x.moveTo(cx0,Y(k.h)); x.lineTo(cx0,Y(k.l)); x.stroke();
    const y0=Y(Math.max(k.o,k.c)), y1=Y(Math.min(k.o,k.c));
    x.fillRect(cx0-cw*0.32, y0, cw*0.64, Math.max(1,y1-y0));
  });
  x.fillStyle = dark? 'rgba(255,255,255,.28)':'rgba(0,0,0,.28)';
  x.font='10px -apple-system,sans-serif'; x.textAlign='center';
  x.fillText('行情页（此原型只到这一层）', w/2, h-9);
}
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }

/* ── 「…」→ 全部板块 ───────────────────────────────────────────────── */
function buildSheet(){
  const list = allSectors().slice().sort((a,b)=>b[S.metric]-a[S.metric]);
  const fams = {};
  for(const s of list){
    const f = (SECTOR_ICONS[s.id]||{}).fam || 'bucket';
    (fams[f]=fams[f]||[]).push(s);
  }
  let html='';
  for(const [fid, arr] of Object.entries(fams)){
    const fam = SECTOR_FAMILIES[fid]||{name:'其他'};
    html += `<div class="sgroup">${fam.name}</div>`;
    for(const s of arr){
      html += `<div class="srow" data-id="${s.id}">
        <canvas data-ic="${s.id}"></canvas>
        <div><div class="sn">${s.name}</div><div class="sm">${s.n} 个品种 · ${fmtAmt(s.vol)}</div></div>
        <div class="sp" style="color:var(--${s[S.metric]>=0?'rise':'fall'})">${fmtPct(s[S.metric])}</div>
      </div>`;
    }
  }
  const g=$('#sgrid'); g.innerHTML=html;
  g.querySelectorAll('canvas[data-ic]').forEach(c=>{
    c.width=26*DPR; c.height=26*DPR; c.style.width='26px'; c.style.height='26px';
    const k=c.getContext('2d'); k.setTransform(DPR,0,0,DPR,0,0);
    drawSectorIcon(k, c.dataset.ic, 13, 13, 26, S.skin, S.mode==='dark', {shadow:false});
  });
  g.querySelectorAll('.srow').forEach(rw=>{
    rw.onclick=()=>{
      const sec = allSectors().find(s=>s.id===rw.dataset.id);
      const SH=$('#sheet'); SH.classList.remove('in'); setTimeout(()=>SH.classList.remove('on'),240);
      enterList({ sec, id:sec.id });
    };
  });
}
$('#moreBtn').onclick=()=>{ const SH=$('#sheet'); SH.classList.add('on'); requestAnimationFrame(()=>SH.classList.add('in')); };
$('#sback').onclick=()=>{ const SH=$('#sheet'); SH.classList.remove('in'); setTimeout(()=>SH.classList.remove('on'),240); };

/* ── 顶栏切换 ───────────────────────────────────────────────────────── */
$('#mkt').addEventListener('click', e=>{
  const b=e.target.closest('[data-m]'); if(!b) return;
  [...$('#mkt').children].forEach(x=>x.setAttribute('aria-selected', x===b));
  S.market=b.dataset.m; S.N=DEF[S.market].N; S.M=DEF[S.market].M;
  syncSliders(); rebuild();
});
$('#brow').addEventListener('click', e=>{
  const b=e.target.closest('[data-k]'); if(!b) return;
  [...$('#brow').querySelectorAll('[data-k]')].forEach(x=>x.setAttribute('aria-selected', x===b));
  S.metric=b.dataset.k; rebuild();
});
$('#tabs').addEventListener('click', e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  [...$('#tabs').children].forEach(x=>x.setAttribute('aria-selected', x===b));
});

/* ── 调试抽屉 ───────────────────────────────────────────────────────── */
function seg(id, key, cb){
  $(id).addEventListener('click', e=>{
    const b=e.target.closest('[data-v]'); if(!b) return;
    [...$(id).children].forEach(x=>x.setAttribute('aria-selected', x===b));
    cb(b.dataset.v);
  });
}
seg('#dSkin','skin',v=>{ S.skin=v; root.dataset.skin=v; rebuild(); refreshIcons(); });
seg('#dMode','mode',v=>{ S.mode=v; root.dataset.mode=v; rebuild(); refreshIcons(); });
seg('#dRedup','redup',v=>{ S.redup=+v; root.dataset.redup=v; if(curSec) paintRows(); });

const SLIDERS = [
  ['#sN','#oN','N',v=>v], ['#sM','#oM','M',v=>v],
  ['#sRmax','#oRmax','rmax',v=>v], ['#sRmin','#oRmin','rmin',v=>v],
  ['#sPad','#oPad','pad',v=>v], ['#sFill','#oFill','fill',v=>v+'%'], ['#sSplit','#oSplit','split',v=>v],
  ['#sRim','#oRim','rim',v=>v], ['#sRimL','#oRimL','rimL',v=>v], ['#sGlow','#oGlow','glow',v=>v],
  ['#sDepth','#oDepth','depth',v=>v], ['#sShadow','#oShadow','shadow',v=>v], ['#sIcon','#oIcon','icon',v=>v+'%'],
  ['#sAmp','#oAmp','amp',v=>v], ['#sSpd','#oSpd','spd',v=>v],
];
const RELAYOUT = new Set(['N','M','rmax','rmin','pad','fill','split']);
for(const [sel,out,key,fmt] of SLIDERS){
  const el=$(sel);
  el.addEventListener('input', ()=>{
    S[key]=+el.value; $(out).textContent=fmt(el.value);
    if(RELAYOUT.has(key)){ layout(); paintHeader(); }
  });
}
function syncSliders(){
  for(const [sel,out,key,fmt] of SLIDERS){ $(sel).value=S[key]; $(out).textContent=fmt(String(S[key])); }
}
$('#sMembers').onchange=e=>{ S.members=e.target.checked; };
$('#sSolo').onchange=e=>{ document.body.dataset.solo = e.target.checked?'1':'0'; };
$('#handle').onclick=()=>{ const c=$('#sSolo'); c.checked=!c.checked; c.onchange({target:c}); };

function refreshIcons(){
  buildSheet();
  if(curSec){
    const mc=$('#medal'), mx=mc.getContext('2d');
    mx.setTransform(DPR,0,0,DPR,0,0); mx.clearRect(0,0,38,38);
    drawSectorIcon(mx, curSec.id, 19,19,38, S.skin, S.mode==='dark', {shadow:false});
  }
}

/* ── 起手 ───────────────────────────────────────────────────────────── */
root.dataset.skin=S.skin; root.dataset.mode=S.mode; root.dataset.redup=S.redup;
syncSliders();
rebuild();
})();
</script>
</body>
</html>
