<!doctype html>
<html lang="zh-CN" data-skin="sage" data-mode="light" data-updir="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看盘 · 陶土 / 青苔 新原型 2026-09-17</title>
<style>
/* ───────────────────────── tokens ───────────────────────── */
:root{
  --rChip:11px; --rBtn:14px; --rCard:18px; --rSheet:28px; --rDock:26px; --rBadge:9px;
  --ma1:#E4A83C; --ma2:#4E8FE6; --ma3:#B26BDD; --ma4:#3FB8A9;
  --fs:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
}
/* 陶土 TERRA · 暖（色值沿用 Opus 原型 完整原型-2026-09-16.html 的 TERRA） */
[data-skin=terra][data-mode=light]{
  --bg:#FBF6F0; --card:#FFFFFF; --surf:color-mix(in srgb,#FFFFFF 50%,#F2E8DE); --tint:#F2E8DE; --tint2:#E7DACB;
  --ink1:#241A13; --ink2:#6E5C4D; --ink3:#A5907E; --onInk:#FBF6F0;
  --acc:#C4603A; --accBg:linear-gradient(135deg,#CE6A3E,#E5975C); --onAcc:#FFFFFF; --accSoft:rgba(196,96,58,.12);
  --up:#2F7D62; --dn:#C4483C; --warn:#C08428; --danger:#C4483C;
  --rule:rgba(70,45,28,.11); --rule2:rgba(70,45,28,.18); --glow:rgba(206,106,62,.16);
  --shadow:0 10px 26px -20px rgba(40,30,20,.45); --shadow2:0 2px 10px -4px rgba(40,30,20,.18);
  --glass:rgba(255,251,246,.9);
}
[data-skin=terra][data-mode=dark]{
  --bg:#16100C; --card:#211812; --surf:color-mix(in srgb,#211812 50%,#2A1F17); --tint:#2A1F17; --tint2:#37281D;
  --ink1:#F7EFE6; --ink2:#C2AC98; --ink3:#8A7969; --onInk:#16100C;
  --acc:#E2874F; --accBg:linear-gradient(135deg,#D97440,#F0A468); --onAcc:#1B120B; --accSoft:rgba(226,135,79,.16);
  --up:#3FA783; --dn:#E0584A; --warn:#E0A544; --danger:#E0584A;
  --rule:rgba(255,230,205,.1); --rule2:rgba(255,230,205,.16); --glow:rgba(226,135,79,.16);
  --shadow:0 10px 26px -20px rgba(0,0,0,.8); --shadow2:0 2px 10px -4px rgba(0,0,0,.5);
  --glass:rgba(30,22,16,.87);
}
/* 青苔 SAGE · 冷（色值沿用 Opus 原型的 SAGE） */
[data-skin=sage][data-mode=light]{
  --bg:#F3F7F4; --card:#FFFFFF; --surf:color-mix(in srgb,#FFFFFF 50%,#E7EFE9); --tint:#E7EFE9; --tint2:#D6E3DA;
  --ink1:#14211B; --ink2:#4E6158; --ink3:#869A8F; --onInk:#F3F7F4;
  --acc:#2E7D6B; --accBg:linear-gradient(135deg,#2E7D6B,#55A891); --onAcc:#FFFFFF; --accSoft:rgba(46,125,107,.12);
  --up:#2E7D6B; --dn:#CF4A46; --warn:#C98A2C; --danger:#CF4A46;
  --rule:rgba(20,60,45,.11); --rule2:rgba(20,60,45,.18); --glow:rgba(46,125,107,.22);
  --shadow:0 10px 26px -20px rgba(20,40,30,.45); --shadow2:0 2px 10px -4px rgba(20,40,30,.18);
  --glass:rgba(250,253,251,.9);
}
[data-skin=sage][data-mode=dark]{
  --bg:#0B120F; --card:#131C18; --surf:color-mix(in srgb,#131C18 50%,#1A241F); --tint:#1A241F; --tint2:#25332C;
  --ink1:#E9F2EC; --ink2:#A5B8AE; --ink3:#6E8279; --onInk:#0B120F;
  --acc:#4FB69C; --accBg:linear-gradient(135deg,#2E8E77,#63CDB1); --onAcc:#07120E; --accSoft:rgba(79,182,156,.16);
  --up:#4FB69C; --dn:#E36159; --warn:#E0A544; --danger:#E36159;
  --rule:rgba(190,230,215,.11); --rule2:rgba(190,230,215,.18); --glow:rgba(79,182,156,.2);
  --shadow:0 10px 26px -20px rgba(0,0,0,.8); --shadow2:0 2px 10px -4px rgba(0,0,0,.5);
  --glass:rgba(17,25,21,.88);
}
/* 涨跌方向：红涨绿跌时互换 */
[data-updir=green]{ --cUp:var(--up); --cDn:var(--dn); }
[data-updir=red]{ --cUp:var(--dn); --cDn:var(--up); }

.mtab.basis td{vertical-align:top;font-size:12px;line-height:1.55;padding:9px 10px}.mtab.basis td:nth-child(3){font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink2)}
/* ───────────────────────── page chrome ───────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink1);font:14px/1.5 var(--fs);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
body{padding:0 0 120px;transition:background .25s}
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 22px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--rule)}
.bar h1{font-size:15px;font-weight:700;letter-spacing:.02em;margin-right:6px}
.bar h1 small{font-weight:500;color:var(--ink3);margin-left:8px;font-size:12px}
.seg{display:inline-flex;background:var(--surf);border:1px solid var(--rule);border-radius:12px;padding:3px;gap:2px}
.seg button{font:600 12px/1 var(--fs);color:var(--ink2);border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button i{width:10px;height:10px;border-radius:50%;display:inline-block}
.seg button.on{background:var(--ink1);color:var(--onInk)}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav a{font:500 12px/1 var(--fs);color:var(--ink2);text-decoration:none;padding:7px 10px;border-radius:9px}
.nav a:hover{background:var(--tint)}
main{max-width:1500px;margin:0 auto;padding:26px 22px}
section{margin-top:44px}
section h2{font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:12px}
section h2 .k{font:600 11px/1 var(--fs);letter-spacing:.24em;color:var(--acc);text-transform:uppercase}
section p.lead{color:var(--ink2);margin-top:8px;max-width:820px;font-size:13.5px;line-height:1.7}
.row{display:flex;flex-wrap:wrap;gap:34px 30px;margin-top:22px;align-items:flex-start}
.shot{display:flex;flex-direction:column;gap:12px}
.cap{max-width:402px;color:var(--ink2);font-size:12.5px;line-height:1.65}
.cap b{color:var(--ink1);font-weight:600;display:block;margin-bottom:2px;font-size:13px}
.cap.wide{max-width:874px}

/* ───────────────────────── phone ───────────────────────── */
.ph{width:402px;height:874px;position:relative;overflow:hidden;background:var(--bg);border-radius:56px;border:1px solid var(--rule2);box-shadow:var(--shadow);color:var(--ink1);isolation:isolate}
.ph.land{width:874px;height:402px}
.ph .deco{position:absolute;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(520px 380px at 12% -8%, var(--glow), transparent 62%)}
.ph > *{position:relative;z-index:1}
.sb{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 34px;font:600 15px/1 var(--fs);letter-spacing:.01em}
.sb .dyn{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000}
.sb .r{display:flex;gap:6px;align-items:center}
.sb .r i{display:inline-block;width:20px;height:11px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.sb .r i:after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:12px;background:currentColor;border-radius:1.5px}
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--ink1);opacity:.75;z-index:5}
.ph.land .home{width:5px;height:120px;left:auto;right:8px;bottom:50%;transform:translateY(50%)}

/* 通用 */
.num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.up{color:var(--cUp)} .dn{color:var(--cDn)} .ink2{color:var(--ink2)} .ink3{color:var(--ink3)} .acc{color:var(--acc)} .warn{color:var(--warn)} .danger{color:var(--danger)}
.hair{height:1px;background:var(--rule)}
.tag{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:5px;font:600 9.5px/1 var(--fs);color:var(--ink2);background:var(--tint);letter-spacing:.02em;vertical-align:middle}
.tag.acc{color:var(--acc);background:var(--accSoft)}
.tag.us{color:var(--ink2)}
.ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:14px;color:var(--ink1)}
.ib.sm{width:36px;height:36px}
.ib.fill{background:var(--surf)}
.ico{display:inline-flex;vertical-align:middle;flex:none}
.pebble{background:var(--ink1);color:var(--onInk)}

/* 顶栏（盘面） */
.top{padding:2px 16px 0}
.top .r1{height:44px;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px/1 var(--fs);color:var(--onAcc);background:var(--acc);flex:none}
.avatar.out{background:transparent;border:1.5px dashed var(--ink3);color:var(--ink3)}
.sym{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 4px 0 2px;border-radius:12px}
.sym .b{font:700 17px/1 var(--fs);letter-spacing:-.01em}
.sym .q{font:500 12px/1 var(--fs);color:var(--ink3);margin-left:-3px}
.top .r2{display:flex;align-items:flex-end;gap:10px;padding:8px 0 0;min-height:40px}
.price{font:600 26px/1 var(--fs);letter-spacing:-.02em}
.chg{font:600 15px/1 var(--fs);padding-bottom:2px}
.stale .price,.stale .chg{color:var(--ink3)!important}
.note{font:500 11px/1 var(--fs);margin-left:auto;padding-bottom:3px;display:inline-flex;gap:5px;align-items:center}
.note .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.note.breathe .dot{animation:br 1.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:1}50%{opacity:.25}}
.top .r3{display:flex;gap:14px;padding:6px 0 8px;font:400 11px/1 var(--fs);color:var(--ink3)}
.top .r3 b{font-weight:500;color:var(--ink2);margin-left:3px}

/* 周期条 */
.iv{display:flex;align-items:center;gap:4px;padding:4px 16px 8px;white-space:nowrap}
.iv .c{height:30px;min-width:36px;padding:0 7px;border-radius:var(--rChip);display:inline-flex;align-items:center;justify-content:center;font:500 13px/1 var(--fs);color:var(--ink2);position:relative}
.iv .c.on{background:var(--accBg);color:var(--onAcc);font-weight:600}
.iv .c.pin:after{content:"";position:absolute;right:4px;top:4px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.iv .all{display:inline-flex;align-items:center;gap:1px;height:30px;padding:0 5px 0 8px;border-radius:var(--rChip);color:var(--ink2);font:500 13px/1 var(--fs)}
.iv .div{width:1px;height:18px;background:var(--rule2);margin:0 2px}
.iv .tool{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 9px 0 7px;border-radius:var(--rChip);font:500 13px/1 var(--fs);color:var(--ink1);background:var(--surf)}
.ivall{margin:0 16px 8px;padding:10px;border-radius:16px;background:var(--surf);display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ivall .c{height:36px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 12px/1 var(--fs);color:var(--ink2);position:relative}
.ivall .c small{font-size:9px;color:var(--ink3)}
.ivall .c.on{background:var(--accBg);color:var(--onAcc)} .ivall .c.on small{color:var(--onAcc);opacity:.7}
.ivall .c.pin:after{content:"";position:absolute;right:5px;top:5px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.ivall .hint{grid-column:1/-1;font:400 10.5px/1 var(--fs);color:var(--ink3);text-align:center;padding-top:2px}

/* 图表画布 */
.chart{position:relative;margin:0 0 0 0}
.chart svg{display:block}

/* 底部 Dock */
.dock{position:absolute;left:16px;right:16px;bottom:26px;height:60px;border-radius:var(--rDock);background:var(--card);box-shadow:var(--shadow);border:1px solid var(--rule);display:flex;align-items:center;padding:0 10px;z-index:6}
.dock .it{flex:1;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 10.5px/1 var(--fs);color:var(--ink2);border-radius:16px;position:relative}
.dock .it.on{color:var(--acc)}
.dock .it.on:after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.dock .it .badge{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--acc);color:var(--onAcc);font:700 9.5px/16px var(--fs);text-align:center}
.dock .act{width:46px;height:46px;border-radius:15px;background:var(--accBg);color:var(--onAcc);box-shadow:0 10px 22px -12px var(--acc);display:flex;align-items:center;justify-content:center;margin:0 6px;flex:none;box-shadow:var(--shadow2)}

/* 页面头（自选/复盘/我） */
.ptop{height:52px;display:flex;align-items:center;padding:0 12px 0 8px;gap:2px}
.ptop h3{font:700 20px/1 var(--fs);letter-spacing:-.01em;margin-left:4px}
.ptop .sp{flex:1}
.chips{display:flex;gap:6px;padding:4px 16px 10px;align-items:center}
.chips .c{height:30px;padding:0 12px;border-radius:var(--rChip);display:inline-flex;align-items:center;gap:5px;font:500 13px/1 var(--fs);color:var(--ink2);background:var(--surf)}
.chips .c.on{background:var(--accBg);color:var(--onAcc);font-weight:600}
.chips .c .n{font-size:11px;opacity:.7}
.chips .right{margin-left:auto;font:400 11px/1 var(--fs);color:var(--ink3);display:flex;align-items:center;gap:6px}
.udbar{display:flex;height:3px;width:72px;border-radius:2px;overflow:hidden;background:var(--tint)}
.udbar i{display:block;height:100%}

/* 列表行（自选） */
.list{padding:0 16px}
.frow{height:62px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--rule)}
.frow:last-child{border-bottom:0}
.frow .nm{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.frow .nm .l1{display:flex;align-items:center;gap:5px;font:600 15px/1 var(--fs)}
.frow .nm .l1 small{font:500 11px/1 var(--fs);color:var(--ink3)}
.frow .nm .l2{font:400 11px/1 var(--fs);color:var(--ink3)}
.frow .sp{width:64px;height:24px;flex:none}
.frow .px{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:92px}
.frow .px .p{font:600 15px/1 var(--fs)}
.frow .px .d{font:600 12.5px/1 var(--fs)}
.frow.hot .px .d{padding:2px 6px;border-radius:6px;background:color-mix(in srgb,currentColor 12%,transparent)}
.frow .star{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--ink3);flex:none;margin-right:-6px}
.frow .star.on{color:var(--acc)}
.coin{border-radius:var(--rBadge);display:flex;align-items:center;justify-content:center;color:#fff;font:700 13px/1 var(--fs);flex:none;box-shadow:inset 0 -6px 12px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.35)}
.emptyhint{padding:8px 16px 2px;font:400 11px/1 var(--fs);color:var(--ink3);display:flex;justify-content:space-between}

/* 搜索 */
.search{margin:2px 16px 8px;height:40px;border-radius:13px;background:var(--surf);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--ink3);font:400 14px/1 var(--fs)}
.search .q{color:var(--ink1);font-weight:500}
.search .cur{width:1.5px;height:16px;background:var(--acc);animation:br 1s steps(2) infinite}
.search .cancel{margin-left:auto;color:var(--ink2);font-size:13px;font-weight:500}
.kbd{position:absolute;left:0;right:0;bottom:0;height:290px;background:var(--surf);border-top:1px solid var(--rule);padding:10px 4px 0;display:grid;grid-template-columns:repeat(10,1fr);gap:8px 5px;align-content:start;z-index:4}
.kbd span{height:42px;border-radius:7px;background:var(--card);box-shadow:0 1px 0 var(--rule2);display:flex;align-items:center;justify-content:center;font:400 20px/1 var(--fs);color:var(--ink1)}
.kbd span.f{background:var(--tint);font-size:14px}
.kbd .r2{grid-column:1/-1;display:grid;grid-template-columns:repeat(9,1fr);gap:5px;padding:0 20px}
.kbd .r3{grid-column:1/-1;display:grid;grid-template-columns:1.3fr repeat(7,1fr) 1.3fr;gap:5px}
.kbd .r4{grid-column:1/-1;display:grid;grid-template-columns:1.3fr 5fr 1.3fr;gap:5px}

/* 空状态 */
.empty{padding:70px 24px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ill{width:88px;height:88px;border-radius:28px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--acc);margin-bottom:6px}
.empty h4{font:600 17px/1.3 var(--fs)}
.empty p{font:400 13px/1.6 var(--fs);color:var(--ink2);max-width:260px}

/* 按钮 */
.btn{height:46px;border-radius:var(--rBtn);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 15px/1 var(--fs);padding:0 22px}
.btn.ink{background:var(--accBg);color:var(--onAcc);box-shadow:0 12px 24px -14px var(--acc)}
.btn.acc{background:var(--acc);color:var(--onAcc)}
.btn.soft{background:var(--surf);color:var(--ink1)}
.btn.line{border:1px solid var(--rule2);color:var(--ink1)}
.btn.text{color:var(--ink2);padding:0 10px}
.btn.wide{width:100%}
.btn.dis{opacity:.4}
.btn.sm{height:36px;font-size:13px;padding:0 14px;border-radius:11px}

/* Sheet */
.scrim{position:absolute;inset:0;background:rgba(6,12,10,.34);z-index:7}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:var(--rSheet) var(--rSheet) 0 0;box-shadow:0 -12px 40px -20px rgba(0,0,0,.4);z-index:8;padding:0 16px 34px}
.sheet .hd{height:22px;display:flex;justify-content:center;align-items:center}
.sheet .hd i{width:38px;height:5px;border-radius:3px;background:var(--rule2)}
.sheet .ttl{display:flex;align-items:center;gap:10px;height:40px}
.sheet .ttl h4{font:700 17px/1 var(--fs)}
.sheet .ttl .sp{flex:1}
.range{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;background:var(--accSoft);color:var(--acc);font:500 11.5px/1 var(--fs)}
.seg3{display:flex;background:var(--surf);border-radius:13px;padding:3px;gap:3px;margin-top:12px}
.seg3 span{flex:1;height:38px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:10px;font:500 14px/1 var(--fs);color:var(--ink2)}
.seg3 span.on{background:var(--accBg);color:var(--onAcc);font-weight:600}
.inp{margin-top:12px;min-height:56px;border-radius:14px;background:var(--surf);padding:14px 14px;font:400 15px/1.5 var(--fs);color:var(--ink3);display:flex;align-items:flex-start;gap:8px}
.inp.filled{color:var(--ink1)}
.inp .cur{width:1.5px;height:18px;background:var(--acc);animation:br 1s steps(2) infinite;margin-top:2px}
.mrow{display:flex;gap:8px;margin-top:12px}
.menu{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 10px 0 12px;border-radius:11px;border:1px solid var(--rule2);font:500 13px/1 var(--fs);color:var(--ink1)}
.menu small{color:var(--ink3);font-weight:400;margin-right:2px}
.sheet .ft{display:flex;align-items:center;gap:10px;margin-top:16px}
.sheet .ft .sp{flex:1}
.hl{position:absolute;pointer-events:none;border-radius:6px;background:var(--accSoft);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}

/* Toast */
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;height:42px;padding:0 8px 0 16px;border-radius:14px;background:var(--ink1);color:var(--onInk);display:inline-flex;align-items:center;gap:14px;font:500 13.5px/1 var(--fs);box-shadow:var(--shadow);z-index:9;white-space:nowrap}
.toast .u{height:30px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.14);display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--acc)}
[data-mode=light] .toast .u{background:rgba(255,255,255,.12);color:var(--tint2)}

/* 复盘 */

.tri{height:5px;border-radius:3px;overflow:hidden;display:flex;margin-top:12px;background:var(--tint)}
.tri i{display:block;height:100%}
.hero .l3{display:flex;gap:14px;margin-top:10px;font:400 11px/1 var(--fs);color:var(--ink3)}
.hero .l3 i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rcard{margin:0 16px 10px;padding:14px 14px 12px;border-radius:16px;background:var(--card);border:1px solid var(--rule)}
.rcard .m1{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--fs)}
.rcard .m1 .t{color:var(--ink3);font-weight:400;margin-left:auto;font-size:11px}
.rcard .q{font:500 15px/1.45 var(--fs);margin-top:8px;color:var(--ink1)}
.rcard .m2{display:flex;align-items:center;gap:8px;margin-top:10px;font:400 11.5px/1 var(--fs);color:var(--ink3)}
.rcard .m2 .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 6px 0 10px;border-radius:9px;background:var(--surf);color:var(--ink1);font:500 12px/1 var(--fs)}
.verdict{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:6px;font:600 11px/1 var(--fs)}
.verdict.ok{color:var(--cUp);background:color-mix(in srgb,var(--cUp) 12%,transparent)}
.verdict.no{color:var(--cDn);background:color-mix(in srgb,var(--cDn) 12%,transparent)}
.verdict.wait{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.dirtag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font:600 11px/1 var(--fs);background:var(--tint);color:var(--ink2)}

/* 设置类行 */
.grp{margin:0 16px 14px;border-radius:var(--rCard);background:var(--card);border:1px solid var(--rule);overflow:hidden}

.srow .sub{font:400 11.5px/1 var(--fs);color:var(--ink3);margin-top:4px}
.srow .lbl{display:flex;flex-direction:column;flex:1}
.srow .val{color:var(--ink3);font-weight:400;font-size:14px}

.srow.tall{height:auto;padding:14px 16px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--tint2);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--acc)} .sw.on:after{left:21px}
.segs{display:inline-flex;background:var(--surf);border-radius:10px;padding:2px;gap:2px}
.segs span{height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:8px;font:500 12.5px/1 var(--fs);color:var(--ink2)}
.segs span.on{background:var(--accBg);color:var(--onAcc);font-weight:600}
.swatches{display:flex;gap:10px}

/* ═══════════════════════ K 线底座（AICoin 复刻的占位画法） ═══════════════════════ */
function series(seed=7, n=64, base=76000){
  const r=rng(seed); let c=base; const out=[];
  for(let i=0;i<n;i++){ const o=c; const drift=Math.sin(i/9)*0.0012+(r()-0.5)*0.011; c=o*(1+drift); const h=Math.max(o,c)*(1+r()*0.004); const l=Math.min(o,c)*(1-r()*0.004); const v=30+r()*70+(Math.abs(drift)*4000); out.push({o,h,l,c,v}); }
  return out;
}
function ma(arr,k){ return arr.map((_,i)=> i<k-1?null: arr.slice(i-k+1,i+1).reduce((s,x)=>s+x.c,0)/k); }
function ema(vals,k){ const a=2/(k+1); let e=null; return vals.map(v=>{ e = e==null? v : v*a+e*(1-a); return e; }); }
function chart(o){
  const {w,h,bare=false,seed=7,cross=false,hl=null,axis=52} = o;
  const S=series(seed); const n=S.length;

  const hi=Math.max(...S.map(x=>x.h)), lo=Math.min(...S.map(x=>x.l));
  const y=v=>padT+ (hi-v)/(hi-lo)*(mainH-8)+4;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="font-family:var(--fs)">`;
  // grid
  const gl=4; for(let i=0;i<=gl;i++){ const yy=padT+i*(mainH/gl); s+=`<line x1="0" x2="${cw}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--rule)" stroke-dasharray="2 3"/>`; const val=hi-(hi-lo)*i/gl; s+=`<text x="${cw+6}" y="${(yy+3.5).toFixed(1)}" font-size="9.5" fill="var(--ink3)" class="num">${fmt(val,1)}</text>`; }
  // highlight window
  if(hl){ const [a,b]=hl; s+=`<rect x="${(a*step).toFixed(1)}" y="${padT}" width="${((b-a)*step).toFixed(1)}" height="${mainH+volH+macdH}" fill="var(--accSoft)"/><line x1="${(a*step).toFixed(1)}" x2="${(a*step).toFixed(1)}" y1="${padT}" y2="${h-14}" stroke="var(--acc)" stroke-dasharray="3 3" opacity=".6"/><line x1="${(b*step).toFixed(1)}" x2="${(b*step).toFixed(1)}" y1="${padT}" y2="${h-14}" stroke="var(--acc)" stroke-dasharray="3 3" opacity=".6"/>`; }
  // candles
  S.forEach((k,i)=>{ const x=i*step+step/2; const up=k.c>=k.o; const col=up?'var(--cUp)':'var(--cDn)'; s+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${y(k.h).toFixed(1)}" y2="${y(k.l).toFixed(1)}" stroke="${col}" stroke-width="1"/>`; const top=y(Math.max(k.o,k.c)), bot=y(Math.min(k.o,k.c)); s+=`<rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,bot-top).toFixed(1)}" fill="${up?'var(--bg)':col}" stroke="${col}" stroke-width="1"/>`; });
  if(!bare){
    // MA lines
    const mas=[[5,'var(--ma1)'],[10,'var(--ma2)'],[30,'var(--ma3)']];
    mas.forEach(([k,col])=>{ const m=ma(S,k); let d=''; m.forEach((v,i)=>{ if(v==null) return; d+=(d?'L':'M')+(i*step+step/2).toFixed(1)+' '+y(v).toFixed(1)+' '; }); s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.1"/>`; });
    // MA labels
    let lx=6; mas.forEach(([k,col])=>{ const m=ma(S,k); const v=m[n-1]; const t=`MA${k} ${fmt(v,1)}`; s+=`<text x="${lx}" y="13" font-size="9.5" fill="${col}" class="num">${t}</text>`; lx+= t.length*5.6+10; });
    // last price line
    const last=S[n-1].c; const ly=y(last); const lcol=S[n-1].c>=S[n-1].o?'var(--cUp)':'var(--cDn)';
    s+=`<line x1="0" x2="${cw}" y1="${ly.toFixed(1)}" y2="${ly.toFixed(1)}" stroke="${lcol}" stroke-dasharray="3 3" stroke-width=".8"/>`;
    s+=`<rect x="${cw+1}" y="${(ly-8).toFixed(1)}" width="${axis-2}" height="16" rx="3" fill="${lcol}"/><text x="${cw+axis/2}" y="${(ly+3.5).toFixed(1)}" font-size="9.5" fill="#fff" text-anchor="middle" class="num" font-weight="600">${fmt(last,1)}</text>`;
    // VOL
    const vT=padT+mainH+6; const vmax=Math.max(...S.map(x=>x.v));
    s+=`<text x="6" y="${vT+9}" font-size="9.5" fill="var(--ink3)">VOL <tspan fill="var(--ink2)">${fmt(S[n-1].v*1e3,0)}</tspan></text>`;
    S.forEach((k,i)=>{ const x=i*step+step/2; const bh=(k.v/vmax)*(volH-14); s+=`<rect x="${(x-bw/2).toFixed(1)}" y="${(vT+volH-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${k.c>=k.o?'var(--cUp)':'var(--cDn)'}" opacity=".85"/>`; });
    s+=`<line x1="0" x2="${cw}" y1="${vT-3}" y2="${vT-3}" stroke="var(--rule)"/>`;
    // MACD
    const mT=vT+volH+6; const closes=S.map(x=>x.c); const e12=ema(closes,12), e26=ema(closes,26); const dif=e12.map((v,i)=>v-e26[i]); const dea=ema(dif,9); const hist=dif.map((v,i)=>(v-dea[i])*2);
    const mm=Math.max(...hist.map(Math.abs),...dif.map(Math.abs),...dea.map(Math.abs)); const my=v=>mT+ (macdH-16)/2 - v/mm*((macdH-16)/2) + 12;
    s+=`<line x1="0" x2="${cw}" y1="${mT-3}" y2="${mT-3}" stroke="var(--rule)"/>`;
    s+=`<text x="6" y="${mT+9}" font-size="9.5" fill="var(--ink3)">MACD(12,26,9) <tspan fill="var(--ma1)">DIF ${dif[n-1].toFixed(1)}</tspan> <tspan fill="var(--ma2)">DEA ${dea[n-1].toFixed(1)}</tspan></text>`;
    const zero=my(0); s+=`<line x1="0" x2="${cw}" y1="${zero.toFixed(1)}" y2="${zero.toFixed(1)}" stroke="var(--rule2)"/>`;
    hist.forEach((v,i)=>{ const x=i*step+step/2; const yy=my(v); s+=`<rect x="${(x-bw/2).toFixed(1)}" y="${Math.min(yy,zero).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,Math.abs(yy-zero)).toFixed(1)}" fill="${v>=0?'var(--cUp)':'var(--cDn)'}" opacity=".85"/>`; });
    [[dif,'var(--ma1)'],[dea,'var(--ma2)']].forEach(([arr,col])=>{ let d=''; arr.forEach((v,i)=>{ if(i<26) return; d+=(d?'L':'M')+(i*step+step/2).toFixed(1)+' '+my(v).toFixed(1)+' '; }); s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1"/>`; });
  }
  // time axis
  const times=['09:00','13:00','17:00','21:00','01:00','05:00']; times.forEach((t,i)=>{ const x=(i+0.5)*(cw/times.length); s+=`<text x="${x.toFixed(1)}" y="${h-4}" font-size="9" fill="var(--ink3)" text-anchor="middle" class="num">${t}</text>`; });
  if(cross){ const i=Math.floor(n*0.62); const x=i*step+step/2; const k=S[i]; const yy=y(k.c); s+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${padT}" y2="${h-14}" stroke="var(--ink2)" stroke-dasharray="3 2" stroke-width=".8"/><line x1="0" x2="${cw}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--ink2)" stroke-dasharray="3 2" stroke-width=".8"/>`; }
  s+=`</svg>`; return s;
}

  const icons=Object.keys(IP);
  return `<section id="s-spec"><h2><span class="k">08</span>规格</h2><p class="lead">当前皮肤与深浅下的实际取值。两套皮肤（陶土 · 暖 / 青苔 · 冷，色值沿用 Opus 原型）共用同一份语义 token：换皮肤只换值，不换任何布局。数字一律 tabular-nums 的系统字（不是等宽字体），文字一律 PingFang / SF。</p>
  <div class="spec">

    <div class="card"><h4>字阶 <small>8 级</small></h4><div class="tsc">${type.map(([k,u,st])=>`<div><span>${k}<br>${u}</span><em style="${st};font-style:normal" class="num">76,447.30 复盘</em></div>`).join('')}</div></div>
    <div class="card"><h4>图标 <small>自绘 · 1.6pt 描边 · 圆头 · 24 栅格</small></h4><div class="icons">${icons.map(n=>`<div>${ic(n,20,1.6)}<span>${n}</span></div>`).join('')}</div><div style="margin-top:10px;font:400 11.5px/1.6 var(--fs);color:var(--ink2)">Dock 22pt · 顶栏 22pt · 行内 16–18pt · 徽标 13–14pt。同一界面只有这一种线宽，不与 SF Symbols 混排。</div></div>
    <div class="card"><h4>圆角 / 间距 / 尺度</h4><table class="mtab"><tr><th>元素</th><th>值</th></tr>
      <tr><td>chip / 周期格</td><td>30pt 高 · 圆角 11</td></tr><tr><td>按钮</td><td>46pt · 圆角 14（小钮 36 · 11）</td></tr><tr><td>卡片 / 分组</td><td>圆角 18 · 1pt rule 描边 · 无阴影（摘要卡与身份卡有 shadow2）</td></tr><tr><td>Sheet</td><td>圆角 28 · 拖拽条 38×5</td></tr><tr><td>Dock</td><td>60pt 高 · 左右 16 · 底 26 · 圆角 26 · shadow</td></tr><tr><td>徽章</td><td>32（自选行）/ 30（顶栏头像）/ 24（复盘）/ 20（卡片内）· 圆角 9</td></tr><tr><td>页边距</td><td>16pt；组间 14pt；4pt 基准</td></tr><tr><td>行高</td><td>自选 62 · 设置 50 · 复盘卡自适应（≈ 96）</td></tr><tr><td>热区</td><td>≥ 44×44，无例外</td></tr></table></div>
    <div class="card"><h4>运动 <small>4 种转场 · 4 档时长</small></h4><table class="mtab"><tr><th>动作</th><th>时长</th><th>说明</th></tr>
      <tr><td>换品种 / 换周期</td><td>0</td><td>图表内容直接换</td></tr><tr><td>价格变化</td><td>120 / 180ms</td><td>主价位背后 8% 涨跌色底纹淡入淡出</td></tr><tr><td>Sheet（记一笔 / 图表）</td><td>0.28s spring</td><td>覆盖升起，不压缩图表</td></tr><tr><td>周期全部展开</td><td>0.2s / 收 0.18s</td><td>原地长出第二段</td></tr><tr><td>自选 / 复盘 / 我</td><td>0.3s push</td><td>系统横向 push，返回手势可用</td></tr><tr><td>画线横屏</td><td>0.35s</td><td>旋转 + 指标淡出</td></tr><tr><td>toast</td><td>入 0.2 · 停 1.8（可撤 5.0）· 出 0.2</td><td>全 app 唯一一层</td></tr><tr><td>Reduce Motion</td><td>—</td><td>全部退化为 0.12s 交叉淡入</td></tr></table></div>
    <div class="card"><h4>触感 <small>只有 3 种</small></h4><table class="mtab"><tr><th>场景</th><th>触感</th></tr><tr><td>周期切换 / 星标 / 分段 / 钉住</td><td>selection</td></tr><tr><td>记下 / 判定 / 登录成功</td><td>success</td></tr><tr><td>删除 / 恢复默认 / 退出</td><td>warning</td></tr><tr><td>其他一切</td><td>无</td></tr></table></div>
  </div></section>`;
}
/* ═══════════════════════ 工具栏 ═══════════════════════ */
function bind(segId, attr){ const seg=$(segId); seg.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; [...seg.children].forEach(x=>x.classList.toggle('on',x===b)); document.documentElement.dataset[attr]=b.dataset[attr]; renderMain(); }); }
bind('#skinSeg','skin'); bind('#modeSeg','mode'); bind('#updirSeg','updir');
/* 深链：#skin=terra&mode=dark&updir=red&at=s-fav */
const HP=Object.fromEntries(location.hash.replace(/^#/,'').split('&').filter(Boolean).map(kv=>kv.split('=')));
if(matchMedia('(prefers-color-scheme: dark)').matches){ document.documentElement.dataset.mode='dark'; [...$('#modeSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.mode==='dark')); }
['skin','mode','updir'].forEach(k=>{ if(HP[k]){ document.documentElement.dataset[k]=HP[k]; const seg=$('#'+k+'Seg'); if(seg) [...seg.children].forEach(x=>x.classList.toggle('on',x.dataset[k]===HP[k])); } });
renderMain();
if(HP.only){ document.querySelectorAll('#main > section').forEach(x=>{ if(x.id!==HP.only) x.style.display='none'; }); }
if(HP.at){ const el=document.getElementById(HP.at); if(el) el.scrollIntoView(); }
</script>
