<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>看盘 · 五套视觉风格</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0B0F;color:#ECECF2;font:14px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;padding:54px 30px 140px}
.wrap{max-width:1460px;margin:0 auto}
h1{font-size:34px;font-weight:700;letter-spacing:-.03em}
.lede{color:#8E8E9C;margin-top:13px;max-width:900px;font-size:14.5px}
.lede b{color:#D6D6E4;font-weight:600}
.shead{margin:86px 0 26px;padding-top:26px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.snum{font:700 13px/1 ui-monospace,monospace;color:#5E5E70;letter-spacing:.2em;padding-bottom:7px}
.sname{font-size:27px;font-weight:700;letter-spacing:-.02em}
.sen{font:600 11.5px/1 ui-monospace,monospace;letter-spacing:.3em;color:#6E6E82;padding-bottom:9px}
.stag{color:#8E8E9C;font-size:13px;flex:1 0 100%;max-width:980px;margin-top:4px}
.swatches{display:flex;gap:7px;margin-top:14px;flex:1 0 100%}
.swatches i{width:36px;height:22px;border-radius:7px;display:block;border:1px solid rgba(255,255,255,.14)}
.row4{display:flex;gap:26px;flex-wrap:wrap;margin-top:26px}
.device{width:403px;padding:7px;border-radius:52px;background:linear-gradient(160deg,#4a4550,#17161b 42%,#2b2830);box-shadow:0 34px 64px -26px rgba(0,0,0,.85);flex:none}
.phone{width:389px;height:842px;border-radius:45px;overflow:hidden;position:relative}
.cap{margin-top:11px;text-align:center;font:600 10.5px/1 ui-monospace,monospace;color:#5E5E70;letter-spacing:.18em}

/* ===== 共用组件（全部走变量，风格靠变量+覆盖改） ===== */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink1);overflow:hidden;font-family:var(--font,-apple-system,"SF Pro Text","PingFang SC",sans-serif)}
.num{font-family:var(--mono,ui-monospace,"SF Mono",Menlo,monospace);font-variant-numeric:tabular-nums}
.deco{position:absolute;left:0;right:0;top:0;height:430px;pointer-events:none;z-index:0}
.sb{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 3px;font:650 15px/1 -apple-system;flex:none;position:relative;z-index:3}
.sb u{display:block;width:17px;height:10px;border:1.4px solid currentColor;border-radius:3px;opacity:.5;text-decoration:none}
.hdr{position:relative;flex:none;z-index:2}
.top{height:46px;display:flex;align-items:center;gap:11px;padding:0 var(--padx)}
.cn{display:flex;align-items:center;justify-content:center;flex:none;color:#fff;position:relative;border-radius:var(--rBadge)}
.cn:after{content:"";position:absolute;inset:0;border-radius:var(--rBadge);border:1px solid rgba(255,255,255,.28)}
.symw{flex:1;min-width:0}
.s1{font-size:15.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:5px;font-family:var(--disp,inherit)}
.s1 em{font-style:normal;color:var(--ink3);font-weight:500;font-size:11.5px}
.s2{font-size:10px;color:var(--ink3);letter-spacing:.1em;margin-top:2px;display:flex;align-items:center;gap:5px}
.dotg{width:5px;height:5px;border-radius:9px;background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent)}
.rbtn{width:30px;height:30px;border-radius:var(--rBtn);background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.rbtn.star{color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.price{padding:14px var(--padx) 0;position:relative}
.prow2{display:flex;align-items:center;gap:11px}
.pnow{font-size:var(--pSize,30px);font-weight:var(--pWeight,700);letter-spacing:var(--pTrack,-.03em);line-height:1.08;font-family:var(--mono,ui-monospace,monospace)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:5px 10px 5px 8px;border-radius:var(--rPill);color:#fff;letter-spacing:-.01em}
.stats{display:flex;gap:8px;margin-top:15px}
.stats div{flex:1;background:var(--surf);border-radius:var(--rChip);padding:9px 10px 10px}
.stats i{font-style:normal;display:block;font-size:9px;color:var(--ink3);letter-spacing:.14em;font-weight:600}
.stats b{display:block;font-weight:650;font-size:12.5px;margin-top:4px;letter-spacing:-.015em}
.iv{display:flex;align-items:center;gap:5px;padding:15px var(--padx) 13px;flex:none;overflow:hidden;position:relative;z-index:2}
.iv a{font-size:12.5px;color:var(--ink2);padding:7px 9px;border-radius:var(--rPill);background:var(--surf);font-weight:600;flex:none;white-space:nowrap}
.iv a.on{color:var(--onInk,#fff);font-weight:700;background:var(--accBg)}
.iv a.gh{background:transparent;color:var(--ink3);padding:7px 3px}
.iv a.draw{background:var(--surf2);color:var(--ink1);display:flex;align-items:center;gap:5px;font-weight:700}
.chart{flex:1;min-height:0;position:relative}
.chart svg{display:block;width:100%;height:100%}
.tabs{height:86px;flex:none;display:flex;align-items:flex-start;padding:9px 12px 0;background:var(--bg);border-top:1px solid var(--rule);position:relative;z-index:3}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink3);font-size:10px;font-weight:650;letter-spacing:.05em}
.tabs a u{width:42px;height:27px;border-radius:var(--rChip);display:flex;align-items:center;justify-content:center;text-decoration:none}
.tabs a.on{color:var(--acc)}
.tabs a.on u{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.tabs a.hero{color:var(--ink2)}
.tabs a.hero u{background:var(--accBg);color:var(--onInk,#fff)}
.dim{position:absolute;inset:0;background:var(--dim)}
.layer{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;overflow:hidden;background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-bottom:1px solid var(--gline);border-radius:0 0 var(--rSheet) var(--rSheet);box-shadow:var(--shSheet)}
.hz{height:5px;width:128px;background:var(--ink1);opacity:.24;border-radius:3px;margin:0 auto}
.srch{height:44px;border-radius:var(--rChip);background:var(--surf);display:flex;align-items:center;gap:9px;padding:0 14px;color:var(--ink3);font-size:14px}
.chipx{font-size:12.5px;font-weight:650;padding:7px 14px;border-radius:var(--rPill);color:var(--ink2);background:var(--surf)}
.chipx.on{color:var(--onInk,#fff);background:var(--accBg)}
.favwrap{flex:1;position:relative;margin:0 var(--favM);border-radius:var(--rCard);background:var(--favBg);padding:6px 0;overflow:hidden}
.frow{display:flex;align-items:center;gap:12px;padding:11px 15px}
.ttl{font-size:24px;font-weight:700;letter-spacing:-.03em;font-family:var(--disp,inherit)}
</style>
<style id="stylecss"></style></head>
<body><div class="wrap">
<h1>看盘 · 五套视觉风格</h1>
<p class="lede">同一张盘面、同一张自选，五种完全不同的长相，每种都出<b>夜相 / 昼相</b>两套。五套共同守的规矩：<b>最新价 28–30pt，不做巨无霸</b>，涨跌靠颜色和形状说话；<b>品种一律带品牌徽章</b>，自选行内嵌迷你走势；<b>K 线与指标画法保持现状不动</b>，只跟着主题换浅深。</p>
<div id="out"></div></div>
<script>
/* ---------- 数据 ---------- */
function rng(s){return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;}}
function series(n,seed){var r=rng(seed),p=0,o=[];for(var i=0;i<n;i++){var a=p,c=a-0.42+(r()-0.5)*3.1,h=Math.max(a,c)+r()*1.35,l=Math.min(a,c)-r()*1.35;o.push({o:a,h:h,l:l,c:c,v:0.30+r()*0.85});p=c;}
 var f=o[0].o,la=o[n-1].c,A=77588,B=75942,k=(B-A)/(la-f);o.forEach(function(d){['o','h','l','c'].forEach(function(K){d[K]=A+(d[K]-f)*k;});});return o;}
var S=series(62,20260916),P0=S[0].o,PN=S[S.length-1].c;
var HI=Math.max.apply(null,S.map(function(d){return d.h;})),LO=Math.min.apply(null,S.map(function(d){return d.l;}));
var CHG=(PN-P0)/P0*100;
function f2(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function ma(k){return S.map(function(_,i){if(i<k-1)return null;var s=0;for(var j=i-k+1;j<=i;j++)s+=S[j].c;return s/k;});}
var MA7=ma(7),MA30=ma(30);
function fnum(v){return v<10?v.toFixed(4):v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function sgn(v){return (v>=0?'+':'\u2212')+Math.abs(v).toFixed(2)+'%';}

/* ---------- K 线底座：保持现状，只随主题换浅深 ---------- */
function chart(P){
 var W=389,H=470,padR=54,x0=6,cw=(W-padR-x0)/S.length,bw=Math.max(3,cw*0.62);
 var mT=8,mH=282,vT=302,vH=62,dT=376,dH=62,lo=LO-40,hi=HI+40;
 var y=function(p){return mT+(hi-p)/(hi-lo)*mH;},g='';
 for(var i=0;i<=4;i++){var gy=mT+mH/4*i;
  g+='<line x1="0" y1="'+gy+'" x2="'+(W-padR+4)+'" y2="'+gy+'" stroke="'+P.grid+'" stroke-width=".5"/>'
   +'<text x="'+(W-padR+8)+'" y="'+(gy+3.4)+'" fill="'+P.axis+'" font-size="9" font-family="ui-monospace,monospace">'+f2(hi-(hi-lo)/4*i).split('.')[0]+'</text>';}
 var c='';S.forEach(function(d,i){var cx=x0+cw*i+cw/2,col=d.c>=d.o?P.up:P.down;
  c+='<line x1="'+cx.toFixed(1)+'" y1="'+y(d.h).toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+y(d.l).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
  var yy=Math.min(y(d.o),y(d.c)),hh=Math.max(1,Math.abs(y(d.o)-y(d.c)));
  c+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+col+'"/>';});
 function poly(a,col){return '<polyline points="'+a.map(function(v,i){return v==null?null:(x0+cw*i+cw/2).toFixed(1)+','+y(v).toFixed(1);}).filter(Boolean).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1" stroke-linejoin="round"/>';}
 var mv=Math.max.apply(null,S.map(function(d){return d.v;})),v='';
 S.forEach(function(d,i){var cx=x0+cw*i+cw/2,hh=d.v/mv*(vH-8);
  v+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(vT+vH-hh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+(d.c>=d.o?P.up:P.down)+'" opacity=".5"/>';});
 var dif=S.map(function(_,i){return (MA7[i]==null||MA30[i]==null)?null:(MA7[i]-MA30[i]);});
 var md=Math.max.apply(null,dif.filter(function(x){return x!=null;}).map(Math.abs))||1,m='',mid=dT+dH/2;
 dif.forEach(function(val,i){if(val==null)return;var cx=x0+cw*i+cw/2,hh=val/md*(dH/2-6);
  m+='<rect x="'+(cx-bw/2+0.6).toFixed(1)+'" y="'+(val>=0?mid-hh:mid).toFixed(1)+'" width="'+(bw-1.2).toFixed(1)+'" height="'+Math.max(0.8,Math.abs(hh)).toFixed(1)+'" fill="'+(val>=0?P.up:P.down)+'" opacity=".78"/>';});
 var lab='<text x="10" y="'+(mT+11)+'" fill="'+P.axis+'" font-size="9" font-family="ui-monospace,monospace">MA7 '+f2(MA7[61])+'  MA30 '+f2(MA30[61])+'</text>'
  +'<text x="10" y="'+(vT+11)+'" fill="'+P.axis+'" font-size="9" font-family="ui-monospace,monospace">VOL</text>'
  +'<text x="10" y="'+(dT+11)+'" fill="'+P.axis+'" font-size="9" font-family="ui-monospace,monospace">MACD 12 26 9</text>';
 var ly=y(PN);
 var last='<line x1="0" y1="'+ly.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+ly.toFixed(1)+'" stroke="'+P.down+'" stroke-width=".7" stroke-dasharray="2 3" opacity=".85"/>'
  +'<rect x="'+(W-padR+3)+'" y="'+(ly-8).toFixed(1)+'" width="49" height="16" rx="3" fill="'+P.down+'"/>'
  +'<text x="'+(W-padR+7)+'" y="'+(ly+3.6).toFixed(1)+'" fill="#fff" font-size="9.5" font-family="ui-monospace,monospace">'+f2(PN)+'</text>';
 var sep='<line x1="0" y1="'+(vT-6)+'" x2="'+(W-padR+4)+'" y2="'+(vT-6)+'" stroke="'+P.grid+'" stroke-width=".5"/><line x1="0" y1="'+(dT-6)+'" x2="'+(W-padR+4)+'" y2="'+(dT-6)+'" stroke="'+P.grid+'" stroke-width=".5"/>';
 return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+sep+c+poly(MA7,P.ma1)+poly(MA30,P.ma2)+v+m+last+lab+'</svg>';}

/* ---------- 品种徽章 ---------- */
var COIN={
 BTC:['#F9B34A','#EE7A12','G:\u20BF'],
 ETH:['#8F97F2','#4B54C8','P:M12 2.6l5.6 9.1-5.6 3.3-5.6-3.3z|M12 21.6l5.6-7.9-5.6 3.3-5.6-3.3z'],
 SOL:['#19F0A0','#9945FF','P:M5.4 7.4h11.4l2.2-2.6H7.6z|M5.4 13.3h11.4l2.2-2.6H7.6z|M5.4 19.2h11.4l2.2-2.6H7.6z'],
 BNB:['#F8D661','#EFB40A','P:M12 3.1l2.6 2.6L12 8.3 9.4 5.7z|M12 15.7l2.6 2.6L12 20.9l-2.6-2.6z|M5.7 9.4l2.6 2.6-2.6 2.6L3.1 12z|M18.3 9.4l2.6 2.6-2.6 2.6L15.7 12z|M12 9.4l2.6 2.6-2.6 2.6L9.4 12z'],
 DOGE:['#E3C368','#BFA033','G:\u00D0'],
 XRP:['#5B667A','#252B33','X'],
 SUI:['#7CC6F7','#3E8FF0','P:M12 3.2c3.7 4.4 5.8 6.9 5.8 9.7a5.8 5.8 0 1 1-11.6 0c0-2.8 2.1-5.3 5.8-9.7z'],
 LINK:['#6AA0FF','#2450D4','H']};
function coin(sym,sz){sz=sz||36;var c=COIN[sym]||['#9A93B8','#5A5478','G:'+sym.charAt(0)],inner;
 if(c[2]==='X')inner='<path d="M6.2 5.6l3.6 3.7a3.1 3.1 0 0 0 4.4 0l3.6-3.7" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/><path d="M6.2 18.4l3.6-3.7a3.1 3.1 0 0 1 4.4 0l3.6 3.7" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>';
 else if(c[2]==='H')inner='<path d="M12 3.2l7.2 4.2v8.9L12 20.5l-7.2-4.2V7.4z" fill="none" stroke="#fff" stroke-width="2"/>';
 else if(c[2].indexOf('G:')===0)inner='<text x="12" y="16.8" text-anchor="middle" font-size="14.5" font-weight="700" font-family="-apple-system,Helvetica" fill="#fff">'+c[2].slice(2)+'</text>';
 else inner=c[2].slice(2).split('|').map(function(p){return '<path d="'+p+'" fill="#fff"/>';}).join('');
 return '<span class="cn" style="width:'+sz+'px;height:'+sz+'px;background:linear-gradient(140deg,'+c[0]+','+c[1]+');box-shadow:0 8px 16px -9px '+c[1]+'">'
  +'<svg viewBox="0 0 24 24" width="'+Math.round(sz*0.62)+'" height="'+Math.round(sz*0.62)+'">'+inner+'</svg></span>';}

/* ---------- 图标 ---------- */
var IP={
 favf:'FILL:M12 3.6l2.42 4.9 5.41.79-3.92 3.82.93 5.39L12 15.95l-4.84 2.55.93-5.39L4.17 9.29l5.41-.79z',
 list:'M4.4 7h9.6M4.4 12h9.6M4.4 17h6.4|M18.4 4.8l1.2 2.42 2.67.39-1.93 1.88.46 2.66-2.4-1.26-2.39 1.26.46-2.66-1.94-1.88 2.68-.39z',
 review:'M20.4 12a8.4 8.4 0 1 1-2.6-6.08|M18.3 2.6v3.6h-3.6|M12 7.7v4.55l2.9 1.7',
 note:'M4.6 19.4l1.1-3.9L16.9 4.3a1.9 1.9 0 0 1 2.7 2.7L8.5 18.3z|M14.9 6.4l2.7 2.7',
 tune:'M4 7h7M15.6 7h4.4M4 12h2.6M11.2 12h8.8M4 17h8.8M17.4 17h2.6|O13,7,2.3|O8.8,12,2.3|O15,17,2.3',
 search:'M15.6 15.6L20.2 20.2|O11,11,6.3',
 bell:'M18 15.6v-4.8a6 6 0 1 0-12 0v4.8l-1.6 2.6h15.2z|M10 21.1h4',
 folder:'M3.6 7.6a2 2 0 0 1 2-2h3.1l1.9 2.1h7.8a2 2 0 0 1 2 2v8.2a2 2 0 0 1-2 2H5.6a2 2 0 0 1-2-2z',
 down:'M5.2 9.6l6.8 7 6.8-7',up:'M5.2 14.4l6.8-7 6.8 7',
 draw:'M3.6 19.8l6-7.4 3.9 3 7.1-9.8|O9.6,12.4,1.6|O3.6,19.8,1.4'};
function ic(n,sz,w){sz=sz||20;w=w||1.75;var d=IP[n]||'';
 if(d.indexOf('FILL:')===0)return '<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'"><path fill="currentColor" d="'+d.slice(5)+'"/></svg>';
 var out='';d.split('|').forEach(function(p){
  if(p.charAt(0)==='O'){var a=p.slice(1).split(',');out+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="'+a[2]+'" fill="none" stroke="currentColor" stroke-width="'+w+'"/>';}
  else out+='<path d="'+p+'" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';});
 return '<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'">'+out+'</svg>';}

/* ---------- 迷你走势 ---------- */
var _sid=0;
function spark(seed,up,w,h){w=w||60;h=h||26;var r=rng(seed),p=0,a=[];
 for(var i=0;i<26;i++){p+=(r()-0.48)*2;a.push(p);}
 var mn=Math.min.apply(null,a),mx=Math.max.apply(null,a),rg=(mx-mn)||1;
 var pts=a.map(function(v,i){return (i/25*w).toFixed(1)+','+(h-2-(v-mn)/rg*(h-5)).toFixed(1);});
 var col=up?'var(--up)':'var(--dn2)',id='sp'+(++_sid);
 return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'
  +'<stop offset="0" stop-color="'+col+'" stop-opacity=".36"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
  +'<polygon points="0,'+h+' '+pts.join(' ')+' '+w+','+h+'" fill="url(#'+id+')"/>'
  +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';}

/* ---------- 零件 ---------- */
var FAV=[['BTC','USDT',75942.00,-2.12],['ETH','USDT',3184.62,-1.48],['SOL','USDT',213.40,2.31],['BNB','USDT',842.17,0.36],
         ['DOGE','USDT',0.3412,-5.64],['XRP','USDT',2.8140,1.02],['SUI','USDT',4.1820,-0.77],['LINK','USDT',26.940,3.18]];
function sb(){return '<div class="sb"><span>9:41</span><span><u></u></span></div>';}
function topbar(st){return '<div class="top">'+coin('BTC',st.badge||29)
 +'<div class="symw"><div class="s1">BTC<em>/USDT</em>'+ic('down',11,2.4)+'</div><div class="s2"><span class="dotg"></span>实时 · 永续</div></div>'
 +'<span class="rbtn">'+ic('bell',15)+'</span><span class="rbtn star">'+ic('favf',16)+'</span></div>';}
function tabs(a){var it=function(k,n,l){return '<a'+(a===k?' class="on"':'')+'><u>'+ic(n,18)+'</u>'+l+'</a>';};
 return '<div class="tabs">'+it('fav','list','自选')+it('rev','review','复盘')
  +'<a class="hero"><u>'+ic('note',17,1.95)+'</u>记一笔</a>'+it('set','tune','调图')+'</div>';}
