<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0912;color:#EFECFB;font:14px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;padding:56px 32px 130px}
.wrap{max-width:1420px;margin:0 auto}

.pal{display:grid;grid-template-columns:1fr 1fr;gap:26px}

.iset.d{background:#0E0C18;border:1px solid rgba(255,255,255,.1)}

.ii{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:10px;letter-spacing:.05em}
.iset.d .ii{color:#7B73A0}.iset.d .ii svg{color:#EFECFB}
.iset.l .ii{color:#8C86AC}.iset.l .ii svg{color:#1A1630}
.pair{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:56px;align-items:flex-start}
.pmeta{width:214px;flex:none;padding-top:14px}

.device{width:409px;padding:8px;border-radius:54px;background:linear-gradient(160deg,#4a4560,#1a1824 40%,#2b2740);box-shadow:0 36px 68px -24px rgba(0,0,0,.8);flex:none}
.phone{width:393px;height:852px;border-radius:46px;overflow:hidden;position:relative}
.cap{margin-top:13px;text-align:center;font-size:11px;color:#7B73A0;letter-spacing:.16em}

/* ================= 主题 ================= */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink1);overflow:hidden;font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif}
.dk{--bg:#0A0912;--card:#151222;--surf:rgba(255,255,255,.062);--surf2:rgba(255,255,255,.1);--glass:rgba(23,20,38,.86);--gline:rgba(255,255,255,.12);
    --ink1:#F5F3FF;--ink2:#9A93B8;--ink3:#635C82;--rule:rgba(255,255,255,.075);
    --up:#2FD39A;--dn2:#FF5C7A;--acc:#8B7CFF;--acc2:#FF6FB5;--accInk:#FFFFFF;--shadow:0 16px 34px -14px rgba(0,0,0,.8)}
.lt{--bg:#F5F3FC;--card:#FFFFFF;--surf:rgba(106,75,232,.065);--surf2:rgba(106,75,232,.11);--glass:rgba(255,255,255,.92);--gline:rgba(106,75,232,.16);
    --ink1:#1A1630;--ink2:#6B6590;--ink3:#A49EC2;--rule:#E9E5F6;
    --up:#0E9F72;--dn2:#E0384F;--acc:#6A4BE8;--acc2:#F0519B;--accInk:#FFFFFF;--shadow:0 16px 32px -14px rgba(66,45,145,.24)}
.num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.grad{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.sb{height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 4px;font:650 15px/1 -apple-system;flex:none;position:relative;z-index:3}
.sb u{display:block;width:17px;height:10px;border:1.4px solid currentColor;border-radius:3px;opacity:.5;text-decoration:none}
.mesh{position:absolute;left:0;right:0;top:-120px;height:420px;pointer-events:none;
 background:radial-gradient(42% 52% at 16% 34%,color-mix(in srgb,var(--acc) 62%,transparent),transparent 70%),
            radial-gradient(40% 48% at 86% 12%,color-mix(in srgb,var(--hue) 58%,transparent),transparent 72%),
            radial-gradient(46% 44% at 62% 62%,color-mix(in srgb,var(--acc2) 40%,transparent),transparent 72%);
 filter:blur(44px);opacity:.42}
.lt .mesh{opacity:.55;filter:blur(40px)}
.hdr{position:relative;flex:none}
.top{height:46px;display:flex;align-items:center;gap:11px;padding:0 17px}
.cn{width:36px;height:36px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;position:relative}
.cn:after{content:"";position:absolute;inset:0;border-radius:13px;border:1px solid rgba(255,255,255,.26)}
.symw{flex:1;min-width:0}
.symw .s1{font-size:15.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:5px}
.symw .s1 em{font-style:normal;color:var(--ink3);font-weight:500;font-size:11.5px}
.symw .s2{font-size:10px;color:var(--ink3);letter-spacing:.1em;margin-top:2px;display:flex;align-items:center;gap:5px}
.dotg{width:5px;height:5px;border-radius:9px;background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent)}
.rbtn{width:34px;height:34px;border-radius:12px;background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.rbtn.star{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 30%,transparent),color-mix(in srgb,var(--acc2) 30%,transparent));color:var(--acc)}
.lt .rbtn.star{color:var(--acc)}
.price{padding:14px 17px 0;position:relative}
.prow2{display:flex;align-items:center;gap:11px}
.pnow{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:5px 10px 5px 8px;border-radius:99px;color:#fff;letter-spacing:-.01em}
.stats{display:flex;gap:8px;margin-top:15px}
.stats div{flex:1;background:var(--surf);border-radius:15px;padding:9px 10px 10px}
.stats i{font-style:normal;display:block;font-size:9px;color:var(--ink3);letter-spacing:.14em}
.stats b{display:block;font-weight:650;font-size:12.5px;margin-top:4px;letter-spacing:-.015em}
.iv{display:flex;align-items:center;gap:7px;padding:15px 17px 13px;flex:none;overflow:hidden}
.iv a{font-size:12.5px;color:var(--ink2);padding:7px 12px;border-radius:99px;background:var(--surf);font-weight:550}
.iv a.on{color:#fff;font-weight:700;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 18px -8px var(--acc)}
.iv a.gh{background:transparent;color:var(--ink3);padding:7px 6px}
.iv a.draw{background:var(--surf2);color:var(--ink1);display:flex;align-items:center;gap:5px;font-weight:650}
.chart{flex:1;min-height:0;position:relative}
.chart svg{display:block;width:100%;height:100%}
.tabs{height:88px;flex:none;display:flex;align-items:flex-start;padding:9px 12px 0;background:var(--bg);border-top:1px solid var(--rule);position:relative;z-index:3}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink3);font-size:10px;font-weight:600;letter-spacing:.05em}
.tabs a u{width:46px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.tabs a.on{color:var(--acc)}
.tabs a.on u{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.tabs a.hero u{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 10px 20px -8px var(--acc)}
.tabs a.hero{color:var(--ink2)}
.dim{position:absolute;inset:0;background:rgba(6,4,14,.56)}
.lt .dim{background:rgba(40,28,88,.26)}
.layer{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;overflow:hidden;background:var(--glass);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-bottom:1px solid var(--gline);border-radius:0 0 34px 34px;box-shadow:0 32px 62px rgba(0,0,0,.5)}
.lt .layer{box-shadow:0 32px 62px rgba(52,36,120,.2)}
.sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;background:var(--glass);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-top:1px solid var(--gline);border-radius:34px 34px 0 0;box-shadow:0 -30px 62px rgba(0,0,0,.56)}
.lt .sheet{box-shadow:0 -30px 62px rgba(52,36,120,.22)}
.hz{height:5px;width:130px;background:var(--ink1);opacity:.24;border-radius:3px;margin:0 auto}
.grab{height:4px;width:40px;background:var(--ink1);opacity:.22;border-radius:3px;margin:0 auto}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.dk .card{background:rgba(255,255,255,.05)}
.srch{height:44px;border-radius:16px;background:var(--surf);display:flex;align-items:center;gap:9px;padding:0 14px;color:var(--ink3);font-size:14px}
.chipx{font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:99px;color:var(--ink2);background:var(--surf)}
.chipx.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 16px -8px var(--acc)}
.swt{width:45px;height:27px;border-radius:99px;position:relative;flex:none}
.swt:after{content:"";position:absolute;top:2.5px;width:22px;height:22px;border-radius:99px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.on2{background:linear-gradient(135deg,var(--acc),var(--acc2))}.on2:after{right:2.5px}
.off2{background:var(--surf2)}.off2:after{left:2.5px;background:var(--ink3);opacity:.7}
.lt .off2{background:#E4E0F2}.lt .off2:after{background:#fff;opacity:1}
</style></head>
<body><div class="wrap">
<h1>看盘 · 视觉系统「霓」</h1>
<p class="lede">一套系统，<b>夜相 / 昼相</b>两套主题。设计上只守两条：<b>数字不当巨无霸</b>——最新价 30pt，涨跌幅做成一枚实心药丸，让颜色和形状去喊，而不是靠字号砸人；<b>该有的漂亮元素一个不少</b>——品种一律带品牌渐变徽章，自选行内嵌迷你走势，周期条、开关、底栏全部走「靛紫→品红」这条主渐变。K 线与指标画法保持现状不动。</p>
<h2>色 彩</h2><div id="pal" class="pal"></div><div id="grads" class="gradrow"></div>
<h2>品 种 徽 章</h2><div id="coins"></div>
<h2>图 标</h2><div id="icons" class="icons"></div>
<h2>屏 幕</h2><div id="screens"></div>
</div>
<script>
/* ---------- 数据 ---------- */
function rng(s){return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;}}
function series(n,seed){var r=rng(seed),p=0,o=[];for(var i=0;i<n;i++){var a=p,c=a-0.42+(r()-0.5)*3.1,h=Math.max(a,c)+r()*1.35,l=Math.min(a,c)-r()*1.35;o.push({o:a,h:h,l:l,c:c,v:0.30+r()*0.85});p=c;}
 var f=o[0].o,la=o[n-1].c,A=77588,B=75942,k=(B-A)/(la-f);o.forEach(function(d){['o','h','l','c'].forEach(function(K){d[K]=A+(d[K]-f)*k;});});return o;}
var S=series(62,20260916),P0=S[0].o,PN=S[S.length-1].c;
var HI=Math.max.apply(null,S.map(function(d){return d.h;})),LO=Math.min.apply(null,S.map(function(d){return d.l;}));
var CHG=(PN-P0)/P0*100;
function f2(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function ma(k){return S.map(function(_,i){if(i<k-1)return null;var s=0;for(var j=i-k+1;j<=i;j++)s+=S[j].c;return s/k;});}
var MA7=ma(7),MA30=ma(30);
function fnum(v){return v<10?v.toFixed(4):v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function sgn(v){return (v>=0?'+':'\u2212')+Math.abs(v).toFixed(2)+'%';}

/* ---------- K 线底座（保持现状，仅随主题换浅深） ---------- */
function chart(P){
 var W=393,H=470,padR=54,x0=6,cw=(W-padR-x0)/S.length,bw=Math.max(3,cw*0.62);
 var mT=8,mH=282,vT=302,vH=62,dT=376,dH=62,lo=LO-40,hi=HI+40;
 var y=function(p){return mT+(hi-p)/(hi-lo)*mH;},g='';
 for(var i=0;i<=4;i++){var gy=mT+mH/4*i;
  g+='<line x1="0" y1="'+gy+'" x2="'+(W-padR+4)+'" y2="'+gy+'" stroke="'+P.grid+'" stroke-width=".5"/>'
   +'<text x="'+(W-padR+8)+'" y="'+(gy+3.4)+'" fill="'+P.axis+'" font-size="9" font-family="ui-monospace,monospace">'+f2(hi-(hi-lo)/4*i).split('.')[0]+'</text>';}
 var c='';S.forEach(function(d,i){var cx=x0+cw*i+cw/2,col=d.c>=d.o?P.up:P.down;
  c+='<line x1="'+cx.toFixed(1)+'" y1="'+y(d.h).toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+y(d.l).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
  var yy=Math.min(y(d.o),y(d.c)),hh=Math.max(1,Math.abs(y(d.o)-y(d.c)));
  c+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+col+'"/>';});
 function poly(a,col){return '<polyline points="'+a.map(function(v,i){return v==null?null:(x0+cw*i+cw/2).toFixed(1)+','+y(v).toFixed(1);}).filter(Boolean).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1" stroke-linejoin="round"/>';}
 var mv=Math.max.apply(null,S.map(function(d){return d.v;})),v='';
 S.forEach(function(d,i){var cx=x0+cw*i+cw/2,hh=d.v/mv*(vH-8);
  v+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(vT+vH-hh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+(d.c>=d.o?P.up:P.down)+'" opacity=".5"/>';});
 var dif=S.map(function(_,i){return (MA7[i]==null||MA30[i]==null)?null:(MA7[i]-MA30[i]);});
 var md=Math.max.apply(null,dif.filter(function(x){return x!=null;}).map(Math.abs))||1,m='',mid=dT+dH/2;
 dif.forEach(function(val,i){if(val==null)return;var cx=x0+cw*i+cw/2,hh=val/md*(dH/2-6);
  m+='<rect x="'+(cx-bw/2+0.6).toFixed(1)+'" y="'+(val>=0?mid-hh:mid).toFixed(1)+'" width="'+(bw-1.2).toFixed(1)+'" height="'+Math.max(0.8,Math.abs(hh)).toFixed(1)+'" fill="'+(val>=0?P.up:P.down)+'" opacity=".78"/>';});
 var lab='<text x="10" y="'+(mT+11)+'" fill="'+P.axis+'" font-size="9" font-family="ui-monospace,monospace">MA7 '+f2(MA7[61])+'  MA30 '+f2(MA30[61])+'</text>'
  +'<text x="10" y="'+(vT+11)+'" fill="'+P.axis+'" font-size="9" font-family="ui-monospace,monospace">VOL</text>'
  +'<text x="10" y="'+(dT+11)+'" fill="'+P.axis+'" font-size="9" font-family="ui-monospace,monospace">MACD 12 26 9</text>';
 var ly=y(PN);
 var last='<line x1="0" y1="'+ly.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+ly.toFixed(1)+'" stroke="'+P.down+'" stroke-width=".7" stroke-dasharray="2 3" opacity=".85"/>'
  +'<rect x="'+(W-padR+3)+'" y="'+(ly-8).toFixed(1)+'" width="49" height="16" rx="3" fill="'+P.down+'"/>'
  +'<text x="'+(W-padR+7)+'" y="'+(ly+3.6).toFixed(1)+'" fill="#fff" font-size="9.5" font-family="ui-monospace,monospace">'+f2(PN)+'</text>';
 var sep='<line x1="0" y1="'+(vT-6)+'" x2="'+(W-padR+4)+'" y2="'+(vT-6)+'" stroke="'+P.grid+'" stroke-width=".5"/><line x1="0" y1="'+(dT-6)+'" x2="'+(W-padR+4)+'" y2="'+(dT-6)+'" stroke="'+P.grid+'" stroke-width=".5"/>';
 return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+sep+c+poly(MA7,P.ma1)+poly(MA30,P.ma2)+v+m+last+lab+'</svg>';}
var PD={grid:'rgba(255,255,255,.055)',axis:'#635C82',up:'#2FD39A',down:'#FF5C7A',ma1:'#C9A227',ma2:'#5B8DEF'};
var PL={grid:'#ECE8F8',axis:'#A49EC2',up:'#0E9F72',down:'#E0384F',ma1:'#B8892B',ma2:'#4A6FA5'};

/* ---------- 品种徽章 ---------- */
var COIN={
 BTC:['#F9B34A','#EE7A12','G:\u20BF'],
 ETH:['#8F97F2','#4B54C8','P:M12 2.6l5.6 9.1-5.6 3.3-5.6-3.3z|M12 21.6l5.6-7.9-5.6 3.3-5.6-3.3z'],
 SOL:['#19F0A0','#9945FF','P:M5.4 7.4h11.4l2.2-2.6H7.6z|M5.4 13.3h11.4l2.2-2.6H7.6z|M5.4 19.2h11.4l2.2-2.6H7.6z'],
 BNB:['#F8D661','#EFB40A','P:M12 3.1l2.6 2.6L12 8.3 9.4 5.7z|M12 15.7l2.6 2.6L12 20.9l-2.6-2.6z|M5.7 9.4l2.6 2.6-2.6 2.6L3.1 12z|M18.3 9.4l2.6 2.6-2.6 2.6L15.7 12z|M12 9.4l2.6 2.6-2.6 2.6L9.4 12z'],
 DOGE:['#E3C368','#BFA033','G:\u00D0'],
 XRP:['#5B667A','#252B33','P:M6.2 5.6l3.6 3.7a3.1 3.1 0 0 0 4.4 0l3.6-3.7|M6.2 18.4l3.6-3.7a3.1 3.1 0 0 1 4.4 0l3.6 3.7'],
 SUI:['#7CC6F7','#3E8FF0','P:M12 3.2c3.7 4.4 5.8 6.9 5.8 9.7a5.8 5.8 0 1 1-11.6 0c0-2.8 2.1-5.3 5.8-9.7z'],
 LINK:['#6AA0FF','#2450D4','P:M12 3l7.4 4.3v9L12 20.6 4.6 16.3v-9z'],
 AAPL:['#B9BFC9','#6E7681','G:\uF8FF'],
 NVDA:['#9BE36A','#4E9B1F','G:N'],TSLA:['#FF8A9B','#D22A44','G:T'],AVAX:['#FF8C94','#E3373F','G:A']
};
function coin(sym,sz,r){sz=sz||36;r=r||13;var c=COIN[sym]||['#9A93B8','#5A5478','G:'+sym.charAt(0)];
 var id='g'+sym+sz+Math.round(Math.random()*1e6),inner;
 if(c[2].indexOf('G:')===0){inner='<text x="12" y="16.6" text-anchor="middle" font-size="14.5" font-weight="700" font-family="-apple-system,Helvetica" fill="#fff">'+c[2].slice(2)+'</text>';}
